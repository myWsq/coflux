[package]
name = "coflux-relay"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "coflux-relay"
path = "src/main.rs"

[dependencies]
# 只取 MAX_DEVICE_FRAME_BYTES 等常量做单一真相；刻意不使用任何 DeviceEnvelope 编解码。
coflux-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# 明文 WS 即可：TLS 由部署侧（Caddy）终结，与 server 同一惯例。
tokio-tungstenite = "0.24"
futures-util = "0.3"
ed25519-dalek = "2"
serde = { workspace = true }
serde_json.workspace = true
base64 = "0.22"
hex = "0.4"
