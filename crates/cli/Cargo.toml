[package]
name = "coflux-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

# 二进制名必须是 cofluxd：Claude 插件的 hooks.json / SKILL.md 全部写死这个名字（plan 112）。
# 与 npm 版 packages/cli/cofluxd.mjs 并存——coflux 终端里靠 supervisor 前置的 $COFLUX_HOME/bin 命中本二进制。
[[bin]]
name = "cofluxd"
path = "src/main.rs"

[dependencies]
# 只为 LOCAL_GATEWAY_PORT 常量（与 worker / npm 版 CLI 同一真相源）。
coflux-protocol = { path = "../protocol" }
serde_json.workspace = true
# getppid：/agent 与 /hook 请求体都带 ppid，worker 用调用方进程反查会话归属。
libc = "0.2"
# 账号命令使用系统独立的 HTTPS 通道，不要求 Node 或 MCP 宿主。
ureq = { version = "2", features = ["json"] }
url = "2"
