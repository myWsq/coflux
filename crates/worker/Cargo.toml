[package]
name = "coflux-worker"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "coflux-worker"
path = "src/main.rs"

[dependencies]
coflux-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json.workspace = true
# wire 信封（DaemonToServer/ServerToDaemon）编解码：main.rs / tunnel.rs 直接用 prost::Message。
prost = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
# 必须开 TLS feature 才能连 wss://（生产/staging 经 Caddy 走 HTTPS）；
# 默认无 TLS 时连 wss 会抛 "TLS support not compiled in"。用 rustls + 内置根证书：纯 Rust、交叉编译/分发免依赖系统 OpenSSL 与根证书库。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# 固定 rustls 只用 ring provider，关掉默认 aws-lc-rs：交叉编译（musl）友好、无需 C 工具链；
# 且避免依赖树里两个 provider 并存时 rustls 无法自动选定而 panic。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# relay /healthz 的 HTTPS GET 复用同一 rustls + Mozilla 根证书栈；不引 OpenSSL。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
futures-util = "0.3"
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

# 端口探测（005）仅 macOS 侧需要：同 uid 无特权枚举进程 fd/socket 信息（listpidinfo/pidfdinfo），
# 不需要 root、不 fork lsof 子进程。Linux 手撸 /proc，其余平台空实现，故只在 macOS target 引入。
# libc：agent 探测（plan 073）读 KERN_PROCARGS2 取进程 argv（libproc 未封装该 sysctl）。
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
libc = "0.2"
