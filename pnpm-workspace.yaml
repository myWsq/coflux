packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests'
allowBuilds:
  esbuild: true
  # Electron 42+ 的 postinstall 不再下载二进制（首次运行才懒下载），但 pnpm 11 默认拦截依赖 build 脚本，
  # 不放行会让 electron 包处于半安装态、报错不直观（plan 103）。
  electron: true
  # electron-builder 的 Windows 安装器依赖：本项目只发 macOS，显式拒绝其 build 脚本，否则 pnpm 11 把
  # 「未审批的 build 脚本」当作 install 失败。
  electron-winstaller: false
  # pi（@earendil-works/pi-coding-agent，plan 116）带进来的两个传递依赖。两者的 build 脚本本项目都不需要：
  # executor 的 provider 由用户在桌面里配，Google 那条路即便走到也只用 SDK 的运行时部分。显式拒绝而不是
  # 留空——pnpm 11 把「未表态的 build 脚本」当 install 失败，会让 typecheck / CI 直接红。
  '@google/genai': false
  protobufjs: false
