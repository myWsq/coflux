name: Bug report
description: Report a reproducible problem with Coflux.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example and whether the terminal is local or remote.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Coflux version
      placeholder: Desktop 1.0.0 / cofluxd 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS 26, Apple Silicon / Ubuntu, x86_64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove account credentials, access tokens, private repository contents, and other sensitive information.
