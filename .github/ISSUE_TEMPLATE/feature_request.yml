name: Feature request
description: Suggest an improvement to Coflux.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the behavior you would like and any alternatives you have considered.
    validations:
      required: true
