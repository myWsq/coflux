name: desktop-release

# 由统一 v* 发布调用，只构建并上传桌面产物，不创建独立 release 或更新清单。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  metadata:
    name: 校验统一 release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tag
        name: 校验统一产品版本
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/product-version.mjs --check "$RELEASE_TAG")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # 内置组件与桌面使用同一提交和正式产品版本，签名由打包步骤统一完成。
  daemon:
    name: 构建内置 daemon（supervisor / worker / coflux）
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: transport/tailcat/go.sum
      - name: Build native transport and notices
        env:
          COFLUX_RELEASE_VERSION: v${{ needs.metadata.outputs.version }}
        run: node scripts/build-transport.mjs aarch64-apple-darwin target/aarch64-apple-darwin/release
      - name: cargo build（release，aarch64-apple-darwin）
        env:
          COFLUX_RELEASE_VERSION: v${{ needs.metadata.outputs.version }}
          RUSTFLAGS: -D warnings
        run: cargo build --release --target aarch64-apple-darwin -p coflux-supervisor -p coflux-worker -p coflux-cli
      - name: 整理 daemon 产物目录（三件 + VERSION 版本戳）
        env:
          COFLUX_RELEASE_VERSION: v${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release"
          mkdir -p daemon-bundle
          for name in coflux-supervisor coflux-worker coflux coflux-transport; do
            test -x "$bin/$name"
            cp "$bin/$name" "daemon-bundle/$name"
          done
          cp "$bin/TRANSPORT-NOTICES.txt" daemon-bundle/TRANSPORT-NOTICES.txt
          # VERSION 与编译期 COFLUX_RELEASE_VERSION 同值：主进程拿它与 ~/.coflux/supervisor-version 比较
          printf '%s\n' "$COFLUX_RELEASE_VERSION" > daemon-bundle/VERSION
          ls -la daemon-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-daemon-bundle
          if-no-files-found: error
          path: daemon-bundle

  build:
    name: 构建 + 签名 + 公证
    needs: [metadata, daemon]
    runs-on: macos-latest
    timeout-minutes: 60
    # 签名/公证 secret 挂在 release-signing environment；
    # 复用统一 release-signing environment，发布 tag 为 v*。
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 渲染层 build-id 取 git short SHA（apps/desktop/electron.vite.config.ts）：必须有完整 git 历史与 HEAD
          fetch-depth: 0

      - name: 发布所需 secret 必须齐全（缺任一项明确失败，不静默跳过签名或公证）
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_TEAM_ID NOTARY_API_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::release-signing environment 缺少 ${name}"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: desktop 类型检查（主进程 / preload / 渲染层）+ 单元测试
        run: pnpm -C apps/desktop typecheck && pnpm -C apps/desktop test

      # 内置 daemon 三件（plan 113）：artifact 不保留执行位，stage 脚本复制到 build/daemon/ 时统一补 0755；
      # 缺任一件脚本直接失败，不会静默出一个不带 daemon 的包。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-daemon-bundle
          path: ${{ runner.temp }}/daemon-bundle
      - name: 内置 daemon 三件 + VERSION 落到 build/daemon（electron-builder extraResources 源）
        env:
          COFLUX_DESKTOP_DAEMON_DIR: ${{ runner.temp }}/daemon-bundle
        run: |
          set -euo pipefail
          pnpm -C apps/desktop run stage-daemon
          grep -qx "v${{ needs.metadata.outputs.version }}" apps/desktop/build/daemon/VERSION

      - name: 构建 main / preload / renderer
        run: |
          set -euo pipefail
          pnpm -C apps/desktop build
          # build-id 只作标识上报（桌面按控制面协议版本准入，plan 105），不再要求与部署的 server 同 SHA；
          # 它就是构建时的 git short SHA（electron.vite.config.ts 的 define 注入）
          echo "::notice::桌面渲染层 build-id=$(git rev-parse --short HEAD)"

      # 证书导入沿用 release.yml 里已验证的做法：自己建临时 keychain、import、set-key-partition-list、加进搜索列表。
      # 不把 p12 交给 electron-builder 的 CSC_LINK：它自建 keychain 的 set-key-partition-list 在 GitHub runner 上报
      # 「passphrase 不正确」（2026-09-11 首发实测），改由 CSC_KEYCHAIN + CSC_NAME 指到现成的 keychain 与身份。
      - name: 导入 Developer ID 证书到临时 keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          KEYCHAIN="$RUNNER_TEMP/desktop-build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f -- "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Developer ID Application' >/dev/null
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: 写入公证 API key 文件
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # electron-builder 顺序：翻 Fuses → 签名（hardened runtime + entitlements）→ 公证 + staple → 出 dmg/zip
      # → 生成 latest-mac.yml。asar 完整性校验开着，签名后不再碰 app 内任何文件。
      # 不设 CSC_LINK：身份从上一步的 keychain（CSC_KEYCHAIN）按 CSC_NAME 找。CSC_NAME 不带
      # 「Developer ID Application:」前缀——electron-builder 按目标自动选证书类型，带前缀它直接报错。
      - name: 打包 + Developer ID 签名 + 公证（electron-builder）
        env:
          CSC_NAME: "Shuaiqi Wang (${{ secrets.APPLE_TEAM_ID }})"
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${CSC_KEYCHAIN:-}"
          pnpm -C apps/desktop exec electron-builder --mac --arm64 --publish never

      - name: 校验签名 / 公证票据 / Gatekeeper
        run: |
          set -euo pipefail
          app="apps/desktop/dist/mac-arm64/Coflux.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          # 内置 daemon 三件（plan 113）：存在、可执行、各自带 Developer ID 签名（mac.binaries 让它们进签名与公证）
          daemon="$app/Contents/Resources/daemon"
          for name in coflux-supervisor coflux-worker coflux coflux-transport; do
            test -x "$daemon/$name"
            codesign --verify --strict --verbose=2 "$daemon/$name"
            codesign -dv --verbose=2 "$daemon/$name" 2>&1 | grep -q 'Authority=Developer ID Application'
          done
          test -s "$daemon/VERSION"
          grep -qx "v${{ needs.metadata.outputs.version }}" "$daemon/VERSION"
          ls -la apps/desktop/dist
          # prerelease 可能生成 beta-mac.yml 等，仅规范化 artifact 文件名；父流程不会更新稳定源。
          if [ ! -f apps/desktop/dist/latest-mac.yml ]; then
            manifests=(apps/desktop/dist/*-mac.yml)
            test "${#manifests[@]}" -eq 1
            cp "${manifests[0]}" apps/desktop/dist/latest-mac.yml
          fi
          test -f apps/desktop/dist/latest-mac.yml
          grep -qx "version: ${{ needs.metadata.outputs.version }}" apps/desktop/dist/latest-mac.yml
          grep -q "coflux-${{ needs.metadata.outputs.version }}-arm64.zip" apps/desktop/dist/latest-mac.yml

      - name: 清理公证 API key 文件与临时 keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/desktop-build.keychain" >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-assets
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
