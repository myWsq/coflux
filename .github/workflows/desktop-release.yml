name: desktop-release

# 打 tag desktop-v* 触发（plan 103）：构建 apps/desktop → Developer ID 签名 + 公证 → GitHub Release 放安装包
# → 把 latest-mac.yml 改成该 Release 的绝对下载地址后推到 desktop-updates 分支（electron-updater 的 generic 源读
# raw.githubusercontent.com）。不用 electron-updater 的 github provider：它看仓库 releases/latest，而本仓库 daemon
# 的 v* 与桌面的 desktop-v* 混在一起。与 daemon 的 v* / release.yml 完全独立：桌面版本节奏与 daemon SemVer 无关。
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  metadata:
    name: 校验 desktop release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tag
        name: tag 是严格 SemVer、与 apps/desktop/package.json 一致、可从 origin/main 达到
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop-v}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::desktop release tag 不是严格 SemVer：${RELEASE_TAG}"
            exit 1
          fi
          pkg_version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::apps/desktop/package.json version=${pkg_version} 与 tag ${RELEASE_TAG} 不一致，先 bump 再打 tag"
            exit 1
          fi
          # lockstep（plan 103）：桌面 build-id 与部署的 web 必须同 SHA；这里只保证 tag 在 main 历史上，
          # 与 prod 部署的 SHA 是否一致由发版人按 docs/RELEASING.md 的规则负责。
          remote_main_ref="refs/release-validation/main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --force --no-tags origin "+refs/heads/main:${remote_main_ref}"
          if ! git merge-base --is-ancestor "$EVENT_SHA" "$remote_main_ref"; then
            echo "::error::release SHA ${EVENT_SHA} 不可从 origin/main 达到"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 + 签名 + 公证
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 60
    # 签名/公证 secret 挂在 release-signing environment；
    # 该 environment 的 deployment tag 规则必须同时放行 desktop-v*（见 docs/RELEASING.md）。
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 渲染层 build-id 取 git short SHA（apps/web/vite.config.ts）：必须有完整 git 历史与 HEAD
          fetch-depth: 0

      - name: 发布所需 secret 必须齐全（缺任一项明确失败，不静默跳过签名或公证）
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_TEAM_ID NOTARY_API_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::release-signing environment 缺少 ${name}"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: web 类型检查（渲染层就是 apps/web）
        run: node_modules/.bin/tsc -b apps/web/tsconfig.json

      - name: desktop 类型检查 + 单元测试
        run: pnpm -C apps/desktop typecheck && pnpm -C apps/desktop test

      - name: 构建 main / preload / renderer（build-id = 当前 SHA）
        run: |
          set -euo pipefail
          pnpm -C apps/desktop build
          build_id=$(cat apps/desktop/out/renderer/build-id.txt)
          head_short=$(git rev-parse --short HEAD)
          if [ "$build_id" != "$head_short" ]; then
            echo "::error::渲染层 build-id ${build_id} 与 HEAD ${head_short} 不一致——版本准入会拒绝这个包"
            exit 1
          fi
          echo "::notice::桌面渲染层 build-id=${build_id}（prod 部署到同一 SHA 才被中心接受）"

      # 证书导入沿用 release.yml 里已验证的做法：自己建临时 keychain、import、set-key-partition-list、加进搜索列表。
      # 不把 p12 交给 electron-builder 的 CSC_LINK：它自建 keychain 的 set-key-partition-list 在 GitHub runner 上报
      # 「passphrase 不正确」（2026-09-11 首发实测），改由 CSC_KEYCHAIN + CSC_NAME 指到现成的 keychain 与身份。
      - name: 导入 Developer ID 证书到临时 keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          KEYCHAIN="$RUNNER_TEMP/desktop-build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f -- "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Developer ID Application' >/dev/null
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: 写入公证 API key 文件
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # electron-builder 顺序：翻 Fuses → 签名（hardened runtime + entitlements）→ 公证 + staple → 出 dmg/zip
      # → 生成 latest-mac.yml。asar 完整性校验开着，签名后不再碰 app 内任何文件。
      # 不设 CSC_LINK：身份从上一步的 keychain（CSC_KEYCHAIN）按 CSC_NAME 找。
      - name: 打包 + Developer ID 签名 + 公证（electron-builder）
        env:
          CSC_NAME: Developer ID Application: Shuaiqi Wang (${{ secrets.APPLE_TEAM_ID }})
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${CSC_KEYCHAIN:-}"
          pnpm -C apps/desktop exec electron-builder --mac --arm64 --publish never

      - name: 校验签名 / 公证票据 / Gatekeeper
        run: |
          set -euo pipefail
          app="apps/desktop/dist/mac-arm64/coflux.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          ls -la apps/desktop/dist
          test -f apps/desktop/dist/latest-mac.yml
          grep -q "coflux-${{ needs.metadata.outputs.version }}-arm64.zip" apps/desktop/dist/latest-mac.yml

      - name: 清理公证 API key 文件与临时 keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/desktop-build.keychain" >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-assets
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml

  release:
    name: 发布 GitHub Release + 推送更新清单
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-assets
          path: assets
      - name: 生成 release 说明
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "coflux 桌面客户端 v${VERSION}（macOS 13+，Apple Silicon）。"
            echo
            echo "- 安装：下载 dmg，拖进 Applications。已签名并经苹果公证。"
            echo "- 自动更新：app 读仓库 desktop-updates 分支的 latest-mac.yml，安装包从本 Release 下载。"
            echo "- 渲染层 build-id 与本 tag 的 commit 同 SHA：中心必须部署到同一 SHA，否则桌面版会被版本准入拒绝直到下次更新。"
          } > notes.md
      # 安装包与 blockmap 先上 Release：清单随后才指向它们，客户端永远不会读到指向尚未上传文件的清单。
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: desktop v${{ needs.metadata.outputs.version }}
          body_path: notes.md
          files: |
            assets/*.dmg
            assets/*.zip
            assets/*.blockmap
      - name: 更新清单：latest-mac.yml 的相对文件名改成本 Release 的绝对下载地址
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/${TAG}"
          sed -E -e "s#^([[:space:]]*-?[[:space:]]*url: )(coflux-[^[:space:]]+)#\1${base}/\2#" \
                 -e "s#^(path: )(coflux-[^[:space:]]+)#\1${base}/\2#" assets/latest-mac.yml > latest-mac.yml
          grep -q "${base}/coflux-" latest-mac.yml
          cat latest-mac.yml
      - name: 推送清单到 desktop-updates 分支（app 的 generic 更新源读 raw.githubusercontent.com）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          git init -q updates
          cd updates
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q origin desktop-updates 2>/dev/null; then
            git checkout -q -B desktop-updates FETCH_HEAD
          else
            git checkout -q --orphan desktop-updates
          fi
          cp ../latest-mac.yml latest-mac.yml
          git add latest-mac.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "desktop v${VERSION}: latest-mac.yml"
          git push -q origin desktop-updates
