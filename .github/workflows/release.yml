name: release

# 唯一产品发布入口：v* 同时构建桌面、内核及 CLI；完整产物发布后推进桌面清单和 npm。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# GitHub 默认只保留 one-running/one-pending；burst 时新 run 会取代旧 pending，
# 是 latest-pending-wins 而非 FIFO。RELEASING.md 因此禁止批量/连续推多个 tag。
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The GitHub Release asset set, used verbatim by the `release` job. The R2 download mirror upload
  # (`mirror-upload`) derives its set from the same globs minus the .dmg, which the mirror serves only
  # under a version-less alias, so the two can never drift apart.
  RELEASE_FILES: |
    signed-release/artifacts/*
    desktop-assets/*.dmg
    desktop-assets/*.zip
    desktop-assets/*.blockmap
    desktop-assets/latest-mac.yml

jobs:
  metadata:
    name: 校验 release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 确认 release SHA 是当前 origin/main tip
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 这只是防“在旧/分叉 commit 上误打新 tag”的操作门，不是权限边界；
          # 真正的 create/update/delete 授权必须由 GitHub v* tag ruleset 承担。
          remote_main_ref="refs/release-validation/main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --force --no-tags origin \
            "+refs/heads/main:${remote_main_ref}"
          origin_main_sha=$(git rev-parse --verify "${remote_main_ref}^{commit}")
          if ! git merge-base --is-ancestor "$EVENT_SHA" "$origin_main_sha"; then
            echo "::error::release SHA ${EVENT_SHA} 不可从当前 origin/main ${origin_main_sha} 达到"
            exit 1
          fi
          if [ "$EVENT_SHA" != "$origin_main_sha" ]; then
            echo "::error::release tag 必须打在当前 origin/main tip：${origin_main_sha}（事件 SHA：${EVENT_SHA}）"
            exit 1
          fi
      - name: 校验桌面、CLI 与产品版本一致
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/product-version.mjs --check "$RELEASE_TAG"
      - id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const tag = process.env.RELEASE_TAG || "";
          const pattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          const parse = (value) => {
            const match = pattern.exec(value);
            if (!match || (match[4] || "").split(".").some((part) => /^0\d+$/.test(part))) return undefined;
            return {
              tag: value,
              core: [BigInt(match[1]), BigInt(match[2]), BigInt(match[3])],
              prerelease: !!match[4],
            };
          };
          const current = parse(tag);
          if (!current) {
            console.error(`::error::release tag 不是严格 SemVer：${JSON.stringify(tag)}`);
            process.exit(1);
          }
          if (!current.prerelease) {
            const compareCore = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] < right[index]) return -1;
                if (left[index] > right[index]) return 1;
              }
              return 0;
            };
            const previousStable = execFileSync("git", ["tag", "--list", "v*"], { encoding: "utf8" })
              .split("\n")
              .map((candidate) => parse(candidate.trim()))
              .filter((candidate) => candidate && !candidate.prerelease && candidate.tag !== tag)
              .sort((left, right) => compareCore(right.core, left.core))[0];
            if (previousStable && compareCore(current.core, previousStable.core) <= 0) {
              console.error(`::error::稳定 release ${tag} 必须高于已有最新版 ${previousStable.tag}`);
              process.exit(1);
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${current.prerelease ? "true" : "false"}\n`);
          NODE

  desktop:
    name: 构建桌面安装包
    needs: [metadata, quality]
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit
    permissions:
      contents: read

  # tag 发布的唯一完整质量门；npm-publish 只在本 workflow 全部成功后接力。
  quality:
    name: 发布前质量门
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.sha }}
    permissions:
      contents: read

  build:
    name: build ${{ matrix.target }}
    needs: [metadata, quality]
    runs-on: ${{ matrix.os }}
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.cross
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cross

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: transport/tailcat/go.sum
      - name: Build native transport and notices
        env:
          COFLUX_RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/build-transport.mjs ${{ matrix.target }} target/${{ matrix.target }}/release

      - name: 构建
        env:
          # launcher / runtime compile-time version (crates/launcher and crates/runtime main.rs, build.rs).
          COFLUX_RELEASE_VERSION: ${{ github.ref_name }}
          RUSTFLAGS: -D warnings
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p coflux-launcher -p coflux-runtime -p coflux-cli -p coflux-ptyd
          else
            cargo build --release --target ${{ matrix.target }} -p coflux-launcher -p coflux-runtime -p coflux-cli -p coflux-ptyd
          fi

      # macOS 专属：cargo 交叉/原生编译产物只有 ad-hoc 签名，launchd 直接 spawn 的新鲜下载二进制
      # 会被 Gatekeeper 判 OS_REASON_CODESIGNING 静默 SIGKILL（本地手动重签名可绕过，但正式发布用
      # 真 Developer ID 证书签名 + 公证从根上解决，用户端零手动步骤）。裸二进制不支持 stapling
      # （仅 .app/.pkg/.dmg 支持），故不 staple——Gatekeeper 首次执行时联网向苹果查公证记录。
      - name: Apple 签名 + 公证（仅 macOS）
        if: ${{ !matrix.cross }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          cleanup_apple_signing() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f -- "$CERT_PATH" "$KEY_PATH"
          }
          trap cleanup_apple_signing EXIT

          echo -n "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          echo -n "$NOTARY_API_KEY_P8" > "$KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          SIGN_ID="Developer ID Application: Shuaiqi Wang (${APPLE_TEAM_ID})"
          bin="target/${{ matrix.target }}/release"
          for name in coflux-launcher coflux-runtime coflux coflux-transport coflux-ptyd; do
            codesign --force --options runtime --timestamp --sign "$SIGN_ID" "$bin/$name"
            ditto -c -k --keepParent "$bin/$name" "$RUNNER_TEMP/$name.zip"
            SUBMIT_OUT=$(xcrun notarytool submit "$RUNNER_TEMP/$name.zip" \
              --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait 2>&1) || {
              echo "$SUBMIT_OUT"
              SUB_ID=$(echo "$SUBMIT_OUT" | grep -m1 '  id:' | awk '{print $2}')
              [ -n "$SUB_ID" ] && xcrun notarytool log "$SUB_ID" --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
              exit 1
            }
            echo "$SUBMIT_OUT"
            codesign -dv --verbose=2 "$bin/$name"
          done

      - name: 打包产物
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release"
          # cofluxd tells a launcher with `watch` apart by this byte run; 2.16.0 lost it on x86_64.
          if ! LC_ALL=C grep -q -a -F "coflux-watch/1" "$bin/coflux-launcher"; then
            echo "::error::coflux-launcher for ${{ matrix.target }} does not contain coflux-watch/1"
            exit 1
          fi
          # Raw binaries use stable asset names; cofluxd resolves the exact tag, then downloads and
          # verifies by that tag's manifest (schema 3: runtime + launcher, no raw signatures).
          cp "$bin/coflux-launcher" "dist/coflux-launcher-${{ matrix.target }}"
          cp "$bin/coflux-runtime" "dist/coflux-runtime-${{ matrix.target }}"
          cp "$bin/coflux-transport" "dist/coflux-transport-${{ matrix.target }}"
          cp "$bin/TRANSPORT-NOTICES.txt" "dist/coflux-transport-NOTICES-${{ matrix.target }}.txt"
          cp "$bin/TRANSPORT-MODULES.txt" "dist/coflux-transport-MODULES-${{ matrix.target }}.txt"
          cp "$bin/coflux" "dist/coflux-cli-${{ matrix.target }}"
          cp "$bin/coflux-ptyd" "dist/coflux-ptyd-${{ matrix.target }}"
          # tar.gz contains launcher, runtime, ptyd, transport and the native CLI for manual installation
          tar -C "$bin" -czf "dist/coflux-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" coflux-launcher coflux-runtime coflux coflux-transport coflux-ptyd TRANSPORT-NOTICES.txt TRANSPORT-MODULES.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  sign:
    name: 签名 release 产物
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release note 要按 tag 区间数 commit，浅克隆没有历史
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: 签名 daemon 产物 + 生成 manifest/SHA256SUMS
        env:
          WORKER_SIGNING_KEY: ${{ secrets.WORKER_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-sign.mjs artifacts "$RELEASE_TAG"

      - name: 生成 release note
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md

      # 签名 job 只有 contents:read；后续 contents:write job 只拿不可变的同-run artifact，
      # 不接触 WORKER_SIGNING_KEY，避免发布 token 与离线发布根落在同一权限域。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-assets
          path: |
            artifacts/
            release-notes.md

  # Phase 1 of the R2 download mirror (plan 20260930-r2-download-mirror): the versioned objects of a
  # stable tag must be on R2 before the GitHub Release exists, because the server pushes worker
  # upgrades (whose manifest URLs point at dl.coflux.dev) as soon as it sees the Release.
  # No job-level `if`: `release` needs this job and a skipped dependency would skip `release` too, so
  # the job always runs and every step is a no-op for a prerelease, which is never mirrored.
  mirror-upload:
    name: Upload the release to the R2 download mirror
    needs: [metadata, sign, desktop]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Prereleases are not mirrored
        if: ${{ needs.metadata.outputs.prerelease != 'false' }}
        run: echo "::notice::${GITHUB_REF_NAME} is a prerelease; nothing is uploaded to the R2 download mirror"

      - name: R2 credentials must be complete (a missing value fails explicitly)
        if: ${{ needs.metadata.outputs.prerelease == 'false' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::release-signing environment is missing ${name}"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      - if: ${{ needs.metadata.outputs.prerelease == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ needs.metadata.outputs.prerelease == 'false' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - if: ${{ needs.metadata.outputs.prerelease == 'false' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-assets
          path: signed-release
      - if: ${{ needs.metadata.outputs.prerelease == 'false' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-assets
          path: desktop-assets

      # Overwrite gate: once the GitHub Release exists, the server and `cofluxd --version` may already
      # consume these objects, so their bytes must never change (docs/RELEASING.md: no full re-run
      # after publication). Only "release not found" means unpublished; any other error fails.
      - name: Is the GitHub Release already published?
        id: published
        if: ${{ needs.metadata.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if output=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            exists=true
          elif printf '%s' "$output" | grep -q 'release not found'; then
            exists=false
          else
            echo "::error::cannot tell whether GitHub Release ${RELEASE_TAG} exists: ${output}"
            exit 1
          fi
          echo "::notice::GitHub Release ${RELEASE_TAG} published: ${exists}"
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"

      - name: Upload releases/<tag>/ (refused for a published tag unless every object is identical)
        if: ${{ needs.metadata.outputs.prerelease == 'false' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EXISTS: ${{ steps.published.outputs.exists }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Unquoted on purpose: word-split RELEASE_FILES into its globs and expand them.
          files=($RELEASE_FILES)
          node scripts/release-mirror.mjs upload "$RELEASE_TAG" "$RELEASE_EXISTS" "${files[@]}"

  release:
    name: 发布 GitHub Release
    needs: [metadata, sign, desktop, mirror-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-assets
          path: signed-release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-assets
          path: desktop-assets

      - name: 发布前确认远程 tag 仍绑定事件 SHA
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$EVENT_SHA" ]; then
            echo "::error::checkout SHA ${checked_out_sha} 与 release 事件 SHA ${EVENT_SHA} 不一致"
            exit 1
          fi

          # checkout@v4 会把本地 tag 固定到事件 SHA；另取一个临时 ref，
          # 才能观察长时间签名/公证期间 origin 上的 tag 是否被删除或移动。
          remote_check_ref="refs/release-validation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:${remote_check_ref}"
          remote_tag_sha=$(git rev-parse --verify "${remote_check_ref}^{commit}")
          if [ "$remote_tag_sha" != "$EVENT_SHA" ]; then
            echo "::error::origin tag ${RELEASE_TAG} 已漂移：${remote_tag_sha}，事件 SHA：${EVENT_SHA}"
            exit 1
          fi

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          # 不传 target_commitish：tag 已存在且上一步已校验它绑定事件 SHA；action-gh-release v3 会把它原样带进
          # create-release 请求，撞上 v* tag 的不可变 ruleset 后 GITHUB_TOKEN 拿到 403（v0.32.0 首次发版实测）。
          name: Coflux ${{ github.ref_name }}
          files: ${{ env.RELEASE_FILES }}
          # 自建 note 取代 generate_release_notes：本仓库直接 push main，GitHub 的自动汇总
          # 只认 PR，产出永远是光秃秃一行 compare 链接。
          body_path: signed-release/release-notes.md
          prerelease: ${{ needs.metadata.outputs.prerelease }}

  desktop-updates:
    name: 更新稳定桌面更新源
    needs: [metadata, release]
    if: ${{ needs.metadata.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-assets
          path: assets
      - name: 推送清单到 desktop-updates 分支（app 的 generic 更新源读 raw.githubusercontent.com）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git init -q updates
          cd updates
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q origin desktop-updates 2>/dev/null; then
            git checkout -q -B desktop-updates FETCH_HEAD
          else
            git checkout -q --orphan desktop-updates
          fi
          node ../scripts/desktop-update-feed.mjs "$VERSION" ../assets/latest-mac.yml latest-mac.yml > "$RUNNER_TEMP/latest-mac.yml"
          cp "$RUNNER_TEMP/latest-mac.yml" latest-mac.yml
          git add latest-mac.yml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Coflux ${VERSION}: latest-mac.yml"
          git push -q origin desktop-updates

  # Phase 2 of the R2 download mirror: only after the GitHub Release succeeded (its tag-drift check
  # can still abort after the upload), and only for stable tags — the same gate as desktop-updates.
  # It also waits for desktop-updates, so the branch feed that installed apps read has moved to this
  # release before the previous release's zip is pruned. A failure here fails the run and therefore
  # blocks npm-publish, which is triggered only by a successful release run.
  mirror-pointers:
    name: Point the R2 download mirror at this release and prune older ones
    needs: [metadata, release, desktop-updates]
    if: ${{ needs.metadata.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: R2 credentials must be complete (a missing value fails explicitly)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::release-signing environment is missing ${name}"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-release-assets
          path: desktop-assets
      - name: Write the DMG alias, desktop/latest-mac.yml and releases/latest.json, then prune
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(desktop-assets/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one desktop DMG, found ${#dmgs[@]}"
            exit 1
          fi
          node scripts/release-mirror.mjs point "$RELEASE_TAG" desktop-assets/latest-mac.yml "${dmgs[0]}"
