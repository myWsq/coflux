// coflux wire protocol —— 共享实体、复用结果、数据面消息。
//
// 本目录（proto/）是协议的唯一真相源：TS(protobuf-es)/Rust(prost)/Swift(swift-protobuf)
// 三端代码均由 `buf generate` 生成，禁止手写镜像。
// 模型（项目制）：Account → Device(=Daemon) → Project → Workspace → Task → Session。
syntax = "proto3";

package coflux.v1;

message DaemonInfo {
  string daemon_id = 1;
  string name = 2;
  string host = 3;
  string platform = 4;
  bool online = 5;
  // 热更新编排（plan 015）：在线连接的内存态版本，供 web 展示；离线设备无此信息（空串）。
  string worker_version = 6;
  string supervisor_version = 7;
  // Capability names the online daemon declared at authentication (DaemonAuth.capabilities), as
  // the server holds them for the connection; empty for an offline device and for old servers.
  // Clients gate device-side features on a name (for example `screen_v1`, the remote screen helper
  // of plan 20260929-remote-desktop), never on a version. The server fills it on every DaemonInfo
  // it emits, so a client may replace its copy of the device wholesale on each daemonUpdated.
  repeated string capabilities = 8;
}

message Project {
  string id = 1;
  string account_id = 2;
  string daemon_id = 3;
  string name = 4;
  string repo_path = 5;
  string default_branch = 6;
  // ms epoch。时间戳统一 double：与旧 JSON 的 JS number 语义一致，
  // 避免 protobuf-es 的 int64→bigint 在 TS 端产生大面积类型涟漪
  double created_at = 7;
  // Archived at (ms epoch, centre clock; plan 20261030-project-archive). Absent = active. An
  // archived project keeps its workspaces but refuses new workspaces and terminals; clients hide it.
  optional double archived_at = 8;
}

message Workspace {
  string id = 1;
  string account_id = 2;
  string daemon_id = 3;
  string project_id = 4;
  string name = 5;
  string path = 6;
  string branch = 7;
  // 主工作区 = 仓库本身；其它 = git worktree
  bool is_main = 8;
  double created_at = 9;
  // git diff 累计统计（plan 024）：merge-base(default_branch, HEAD) 到工作树的累积新增/删除行数
  // （含已提交 + 未提交 + untracked）。真相源在设备侧，DB 只是镜像，与 branch 同语义。
  int32 additions = 10;
  int32 deletions = 11;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_IDLE = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_EXITED = 3;
}

message Task {
  string id = 1;
  string account_id = 2;
  string daemon_id = 3;
  string project_id = 4;
  string workspace_id = 5;
  string title = 6;
  TaskStatus status = 7;
  optional string session_id = 8;
  optional int32 exit_code = 9;
  double created_at = 10;
  double updated_at = 11;
}

enum FsEntryKind {
  FS_ENTRY_KIND_UNSPECIFIED = 0;
  FS_ENTRY_KIND_FILE = 1;
  FS_ENTRY_KIND_DIR = 2;
  FS_ENTRY_KIND_SYMLINK = 3;
  FS_ENTRY_KIND_OTHER = 4;
}

message FsEntry {
  string name = 1;
  FsEntryKind kind = 2;
  // 字节数。double 同上：保持旧 JSON number 语义，2^53 内无损
  double size = 3;
}

// resync 上报的存活会话引用
message SessionRef {
  string session_id = 1;
  string task_id = 2;
}

// ports.update 里单个会话上报的监听端口列表
message SessionPorts {
  string session_id = 1;
  repeated uint32 ports = 2;
}

message PortPreview {
  uint32 port = 1;
  string url = 2;
}

// worker 周期扫描存活会话 PTY 进程树检测到的 agent CLI（plan 073）。
// 派生运行时事实：server 只做内存镜像 + 广播，不落库；daemon 断开即全部清空。
message SessionAgentRef {
  string session_id = 1;
  string task_id = 2;
  // 检测到的 agent 名（内置名单，如 "claude"/"codex"）；无 agent 的 session 不出现在清单里
  string agent = 3;
  // agent hook 上报的回合状态（对齐 Vibe Island）：
  // "active" 进行中 / "approval" 要权限 / "question" 要回答 / "done" 本轮说完；
  // 空 = 尚无 hook 信号。agent 进程退出时随条目一起消失。
  string state = 4;
  // agent 经 `cofluxd notify` 主动留给用户的一句话（plan 074）：与 state 同生命周期，
  // 后续任一 hook 事件到达即被清空（那时 agent 已换了状态，旧消息就过期了）。
  // 纯展示、不落库；长度由 worker 侧钳制。
  string message = 5;
  // agent 经 `cofluxd progress` 主动播报的进度短评（plan 088）：覆盖式单字段，**跨 hook
  // 事件存活**（与 message 生命周期刻意不同——进度不因 agent 换回合而过期），被下一条
  // progress 覆盖，agent 条目消失时随条目清掉。纯展示、不落库；长度由 worker 侧钳制。
  string progress = 6;
  // agent 自己的会话标识（claude 的 session_id / codex 的 thread-id），由 hook 信使上报
  // （plan 20260919）。用途只有一个：客户端据此定位该 agent 的 transcript 文件，把整段对话
  // 当作可复制的"纸面"展开。worker 侧按保守字符集 + 长度校验后才放行，非法值一律按"没有 id"
  // 处理（但绝不因此丢掉承载它的 hook 事件）。生命周期同 progress——跨 hook 事件存活，
  // 随条目消失一起清掉；旧 worker 不发 = 空串 = 该终端没有纸面可看。
  string agent_session_id = 7;
  // Set only by the centre on fan-out: true once any client of the account reported this finished
  // turn ("done"/"waiting") as looked at (SessionSeen). The mark lives in the centre's memory and is
  // cleared when the agent starts another turn or its session id changes. Daemons never set it and
  // the centre ignores it on input.
  bool seen = 8;
}

message TaskPorts {
  string task_id = 1;
  repeated PortPreview ports = 2;
}

// exec/fs 结果由端到端 DeviceEnvelope 复用；中心 relay 不解析载荷。
message ExecResult {
  string request_id = 1;
  bool ok = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  optional string error = 6;
}

message FsListed {
  string request_id = 1;
  bool ok = 2;
  repeated FsEntry entries = 3;
  optional string error = 4;
  // 成功时为所列目录的绝对真实路径（canonicalize 后）；设备浏览默认从 HOME 起步时用于 UI 展示/导入。
  optional string path = 5;
}

message FsReadResult {
  string request_id = 1;
  bool ok = 2;
  string content = 3;
  // Free-form, human-readable text. Clients decide every state from `status`, never from this.
  optional string error = 4;
  // Opaque revision of the file the answer describes (plan 20261001-terminal-file-tab), derived by
  // the worker from file metadata; clients only compare it for equality. A worker that knows this
  // field always sets it on OK and NOT_MODIFIED; an OK answer with an empty revision comes from a
  // worker that predates it.
  string revision = 5;
  // UNSPECIFIED only from a worker that predates the field.
  FsReadStatus status = 6;
}

// The typed outcome of an fs read (plan 20261001-terminal-file-tab).
enum FsReadStatus {
  FS_READ_STATUS_UNSPECIFIED = 0;
  // `content` is the whole file (lossy UTF-8) and `revision` is its revision.
  FS_READ_STATUS_OK = 1;
  // The request's `known_revision` equals the file's current revision; `content` is empty.
  FS_READ_STATUS_NOT_MODIFIED = 2;
  // The path does not exist (or a link in it is dangling).
  FS_READ_STATUS_NOT_FOUND = 3;
  // The path exists but is not a regular file.
  FS_READ_STATUS_NOT_FILE = 4;
  // The file is larger than the worker's read cap (2 MB).
  FS_READ_STATUS_TOO_LARGE = 5;
  // Anything else: the path resolves outside the workspace, an I/O failure.
  FS_READ_STATUS_ERROR = 6;
}

// One entry of a DeviceFsStatResult, in request order (plan 20261001-terminal-file-tab).
message FsStatEntry {
  // Echo of the requested path, byte for byte.
  string path = 1;
  // The path resolves (links followed) to something inside the workspace root. False for a
  // missing path, a dangling link and a path that resolves outside the root.
  bool exists = 2;
  // The resolved target is a regular file.
  bool is_file = 3;
  // The file's revision, comparable with FsReadResult.revision; empty unless `is_file`.
  string revision = 4;
  // Set when `exists`: the canonical path relative to the canonicalised root ("~" expanded,
  // links and ".." resolved, absolute inputs made relative); empty for the root itself.
  string relative_path = 5;
}

message FsWriteResult {
  string request_id = 1;
  bool ok = 2;
  // 成功时为落盘路径，worker 侧确定的真相，client 直接拿它注入 PTY，不自行拼装：
  // root 锚定模式（temp=false）下为 worktree 相对路径；temp 模式（temp=true）下为
  // daemon 侧系统临时目录的绝对路径。
  optional string path = 3;
  optional string error = 4;
}

// 端口转发隧道的原始 TCP 字节（server↔daemon 双向）
message ProxyData {
  string conn_id = 1;
  bytes data = 2;
}


// Independently signed native companion for the exact enclosing worker release.
message TransportArtifact {
  string url = 1;
  string sha256 = 2;
  uint64 size = 3;
  string release_signature = 4;
}

// Immutable source snapshots survive deletion of the original target.
message AccountNotification {
  string id = 1;
  double sequence = 2;
  string message = 3;
  string daemon_id = 4;
  string device_name = 5;
  string workspace_id = 6;
  string workspace_name = 7;
  string task_id = 8;
  string terminal_title = 9;
  double created_at = 10;
  double read_at = 11;
}

// A pending secret request (plan 20260926-agent-secret-input): an agent in a coflux terminal ran
// `coflux secret ask NAME` and the worker is waiting for a desktop to provide or decline the value.
// Metadata only: the value itself never travels in this message, never reaches the center, and is
// delivered from the desktop to the worker over the end-to-end Device channel (DeviceSecretAnswer).
// Derived runtime fact: the center mirrors it in memory, never persists it, and clears it when the
// daemon disconnects.
message SecretRequestRef {
  // Worker-generated, unique within the worker runtime; the key DeviceSecretAnswer names.
  string request_id = 1;
  // The live session (terminal) whose agent asked; only that session can use the value.
  string session_id = 2;
  string task_id = 3;
  // Environment-variable style name the agent asked for ([A-Za-z_][A-Za-z0-9_]*).
  string name = 4;
  // Free text written by the agent; clients must present it as the agent's words.
  string reason = 5;
  // ms epoch
  double created_at = 6;
  // ms epoch; after it the worker answers the agent `cancelled` and drops the request.
  double expires_at = 7;
}

// A live executor run as the center may know it (plan 20260929-executor-pip): the metadata that
// decides whether a desktop shows a card for it and on which terminal. It is bound to the
// **caller's terminal** (the session that ran `coflux executor run`), never to the run's workspace.
// Deliberately nothing else: the prompt, the transcript, notes and summaries travel only over the
// end-to-end Device channel. Derived runtime fact: the center mirrors it in memory, never persists
// it, and clears it when the daemon disconnects. Only unfinished runs are listed; a run that reaches
// a terminal state leaves the set.
message ExecutorRunRef {
  // Worker-generated, unique within the worker runtime.
  string run_id = 1;
  string session_id = 2;
  string task_id = 3;
  // Resolved by the worker: the agent's `--title`, else the prompt's first line. Agent-written
  // text; clients must present it as the agent's words.
  string title = 4;
  bool write = 5;
  // queued | accepted | running (the ledger's phase; never done).
  string phase = 6;
  // ms epoch
  double submitted_at = 7;
  // ms epoch; 0 until the host reported the run running.
  double started_at = 8;
  // The host the run was assigned to is not connected to the worker right now: the run may still
  // finish, or turn unknown when the reconcile window closes.
  bool host_lost = 9;
}

// One workspace's browser annotations as the center may know them (plan
// 20260929-browser-annotations): a revision that changes on every change of the workspace's
// annotations, and counts. Deliberately nothing else — no text, no ids: the content travels only
// end to end between desktops and the worker, and a desktop showing the workspace refetches it over
// the Device channel when the revision changes.
message WorkspaceAnnotationSummary {
  string workspace_id = 1;
  uint32 revision = 2;
  uint32 pending = 3;
  uint32 resolved = 4;
}
