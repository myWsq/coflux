// Browser ⟷ worker 的端到端 Device 协议。
//
// 同一 DeviceEnvelope 可直接承载于 loopback WebSocket，也可作为 opaque bytes 经中心 relay；
// server 只在 channel open 阶段鉴权/绑定 daemon，不解释 envelope 内的具体 RPC。
syntax = "proto3";

package coflux.v1;

import "coflux/v1/common.proto";

// Native Tailcat candidate transport. These messages are distinct from legacy
// relay URLs and WebRTC signaling; DeviceEnvelope remains unchanged.
message DeviceTailcatIdentity {
  string node_public_key = 1;
  uint32 transport_version = 2;
}
message DeviceTailcatConfigure {
  bytes region_json = 1;
  uint32 transport_version = 2;
  string account_id = 3;
  bool refresh_only = 4;
}
message DeviceTailcatEndpoint {
  string node_public_key = 1;
  string address = 2;
  uint32 transport_version = 3;
}
message DeviceTailcatConnect {
  string daemon_id = 1;
  string channel_id = 2;
  string client_instance_id = 3;
  uint64 transport_generation = 4;
  uint32 protocol_version = 5;
  string node_public_key = 6;
  DeviceScope scope = 7;
}
message DeviceTailcatGrant {
  string channel_id = 1;
  string account_id = 2;
  string daemon_id = 3;
  string client_instance_id = 4;
  uint64 transport_generation = 5;
  repeated DeviceScope scopes = 6;
  uint64 expires_at = 7;
  bytes proof_key = 8;
  string node_public_key = 9;
  uint32 protocol_version = 10;
}
message DeviceTailcatInstalled {
  string channel_id = 1;
  bool ok = 2;
}
message DeviceTailcatResult {
  string channel_id = 1;
  bool ok = 2;
  optional string address = 3;
  bytes proof_key = 4;
  uint64 expires_at = 5;
  repeated DeviceScope scopes = 6;
  optional string error = 7;
}
message DeviceTailcatRevoke {
  repeated string channel_ids = 1;
}
message DeviceTailcatClose {
  string channel_id = 1;
}
// Report only an actual native dial failure, never cancellation or auth failure.
// Central revocation of an opaque channel. Channel IDs are unique per attempt.
message DeviceTailcatClosed {
  string channel_id = 1;
}

message DeviceTailcatFailed {
  string channel_id = 1;
}
message DeviceTailcatOpened {
  string channel_id = 1;
}
message DeviceTailcatControl {
  bool online = 1;
  bool hard_revoke = 2;
}


// Device 协议版本、默认 loopback 端口与 terminal dimension 边界同时在 TS/Rust 薄封装导出
// 常量；wire 握手必须显式带版本，所有 cols/rows 在 authority 边界钳制为 [1, 1000]。
// 本文件全部 created_at/started_at/exited_at/captured_at/expires_at 均为 Unix epoch milliseconds。
// request_id 由 logical client 生成并在同一请求重投时保持不变；它只做响应关联/短期去重。
// operation_id 与 input_seq 只是各自 authority 生命周期内的去重键，不构成泛化的 exactly-once：
// worker ledger 只覆盖当前 worker runtime；sessiond 管辖的 input/create/stop 可跨 worker
// replacement 去重，但不跨 supervisor/OS restart。崩溃与恢复语义由具体消息定义。

enum DeviceScope {
  DEVICE_SCOPE_UNSPECIFIED = 0;
  // 查看存活 session catalog、attach 与接收输出。
  DEVICE_SCOPE_SESSION_READ = 1;
  // 向存活 session 输入、resize、stop；持久 browser grant 离线最多到此范围。
  DEVICE_SCOPE_SESSION_CONTROL = 2;
  // 已同步 workspace 内的 exec/fs、home 浏览与 ports 等设备 RPC；只能由中心在线 lease 授予。
  DEVICE_SCOPE_RPC = 3;
  // project validate/import、worktree 与新建 session 等中心 prepared operation。
  DEVICE_SCOPE_LIFECYCLE = 4;
}

enum DeviceTransportKind {
  DEVICE_TRANSPORT_KIND_UNSPECIFIED = 0;
  DEVICE_TRANSPORT_KIND_LOOPBACK = 1;
  DEVICE_TRANSPORT_KIND_RELAY = 2;
  DEVICE_TRANSPORT_KIND_P2P = 3;
}

enum LocalAuthErrorCode {
  LOCAL_AUTH_ERROR_CODE_UNSPECIFIED = 0;
  LOCAL_AUTH_ERROR_CODE_VERSION_MISMATCH = 1;
  LOCAL_AUTH_ERROR_CODE_ORIGIN_DENIED = 2;
  LOCAL_AUTH_ERROR_CODE_GRANT_UNKNOWN = 3;
  LOCAL_AUTH_ERROR_CODE_KEY_MISMATCH = 4;
  LOCAL_AUTH_ERROR_CODE_SIGNATURE_INVALID = 5;
  LOCAL_AUTH_ERROR_CODE_NONCE_INVALID = 6;
  LOCAL_AUTH_ERROR_CODE_LEASE_INVALID = 7;
  LOCAL_AUTH_ERROR_CODE_RATE_LIMITED = 8;
}

// worker 在认证完成后通过独立 announce 上报持久 gateway identity。public_key_sec1 是 P-256
// uncompressed SEC1 point（65 bytes）；private key 永不离开 daemon。
message LocalGatewayDescriptor {
  uint32 protocol_version = 1;
  uint32 port = 2;
  bytes public_key_sec1 = 3;
}

// 中心持久化并安装到目标 daemon 的 browser public-key grant。public_key_sec1 同为 P-256
// uncompressed SEC1 point；offline_scopes 只能包含 SESSION_READ/SESSION_CONTROL。
message LocalBrowserGrant {
  string grant_id = 1;
  string account_id = 2;
  string daemon_id = 3;
  string origin = 4;
  bytes public_key_sec1 = 5;
  repeated DeviceScope offline_scopes = 6;
  double created_at = 7;
}

// 中心在线时滚动安装的短期高权限 lease。worker 一旦失去中心认证连接，应立即撤销所有
// online lease，不等待 expires_at；expires_at 仍用于防时钟/消息丢失后的陈旧使用。
message OnlineDeviceLease {
  string lease_id = 1;
  string grant_id = 2;
  string account_id = 3;
  string daemon_id = 4;
  repeated DeviceScope scopes = 5;
  double expires_at = 6;
}

// Gateway/client 两个签名均为 P-256 ECDSA-SHA256 的 IEEE-P1363 r||s（固定 64 bytes）。
// 签名输入不是 protobuf bytes，避免不同实现的 deterministic-encoding 差异，而是：
//   domain ASCII + 0x00 + 每字段 [u32 BE length][raw bytes]
// string 按 UTF-8；数字用固定宽度 BE。gateway domain = "coflux-local-gateway-v1"，字段依次为
// protocol_version(BE32)、daemon_id、origin、nonce；client domain = "coflux-local-client-v1"，
// 字段依次为 protocol_version(BE32)、daemon_id、origin、nonce、gateway_public_key_sec1、grant_id、
// browser_public_key_sec1、client_instance_id、transport_generation(BE64)、lease_id（缺省编码为空）。
// nonce 必须是 gateway 生成的 32 random bytes，单次使用且受 TTL 约束。
message LocalGatewayHello {
  uint32 protocol_version = 1;
  string daemon_id = 2;
  string origin = 3;
  bytes nonce = 4;
  bytes gateway_public_key_sec1 = 5;
  bytes signature_p1363 = 6;
}

message LocalClientHello {
  uint32 protocol_version = 1;
  string grant_id = 2;
  bytes browser_public_key_sec1 = 3;
  string client_instance_id = 4;
  uint64 transport_generation = 5;
  optional string lease_id = 6;
  bytes gateway_nonce = 7;
  bytes signature_p1363 = 8;
}

message LocalAuthResult {
  bool ok = 1;
  optional string channel_id = 2;
  repeated DeviceScope scopes = 3;
  optional string error = 4;
  LocalAuthErrorCode error_code = 5;
}

message LocalPairRequest {
  string request_id = 1;
  string daemon_id = 2;
  string origin = 3; // server 必须与已认证 client WS 的实际 Origin 精确比对，不信任自报值。
  bytes browser_public_key_sec1 = 4;
}

message LocalPairResult {
  string request_id = 1;
  bool ok = 2;
  optional string grant_id = 3;
  optional LocalGatewayDescriptor gateway = 4;
  optional string error = 5;
}

message LocalLeaseRequest {
  string request_id = 1;
  string daemon_id = 2;
  string grant_id = 3;
}

message LocalLeaseResult {
  string request_id = 1;
  bool ok = 2;
  optional OnlineDeviceLease lease = 3;
  optional string error = 4;
}

message LocalUnpairRequest {
  string request_id = 1;
  string daemon_id = 2;
  string grant_id = 3;
}

message LocalUnpairResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
}

message LocalGrantInstall {
  string request_id = 1;
  LocalBrowserGrant grant = 2;
}

message LocalGrantRevoke {
  string request_id = 1;
  string grant_id = 2;
}

message LocalLeaseInstall {
  OnlineDeviceLease lease = 1;
}

message LocalGrantAck {
  string request_id = 1;
  string grant_id = 2;
  bool ok = 3;
  optional string error = 4;
}

// ===== 独立 relay rendezvous（plan 043）=====
//
message DeviceSessionInfo {
  string session_id = 1;
  string task_id = 2;
  int32 pid = 3;
  string cwd = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // 从 session 创建起累计读到的 PTY byte 数；0 表示尚无输出，首个 byte 的 sequence 是 1。
  uint64 output_seq = 7;
  double started_at = 8;
}

message DeviceSessionExitTombstone {
  string event_id = 1;
  string session_id = 2;
  string task_id = 3;
  int32 exit_code = 4;
  uint64 final_output_seq = 5;
  double exited_at = 6;
}

message DeviceSessionCatalogRequest {
  string request_id = 1;
  // 首页留空/0；后续页回填上一页返回的 owner/epoch。epoch 变化时 sessiond 返回 reset，
  // worker 丢弃半快照并从第一页重来。
  string snapshot_owner_id = 2;
  uint64 snapshot_epoch = 3;
  uint32 session_offset = 4;
  uint32 exit_offset = 5;
  // 0 = legacy 单帧模式；新 worker 填非零值显式 opt-in 分页，保证旧 worker 不会把首个
  // 分片误当完整 catalog。sessiond 会把它钳在自身安全范围内。
  uint32 max_page_bytes = 6;
}

message DeviceSessionCatalog {
  string request_id = 1;
  repeated DeviceSessionInfo sessions = 2;
  repeated DeviceSessionExitTombstone exits = 3;
  string snapshot_owner_id = 4;
  uint64 snapshot_epoch = 5;
  uint32 session_offset = 6;
  uint32 exit_offset = 7;
  uint32 next_session_offset = 8;
  uint32 next_exit_offset = 9;
  // legacy response 的这些新字段全为默认值；新 worker 将其视为完整单帧以兼容旧 supervisor。
  bool complete = 10;
  bool reset = 11;
}

message DeviceExitAck {
  repeated string event_ids = 1;
  // 新链路把 ACK 绑定到完整 catalog 的 request/epoch；空值保留给旧 client/worker 的
  // 滚动兼容，不能用于确认新分页请求。
  string request_id = 2;
  string snapshot_owner_id = 3;
  uint64 snapshot_epoch = 4;
}

// client_instance_id 是跨 transport 稳定的 browser logical client identity；同一 client 的
// transport_generation 从 1 开始且必须单调递增。更高 generation 只替换旧 direct/relay 路径并保留现有
// holder_epoch；同代重投幂等，更低 generation 是 stale。不同 client 成功 attach 时 sessiond
// 原子递增 holder_epoch，并向旧 holder 发 detached。
message DeviceSessionAttach {
  string request_id = 1;
  string session_id = 2;
  string client_instance_id = 3;
  uint64 transport_generation = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // client 已连续接收的最后一个 byte sequence；sessiond 若仍保留从 N+1 起的完整 whole-frame
  // delta 可免 snapshot，否则必须回 snapshot。
  optional uint64 resume_from_seq = 7;
}

message DeviceSessionAttached {
  string request_id = 1;
  string session_id = 2;
  uint64 holder_epoch = 3; // 从 1 开始；sessiond 裁决的当前 holder lease，control 请求必须精确匹配。
  // 有 ansi_snapshot 时，它与 snapshot_seq 是同一把 session 锁下取得的原子状态：N 表示
  // snapshot 已包含 sequence <= N 的所有 PTY bytes，下一段增量从 N+1 开始。无 ansi_snapshot
  // 表示 resume_from_seq 已接受，snapshot_seq 必须等于该值，随后同样从 N+1 重传。
  uint64 snapshot_seq = 4;
  // 可直接写入空 xterm 的规范化 ANSI：有界、按完整逻辑行裁剪的 history + 当前 VT grid/modes。
  optional bytes ansi_snapshot = 5;
  uint32 cols = 6;
  uint32 rows = 7;
}

// 只读取得原子 snapshot，不注册 output subscriber、也不读取或改变 holder。供 worker 生成中心
// checkpoint，以及未来只读诊断使用；browser 的可写 attach 仍必须走 DeviceSessionAttach。
message DeviceSessionSnapshotRequest {
  string request_id = 1;
  string session_id = 2;
}

// Command state of a live shell, derived by sessiond from the OSC 133 marks that coflux's own
// rc chain emits together with the per-session secret. Marks without that secret (remote hosts
// reached over ssh, nested shells, prompt frameworks) are ignored, so a nested shell or an ssh
// session looks like one long-running command from the outside.
message TerminalCommandState {
  // At least one accepted mark has arrived: the shell is zsh/bash/fish started through coflux's
  // rc chain and its prompt has been drawn at least once.
  bool integrated = 1;
  // A command has started and not finished yet.
  bool busy = 2;
  // Monotonic count of commands started in this shell; 0 = none yet.
  uint64 command_seq = 3;
  // Sequence of the last finished command (0 = none) and its exit status.
  uint64 finished_seq = 4;
  optional int32 exit_code = 5;
}

message DeviceSessionSnapshot {
  string request_id = 1;
  string session_id = 2;
  uint64 snapshot_seq = 3;
  bytes ansi_snapshot = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // PTY 内程序经 OSC 0/2 设置的终端标题（plan 075）：sessiond 的 vt100 回调捕获、
  // 源头截断；空 = 从未设置或旧 supervisor 不支持，消费方一律回落自身默认。
  string title = 7;
  // Shell-integration command state at snapshot time; absent from old supervisors.
  TerminalCommandState command = 8;
}

message DevicePtyOutput {
  string session_id = 1;
  // from_seq/to_seq 是 1-based inclusive byte sequence；非空 data 必须满足
  // to_seq = from_seq + data.length - 1，且 from_seq 等于接收方最后确认的 to_seq + 1。
  // 不连续时接收方不得猜测缺口内容，必须重新 attach 获取原子 snapshot。
  uint64 from_seq = 2;
  uint64 to_seq = 3; // session 生命周期内不回退。
  bytes data = 4;
}

message DevicePtyGap {
  string session_id = 1;
  uint64 expected_seq = 2; // subscriber 期望的下一个 byte sequence。
  uint64 available_seq = 3; // sessiond 当前最早仍可重传的 byte sequence。
}

message DevicePtyInput {
  string request_id = 1;
  string session_id = 2;
  uint64 holder_epoch = 3;
  // 从 1 开始且在同一 logical client/session 严格连续：authority 只应用当前累计游标 N 的
  // N+1，gap 不得越级写 PTY。input_seq <= N 的重投不再执行，并返回当前累计 ACK；等于 N
  // 且 payload 不同可报告 collision。request_id 只关联 error，不承担提交确认。
  uint64 input_seq = 4;
  bytes data = 5;
}

// sessiond 已成功写入存活 PTY 的连续输入前缀。logical client 由已认证 channel 隐式确定；
// ACK 丢失后重投任一已提交 input，authority 必须再次返回当前累计游标。
message DevicePtyInputAck {
  string session_id = 1;
  uint64 applied_through_seq = 2;
}

message DevicePtyResize {
  string request_id = 1;
  string session_id = 2;
  uint64 holder_epoch = 3;
  uint64 resize_seq = 4; // 从 1 开始、与 input_seq 独立单调；同 seq 重投幂等，较小 seq 拒绝。
  uint32 cols = 5;
  uint32 rows = 6;
}

// operation_id 是不可复用的 opaque ID。对 sessiond 管辖的 stop/create，同一 supervisor runtime
// 内跨 logical channel、direct/relay transport 与 worker replacement 去重：同 ID、同 payload 返回
// 已记录结果而不重复执行；同 ID、不同 payload 必须拒绝。ledger 不跨 supervisor/OS restart。
// stop 是离线 scope 的特例，可由 client 生成 operation_id；create/project/worktree 必须匹配中心
// 预安装模板。
message DeviceSessionStop {
  string request_id = 1;
  string operation_id = 2;
  string session_id = 3;
  uint64 holder_epoch = 4;
}

message DeviceSessionDetached {
  string session_id = 1;
  uint64 holder_epoch = 2;
  optional string reason = 3;
}

message DeviceSessionExited {
  string session_id = 1;
  int32 exit_code = 2;
  uint64 final_output_seq = 3;
}

// session create 采用与 stop 相同的 sessiond 生命周期去重规则。
message DeviceSessionCreate {
  string request_id = 1;
  string operation_id = 2;
  string session_id = 3;
  string task_id = 4;
  string cwd = 5;
  // Unused: the supervisor always starts the workspace's default login shell (a real tty that
  // lives until exit). Kept for wire compatibility; the center never fills it.
  optional string shell = 6;
  uint32 cols = 7;
  uint32 rows = 8;
  // Unused since the interactive-only terminal model: a command the center wants typed in is sent
  // separately (ServerTerminalRun) once the shell has signalled prompt readiness. Kept for wire
  // compatibility; always empty.
  string command = 9;
  // 10 起是会话归属 id（plan 092）：与 daemon.proto SessionCreate 7 起同名同义，supervisor 据此组装
  // COFLUX_* 环境变量。它们会进入 sessiond 账本的 canonical 请求，同一 operation 重放时中心组帧的值
  // 必须一致（本来就是稳定 id）。全部可缺省，旧中心不下发只是会话里没有这些变量。
  string workspace_id = 10;
  // 无仓库的目录工作区为空串
  string project_id = 11;
  string daemon_id = 12;
  string mcp_url = 13;
}

message DeviceOperationAck {
  string request_id = 1;
  string operation_id = 2;
  bool ok = 3;
  optional string error = 4;
  optional string session_id = 5;
  optional int32 pid = 6;
}

message DeviceProjectValidate {
  string request_id = 1;
  string path = 2;
  string operation_id = 3; // project import 的中心 prepared operation；daemon 必须先见过同 ID 模板。
}

message DeviceProjectValidated {
  string request_id = 1;
  bool ok = 2;
  string repo_path = 3;
  string branch = 4;
  optional string error = 5;
  optional string suggested_name = 6;
  string operation_id = 7;
  // 仓库真实默认分支（remote HEAD 探测，如 origin/HEAD → master）；缺失时 server 回退 branch
  // （导入时恰好所在的分支）。diff 统计基准 merge-base(default_branch, HEAD) 依赖它。
  optional string default_branch = 8;
}

// 下列 worktree add/remove 的 operation_id ledger 只覆盖当前 worker runtime；worker replacement
// 后不提供通用去重。此类操作可基于稳定 worktree path 与 Git 状态做专用探测、恢复与收敛。
message DeviceWorktreeAdd {
  string request_id = 1;
  string operation_id = 2;
  string repo_path = 3;
  string workspace_id = 4;
  string name = 5;
  string branch = 6;
  bool create_new = 7;
}

message DeviceWorktreeAdded {
  string request_id = 1;
  string operation_id = 2;
  bool ok = 3;
  string path = 4;
  string branch = 5;
  optional string error = 6;
}

message DeviceWorktreeRemove {
  string request_id = 1;
  string operation_id = 2;
  string repo_path = 3;
  string worktree_path = 4;
}

message DeviceExecRun {
  string request_id = 1;
  // worker 只接受中心当前 WorkspaceList 中属于本 daemon 的 ID，并自行解析 cwd；不信 browser 路径。
  string workspace_id = 2;
  string command = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  optional uint32 timeout_ms = 6;
  // 设置时只在当前 worker runtime 内去重。worker 崩溃时外部命令可能已执行而结果未记录，
  // 此时状态未知；调用方不得自动重试非幂等命令，也不得宣称 exactly-once。
  optional string operation_id = 7;
}

message DeviceFsList {
  string request_id = 1;
  // browse_home=false 时由 worker 从 WorkspaceList 解析 workspace_id；true 仅用于在线导入向导，
  // workspace_id 必须为空且根固定为 daemon 用户 home。
  string workspace_id = 2;
  string path = 3;
  bool browse_home = 4;
}

message DeviceFsRead {
  string request_id = 1;
  string workspace_id = 2; // worker 从中心同步的 WorkspaceList 解析并锚定 root。
  string path = 3;
  // Conditional read (plan 20261001-terminal-file-tab): when set and equal to the file's current
  // revision, the worker answers FS_READ_STATUS_NOT_MODIFIED with empty content. A worker that
  // predates the field ignores it and answers the whole file.
  optional string known_revision = 4;
}

// Batched existence check (plan 20261001-terminal-file-tab), anchored and scoped like DeviceFsRead
// (DEVICE_SCOPE_RPC). Each path is resolved against the workspace root like a read; the answer has
// one entry per requested path, in order. A worker that predates this payload decodes it as an
// empty oneof and answers DeviceError{code:"empty_payload", request_id: unset}; clients attribute
// that, arriving on the RPC lane, to their in-flight stat requests (daemon outdated).
message DeviceFsStat {
  string request_id = 1;
  string workspace_id = 2;
  // At most 64 paths; a larger batch is refused with ok=false.
  repeated string paths = 3;
}

message DeviceFsStatResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
  repeated FsStatEntry entries = 4;
}

// Whole-workspace file index (plan 20261002-workspace-files-view), anchored and scoped like
// DeviceFsRead (DEVICE_SCOPE_RPC). When the workspace root is the top level of a git worktree the
// index is git's view: every tracked file plus every untracked file that is not ignored
// (`git ls-files --cached --others --exclude-standard`), and every ignored entry at its top-most
// ignored level (`git ls-files --others --ignored --exclude-standard --directory`). Otherwise it is
// a walk of the root with no ignored entries. A worker that predates this payload decodes it as an
// empty oneof and answers DeviceError{code:"empty_payload", request_id: unset}; clients attribute
// that, arriving on the RPC lane, to their in-flight index requests (daemon outdated).
message DeviceFsIndex {
  string request_id = 1;
  string workspace_id = 2;
}

message DeviceFsIndexResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
  // Sorted by path. Empty when `truncated`: a partial index would make folders look complete.
  repeated FsIndexEntry entries = 4;
  // The worker stopped at its entry cap, response-size budget or time budget. The client then
  // lists folders one at a time with DeviceFsList instead.
  bool truncated = 5;
}

enum FsIndexEntryKind {
  FS_INDEX_ENTRY_KIND_UNSPECIFIED = 0;
  // A leaf: a regular file, a symlink (never followed) or anything else that is not a directory.
  FS_INDEX_ENTRY_KIND_FILE = 1;
  // A directory the index does not descend into: an ignored directory, an untracked nested
  // repository, a submodule gitlink, a walk's `.git` or empty directory. Its contents are listed
  // on demand with DeviceFsList.
  FS_INDEX_ENTRY_KIND_DIRECTORY = 2;
}

message FsIndexEntry {
  // Relative to the workspace root, "/"-separated, never with a trailing slash.
  string path = 1;
  FsIndexEntryKind kind = 2;
  // Matched by the ignore rules (git mode only). Everything under an ignored directory is ignored
  // too; a tracked file matched by .gitignore is not ignored.
  bool ignored = 3;
}

// fs.write 的 operation_id ledger 只覆盖当前 worker runtime。对可稳定重建的目标 path，以相同
// path/data 做全量覆盖写可在状态未知时重试并收敛到同一内容；这是结果收敛式幂等，不是严格一次。
message DeviceFsWrite {
  string request_id = 1;
  string operation_id = 2;
  string workspace_id = 3; // temp=false 时必须存在于中心同步的 WorkspaceList。
  string path = 4;
  bytes data = 5;
  bool temp = 6; // true 时仍需有效 workspace_id 做授权/归属校验，但落盘到 daemon 临时目录。
}

message DevicePortsRequest {
  string request_id = 1;
}

message DevicePortsResult {
  string request_id = 1;
  repeated SessionPorts sessions = 2;
}

// Device 通道心跳：client 定期发 Ping、daemon 原样回 Pong，client 据往返算 RTT。
// 走既有 request/response 配对（request_id），daemon 侧是纯 echo——不读任何状态、不做任何
// 副作用，故它的往返时间接近纯链路延迟。同时补上 device 通道此前完全没有的探活：
// 主控连接有 idle ping（见 worker/main.rs），device 通道此前只能靠用户操作超时才发现半死。
message DevicePing {
  string request_id = 1;
}

message DevicePong {
  string request_id = 1;
}

message DeviceError {
  optional string request_id = 1;
  string code = 2;
  string message = 3;
}

// 中心持久 prepare 后，先经可信 daemon control WS 安装同一模板并等待
// PreparedDeviceOperationInstalled，再交给 client。frame 是 channel_id 为空的 DeviceEnvelope；
// client 只可填入自己已认证的 channel_id 后经 direct/relay 发送。daemon 解码后必须确认除
// channel_id 外与已安装模板完全相等，再按具体消息定义的 authority 生命周期处理 operation_id；
// 未知/过期/被篡改模板拒绝。
message PreparedDeviceOperation {
  string operation_id = 1;
  string daemon_id = 2;
  bytes frame = 3;
  double expires_at = 4;
}

message PreparedDeviceOperationInstalled {
  string operation_id = 1;
  bool ok = 2;
  optional string error = 3;
}

// daemon→server 的控制面事实报告，不依赖发起 browser channel 是否仍存在。
message DeviceOperationReport {
  string operation_id = 1;
  string daemon_id = 2;
  bool ok = 3;
  optional string task_id = 4;
  optional string session_id = 5;
  optional int32 pid = 6;
  optional int32 exit_code = 7;
  optional string error = 8;
  // 编码后的结果 DeviceEnvelope，channel_id 必须清空；供中心按 durable operation 类型收敛
  // project/worktree 等结构化结果。重复 report 必须幂等，中心不以 browser 转述作为设备事实。
  optional bytes result_frame = 9;
}

// 中心只缓存最后一个有界 checkpoint；它不是 session authority，也不用于增量排序以外的裁决。
message SessionCheckpoint {
  string session_id = 1;
  string task_id = 2;
  uint64 snapshot_seq = 3; // 与 DeviceSessionSnapshot 相同的已包含 byte sequence 上界。
  bytes ansi_snapshot = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  double captured_at = 7;
  // OSC 0/2 终端标题（plan 075），随 snapshot 原样透传；语义同 DeviceSessionSnapshot.title。
  string title = 8;
  // Command state (busy / sequence / last exit) carried along with the snapshot; absent from old daemons.
  TerminalCommandState command = 9;
}

// A terminal's metadata without its content (plan 20261010-terminal-checkpoint-energy). Checkpoints
// are split in two signals: this one is small and sent as soon as the title or the command state
// changes (and in full for every live session right after the daemon reconnects), while the content
// keeps travelling as SessionCheckpoint at a low cadence.
//
// daemon→server: title and command state of a live session; the center checks the session belongs
// to the sending daemon under the stated task, exactly like a SessionCheckpoint.
// server→client: only to clients that declared ClientAuth.session_metadata; carries the title only
// (command is left unset) and replaces the content push those clients no longer receive.
message SessionMetadata {
  string session_id = 1;
  string task_id = 2;
  // OSC 0/2 terminal title, same semantics as SessionCheckpoint.title (empty = never set).
  string title = 3;
  // Shell-integration command state; absent toward clients.
  TerminalCommandState command = 4;
}

// ===== executor（plan 116）=====
//
// 「agent 经 `coflux executor` 甩子任务」的通路。桌面 app 是本机唯一的 executor host：daemon 把
// 工单**推**给它（与 pty_output 同一种既有能力：往已连通道推帧），它用普通上行消息回报状态与终态。
// 刻意不造「device 向 client 发请求并等响应」的反向 RPC——本片没有任何一条消息需要配对应答。
//
// 三条纪律写在这里，实现两侧都按它来：
//   1. host 只能是 **loopback（同机）** 通道：executor 只服务桌面 app 所在的这台机器，远程 client
//      即使拿到 SESSION_CONTROL 也不能抢注成 host。
//   2. 能力按**名字**门禁（对齐 daemon-capabilities.ts 的范式），不比较版本号。
//   3. 作业表与写锁的真相在桌面主进程；daemon 只留供 CLI 轮询的状态与终态，不做调度、不重派。

enum ExecutorRunState {
  EXECUTOR_RUN_STATE_UNSPECIFIED = 0;
  // host 已接单，尚未开跑
  EXECUTOR_RUN_STATE_ACCEPTED = 1;
  EXECUTOR_RUN_STATE_RUNNING = 2;
  // —— 以下为终态 ——
  EXECUTOR_RUN_STATE_SUCCEEDED = 3;
  // host 当场拒绝（写锁被占、未配置 provider/model、并发封顶、工作区不可用……），note 是给 agent 看的原因
  EXECUTOR_RUN_STATE_REJECTED = 4;
  EXECUTOR_RUN_STATE_MODEL_ERROR = 5;
  EXECUTOR_RUN_STATE_TOOL_FAILED = 6;
  EXECUTOR_RUN_STATE_CANCELLED = 7;
  // 结果未知：host 掉线/换代后没能重报这条 run。**绝不自动重跑**——租约失效不证明旧 writer 已停止。
  EXECUTOR_RUN_STATE_UNKNOWN = 8;
}

// client→daemon：把本 client 登记成本机 executor host（可重复发送 = 幂等更新）。
// 同一 daemon 只认一个 host：host_id 稳定标识桌面实例，host_epoch 是同一 host 的连接换代号
// （单调递增）。较低 epoch 的登记是 stale，直接拒。
message DeviceExecutorHostRegister {
  string host_id = 1;
  uint64 host_epoch = 2;
  // 按名门禁：daemon 只在清单里含本协议要求的能力名时才接受登记。
  repeated string capabilities = 3;
  // 用户已在桌面配好 provider/model/key。false 时 daemon 在**提交那一刻**就拒，
  // 让 agent 立刻拿到「去桌面配置」而不是等一轮轮询。
  bool ready = 4;
  string not_ready_reason = 5;
}

// daemon→client：登记结果 + 重连对账清单。
// reconcile_run_ids 是 daemon 手里仍未终结的 run；host 必须逐条重报（还在跑 = running，
// 不认识 = 终态 unknown）。到 reconcile_deadline 仍未被重报的，daemon 自行判 unknown。
message DeviceExecutorHostRegistered {
  bool ok = 1;
  optional string error = 2;
  repeated string reconcile_run_ids = 3;
  double reconcile_deadline = 4;
}

// daemon→client：一张工单。workspace_id 与 workspace_root 在**提交那一刻**就已解析固定
// （plan 102 的 cwd 跟随只影响新提交，不改已在跑任务的边界）。
message DeviceExecutorAssign {
  string run_id = 1;
  string prompt = 2;
  // true = 可写；false = 只读
  bool write = 3;
  string workspace_id = 4;
  // daemon 工作区表里登记的真实路径
  string workspace_root = 5;
  double submitted_at = 6;
}

// daemon→client：取消一条 run（幂等；已终结的 run 上的取消是空操作）。
message DeviceExecutorCancel {
  string run_id = 1;
}

// client→daemon：状态与终态回报。终态一直保留在 host 手里重发，直到收到 DeviceExecutorReportAck。
message DeviceExecutorReport {
  string run_id = 1;
  ExecutorRunState state = 2;
  // 进行中的一句话 / 拒绝原因；不含转录，转录留在桌面内部不经 daemon
  string note = 3;
  // 终态：executor 的最终回复
  optional string summary = 4;
  // 终态：改动过的文件（工作区相对路径）
  repeated string changed_files = 5;
  optional string error = 6;
  double reported_at = 7;
}

// daemon→client：终态已落到 daemon 的 run 账本，host 可以丢掉本地副本了。
message DeviceExecutorReportAck {
  string run_id = 1;
}

// ===== Executor transcript (plan 20260929-executor-pip) =====
//
// The host forwards each transcript fragment of a run to the worker; the worker buffers them per run
// (in memory, under a byte cap) and serves them to viewing desktops, which show a read-only
// picture-in-picture card on the pane of the terminal that started the run. The transcript never
// reaches the center: it travels host → worker on the host's own loopback channel (or the daemon
// host's stdio) and worker → viewer over this end-to-end channel.
//
// A fragment is a whole unit — one assistant message, one tool call with its capped output, one
// error — never a per-token delta. Seqs are assigned by the worker, start at 1 per run and are dense
// among the fragments it accepted; a viewer resumes by naming the last seq it has.
//
// Gates:
//   - DeviceExecutorTranscriptFragment is a host frame: accepted only from a loopback channel that
//     currently holds the host slot under the run's host_id (the same gate as DeviceExecutorReport),
//     so a desktop that reconnected under the same host_id keeps streaming.
//   - DeviceExecutorTranscriptSubscribe / Unsubscribe require DEVICE_SCOPE_SESSION_READ;
//     DeviceExecutorStop requires DEVICE_SCOPE_SESSION_CONTROL. Neither needs an attach or a holder.
//
// A worker that predates these payloads decodes them as an empty oneof and answers
// DeviceError{code:"empty_payload", request_id: unset}; clients attribute exactly that to their
// executor viewer frames in flight on the channel — never to the heartbeat — and show cards without
// a log.

enum ExecutorFragmentKind {
  EXECUTOR_FRAGMENT_KIND_UNSPECIFIED = 0;
  // One assistant message: `text` is that message's prose.
  EXECUTOR_FRAGMENT_KIND_ASSISTANT = 1;
  // One tool call: `tool`, its salient `argument` (the shell command for bash, the path for file
  // tools), its capped `output` and whether it `failed`.
  EXECUTOR_FRAGMENT_KIND_TOOL = 2;
  // An error the runner recorded (a blocked tool call, a model failure): `text`.
  EXECUTOR_FRAGMENT_KIND_ERROR = 3;
}

message ExecutorTranscriptFragment {
  // Assigned by the worker; 0 when the host sends it.
  uint64 seq = 1;
  ExecutorFragmentKind kind = 2;
  string text = 3;
  string tool = 4;
  string argument = 5;
  // Bounded by the runner to a head and a tail with an explicit omission marker between them.
  string output = 6;
  bool failed = 7;
  // ms epoch, the host's clock.
  double at = 8;
}

// host→worker: one fragment of a run this host is executing.
message DeviceExecutorTranscriptFragment {
  string run_id = 1;
  ExecutorTranscriptFragment fragment = 2;
}

// client→worker (SESSION_READ): follow a run's transcript on this channel. The worker answers with
// the backlog after `from_seq` (0 = everything it has) in one or more DeviceExecutorTranscript
// frames, then pushes each new fragment as it arrives, until the run ends or the channel closes.
// Re-subscribing on the same channel replaces the cursor.
message DeviceExecutorTranscriptSubscribe {
  string run_id = 1;
  uint64 from_seq = 2;
}

// client→worker (SESSION_READ): stop following the run on this channel.
message DeviceExecutorTranscriptUnsubscribe {
  string run_id = 1;
}

// worker→client (SESSION_READ): a batch of a run's transcript, backlog or live.
message DeviceExecutorTranscript {
  string run_id = 1;
  // In seq order.
  repeated ExecutorTranscriptFragment fragments = 2;
  // Fragments older than the first one here were dropped by the worker's buffer cap and are gone;
  // the card renders an "earlier output omitted" marker. Set on the first backlog batch only.
  bool omitted = 3;
  // The run reached a terminal state: no more fragments follow and the subscription is closed.
  // `terminal` is the ledger's word (succeeded | rejected | model_error | tool_failed | cancelled
  // | unknown); `summary` and `error` are the outcome the host reported.
  bool ended = 4;
  string terminal = 5;
  string summary = 6;
  string error = 7;
  // The run's prompt, on the first batch that answers a subscription (empty on every other
  // batch). It travels only here, end to end; the center never sees it.
  string prompt = 8;
}

// client→worker (SESSION_CONTROL): cancel a run, through the ledger's ordinary cancel path (the
// one the `/agent` ExecutorCancel action uses). Idempotent; no acknowledgement — the outcome shows
// up in the center's ExecutorRuns snapshot and on the transcript subscription as `ended`.
message DeviceExecutorStop {
  string run_id = 1;
}

// ===== Loopback tunnel (plan 20260924-remote-localhost-tunnel) =====
//
// Lets a client reach TCP ports on the device's own loopback interface over an
// authenticated Device channel: the desktop app's built-in browser tab uses it so
// that `localhost` in a remote workspace means that workspace's device.
//
// Authority: every client-initiated payload below requires DEVICE_SCOPE_RPC, and
// every worker-initiated one is only delivered under it. RPC already allows `exec`
// of arbitrary commands on the device, so reaching the device's loopback grants
// nothing new. The client names a port, never an address: the worker dials only
// 127.0.0.1:<port>, falling back to [::1]:<port> when IPv4 fails.
//
// Connections are multiplexed on one channel by a client-chosen connection_id
// (non-zero, never reused during the channel's life). Frames of one connection
// are ordered because the channel is.
//
// Flow control is credit-based, per direction, counted in DATA FRAMES:
//   - A DeviceLoopbackData frame carries at most 64 KiB of data.
//   - Per connection, a sender keeps at most 8 unacknowledged data frames in flight.
//   - Per channel, the worker keeps at most 48 unacknowledged data frames in flight
//     across all its connections; the client keeps at most 16.
//   - The receiver acknowledges data frames with DeviceLoopbackAck once it has
//     handed them to its socket. The client acknowledges EVERY data frame it
//     receives, including frames for connections it has already closed: the
//     worker returns channel-wide credit only on acknowledgement.
// Neither side ever drops or reorders data: a receiver that cannot queue a frame
// closes that connection (DeviceLoopbackClose), never skips bytes.
//
// A worker that predates these payloads decodes them as an empty oneof and
// answers DeviceError{code:"empty_payload", request_id: unset}; clients treat
// exactly that as "the device's worker does not support the tunnel".

enum DeviceLoopbackFailure {
  DEVICE_LOOPBACK_FAILURE_UNSPECIFIED = 0;
  // Both 127.0.0.1 and [::1] refused the connection: nothing listens on the port.
  DEVICE_LOOPBACK_FAILURE_REFUSED = 1;
  // Any other dial error, including a timeout.
  DEVICE_LOOPBACK_FAILURE_UNREACHABLE = 2;
  // The per-channel or per-worker connection cap is reached.
  DEVICE_LOOPBACK_FAILURE_LIMIT = 3;
  // Invalid port or connection_id, or a connection_id already in use.
  DEVICE_LOOPBACK_FAILURE_INVALID = 4;
}

// client→worker (RPC): open a TCP connection to the device's loopback port.
message DeviceLoopbackOpen {
  uint32 connection_id = 1;
  // 1..=65535.
  uint32 port = 2;
}

// worker→client (RPC): the connection is established; data may flow both ways.
message DeviceLoopbackOpened {
  uint32 connection_id = 1;
}

// worker→client (RPC): the connection could not be opened. Terminal for the id.
message DeviceLoopbackFailed {
  uint32 connection_id = 1;
  DeviceLoopbackFailure reason = 2;
  // Diagnostic text for logs; never shown as the failure page.
  string message = 3;
}

// Both directions (client→worker requires RPC): bytes of an open connection.
message DeviceLoopbackData {
  uint32 connection_id = 1;
  // Non-empty, at most 64 KiB.
  bytes data = 2;
}

// Both directions (client→worker requires RPC): the receiver consumed `frames`
// data frames of the connection and returns that much credit to the sender.
message DeviceLoopbackAck {
  uint32 connection_id = 1;
  uint32 frames = 2;
}

// Both directions (client→worker requires RPC): the sender closed the
// connection. Data frames sent before it are still delivered in order; the
// receiver flushes them to its socket, then closes it. Terminal for the id.
message DeviceLoopbackClose {
  uint32 connection_id = 1;
}

// ===== Secret answers (plan 20260926-agent-secret-input) =====
//
// A desktop answers a pending secret request (announced to it through the center as
// SecretRequestRef) directly to the worker over this end-to-end channel, so the center never sees
// the value. Requires DEVICE_SCOPE_SESSION_CONTROL on the channel and nothing else: no attach, no
// holder_epoch, so a desktop that never opened the requesting terminal can answer. The worker
// arbitrates by request_id: the first answer wins and later ones are acknowledged as
// ALREADY_ANSWERED. Every answer gets exactly one DeviceSecretAnswerAck on the same channel.

enum SecretAnswerKind {
  SECRET_ANSWER_KIND_UNSPECIFIED = 0;
  // `value` carries the secret; the agent learns `provided`.
  SECRET_ANSWER_KIND_PROVIDE = 1;
  // The user refused; the agent learns `declined`.
  SECRET_ANSWER_KIND_DECLINE = 2;
  // The user closed the card; the agent learns `cancelled`.
  SECRET_ANSWER_KIND_CANCEL = 3;
}

enum SecretAnswerStatus {
  SECRET_ANSWER_STATUS_UNSPECIFIED = 0;
  // This answer settled the request.
  SECRET_ANSWER_STATUS_ACCEPTED = 1;
  // Another answer (possibly from another desktop) settled it first.
  SECRET_ANSWER_STATUS_ALREADY_ANSWERED = 2;
  // The request timed out, its terminal ended, or the agent stopped waiting.
  SECRET_ANSWER_STATUS_EXPIRED = 3;
  // This worker runtime never issued the request (for example after a hot upgrade).
  SECRET_ANSWER_STATUS_UNKNOWN_REQUEST = 4;
  // Malformed answer: unspecified kind, or an empty or oversized value for PROVIDE.
  SECRET_ANSWER_STATUS_INVALID = 5;
}

// client→worker (SESSION_CONTROL). `value` is only meaningful for PROVIDE and must be empty
// otherwise. Implementations must never log or debug-print this message.
message DeviceSecretAnswer {
  string request_id = 1;
  SecretAnswerKind kind = 2;
  string value = 3;
}

// worker→client (SESSION_CONTROL): the outcome of one DeviceSecretAnswer.
message DeviceSecretAnswerAck {
  string request_id = 1;
  SecretAnswerStatus status = 2;
}

// ===== Workspace changes (plan 20260929-changes-file-tree) =====
//
// The desktop changes view asks the worker for the list of changed files in one round trip, then
// fetches the content of one file at a time. Both are client→worker RPC requests (DEVICE_SCOPE_RPC)
// keyed by workspace_id; the worker resolves the worktree and default branch itself.
//
// A worker that predates these payloads decodes them as an empty oneof and answers
// DeviceError{code:"empty_payload", request_id: unset}; clients attribute exactly that, arriving on
// the RPC channel, to their in-flight changes requests and report that the daemon needs updating.

enum DeviceChangeStatus {
  DEVICE_CHANGE_STATUS_UNSPECIFIED = 0;
  DEVICE_CHANGE_STATUS_ADDED = 1;
  DEVICE_CHANGE_STATUS_MODIFIED = 2;
  DEVICE_CHANGE_STATUS_DELETED = 3;
  DEVICE_CHANGE_STATUS_RENAMED = 4;
  // Not tracked by git and not ignored (`git ls-files --others --exclude-standard`).
  DEVICE_CHANGE_STATUS_UNTRACKED = 5;
}

message DeviceChangedFile {
  // Path relative to the worktree root, in the working tree (the new path of a rename).
  string path = 1;
  // Set only for renames: the path at the base commit.
  optional string old_path = 2;
  DeviceChangeStatus status = 3;
  uint32 additions = 4;
  uint32 deletions = 5;
  // git numstat reports `-\t-`, or an untracked file contains NUL. Line counts are then zero.
  bool binary = 6;
  // The larger of the base-side and working-tree sizes, in bytes; the client's large-diff guard.
  uint64 size = 7;
}

// client→worker (RPC).
message DeviceChangesListRequest {
  string request_id = 1;
  string workspace_id = 2;
  // false (the default, and all an older client sends): the branch scope described below.
  // true: only uncommitted changes — `base` is HEAD (plan 20261001-changes-review-polish).
  // A worker that predates this field ignores it, answers the branch scope and never echoes it.
  bool uncommitted = 3;
}

// worker→client (RPC). Files are the diff of `base` against the working tree plus every untracked
// file; in the branch scope the totals equal the workspace's diff stat.
message DeviceChangesList {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
  // The commit every per-file request must compare against. Branch scope: merge-base of the default
  // branch and HEAD, falling back to HEAD. Uncommitted scope: HEAD. Empty when HEAD does not
  // resolve (an unborn branch): then only untracked files are listed.
  string base = 4;
  repeated DeviceChangedFile files = 5;
  // Echo of the request's `uncommitted`, set on every response including `ok: false`. A client that
  // asked for true and reads false is talking to a worker too old to honour the scope.
  bool uncommitted = 6;
}

// client→worker (RPC): the content of one changed file.
message DeviceChangesFileRequest {
  string request_id = 1;
  string workspace_id = 2;
  // The `base` of the list this file came from (a full commit id, or empty).
  string base = 3;
  string path = 4;
  // The base-side path of a rename.
  optional string old_path = 5;
  reserved 6;
  reserved "ignore_whitespace";
  // Which whitespace changes `patch` leaves out; sides are unaffected.
  ChangesWhitespace whitespace = 7;
}

// How a changed file's `patch` treats whitespace, one git flag per level.
enum ChangesWhitespace {
  // Every whitespace change is a hunk (no flag).
  CHANGES_WHITESPACE_UNSPECIFIED = 0;
  // `--ignore-space-at-eol`: whitespace at the end of a line.
  CHANGES_WHITESPACE_IGNORE_AT_EOL = 1;
  // `-b`: the amount of whitespace, and whitespace at the end of a line.
  CHANGES_WHITESPACE_IGNORE_CHANGE = 2;
  // `-w`: all whitespace, including whitespace added where there was none.
  CHANGES_WHITESPACE_IGNORE_ALL = 3;
}

// worker→client (RPC). Each side is the whole file so the client can highlight it as a unit;
// `patch` is `git diff -U0` of the pair (with the requested whitespace flag) and is empty when a side
// is missing or both are equal. With a whitespace flag it is also empty when the sides differ only
// in whitespace that flag ignores.
message DeviceChangesFile {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
  bool old_exists = 4;
  bool new_exists = 5;
  string old_content = 6;
  string new_content = 7;
  string patch = 8;
  // Either side contains NUL; contents are then left empty.
  bool binary = 9;
  reserved 10;
  reserved "ignore_whitespace";
  // Echo of the request's `whitespace`, set on every response whether or not a diff ran (added,
  // deleted, binary, equal sides, `ok: false`): it means "this worker decoded the field".
  ChangesWhitespace whitespace = 11;
}

// ===== Browser annotations (plan 20260929-browser-annotations) =====
//
// A desktop annotates elements of a page in its built-in browser tab; the annotations belong to
// the workspace and are kept by the worker of the device hosting it, under
// $COFLUX_HOME/annotations/<workspace_id>/ (an index plus one file per image). Their content —
// comments, element context, images — travels only over this end-to-end channel: none of these
// payloads carries an operation_id and none is ever reported to the center. The center only sees
// the metadata-only WorkspaceAnnotationSummary (revision and counts).
//
// Every request requires DEVICE_SCOPE_SESSION_CONTROL (not RPC): a local workspace's annotations
// keep working while the center is unreachable. A worker that predates these payloads decodes them
// as an empty oneof and answers DeviceError{code:"empty_payload", request_id: unset}; clients treat
// exactly that as "the device's worker does not support annotations", never a timeout.

enum AnnotationStatus {
  ANNOTATION_STATUS_UNSPECIFIED = 0;
  // Waiting for an agent.
  ANNOTATION_STATUS_PENDING = 1;
  // An agent ran `coflux annotations resolve` with a note; waiting for the user to confirm
  // (delete) or reopen it.
  ANNOTATION_STATUS_RESOLVED = 2;
}

enum AnnotationImageKind {
  ANNOTATION_IMAGE_KIND_UNSPECIFIED = 0;
  // Captured automatically from the page when the element was picked: its current state.
  ANNOTATION_IMAGE_KIND_SCREENSHOT = 1;
  // Pasted or attached by the user: what it should look like, or any other reference.
  ANNOTATION_IMAGE_KIND_REFERENCE = 2;
}

// Enough about the annotated element to find it again on the page and in the code. Every field is
// best effort; the desktop fills what it could read.
message AnnotationElement {
  // A CSS selector that matched exactly this element when it was picked.
  string selector = 1;
  // The element's path from <html>, as tag:nth-of-type(n) steps joined by " > ".
  string dom_path = 2;
  string tag = 3;
  // The element's visible text, trimmed and shortened.
  string text = 4;
  string element_id = 5;
  repeated string classes = 6;
  // A few identifying attributes (role, aria-label, name, type, href, alt, placeholder, data-testid…).
  map<string, string> attributes = 7;
  // A few computed styles (color, font-size, padding…), for mapping onto the design system.
  map<string, string> styles = 8;
  // Size in CSS pixels when picked.
  double width = 9;
  double height = 10;
}

// Framework source identity of the element, read from the page's own development data.
message AnnotationSource {
  // "react", "vue", or empty when none was recognised.
  string framework = 1;
  // Component names from the innermost outwards.
  repeated string components = 2;
  // Source location when the page exposes it (React <= 18 development builds, Vue's __file).
  string file = 3;
  uint32 line = 4;
  uint32 column = 5;
}

// One element an annotation points at (plan 20260929-annotation-polish): its page context and
// its own framework source identity.
message AnnotationTarget {
  AnnotationElement element = 1;
  AnnotationSource source = 2;
}

// A rectangle the user dragged on the live page, stored relative to the border box of the
// annotation's target 0 (the innermost element containing it) so it follows scrolling and reflow.
// When only <body> contains it, it is a fixed document position.
message AnnotationRegion {
  // CSS pixels from target 0's top-left corner when the region was drawn.
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

message AnnotationImage {
  // Assigned by the worker.
  string image_id = 1;
  AnnotationImageKind kind = 2;
  string mime_type = 3;
  uint32 size = 4;
  // Absolute path of the file on the workspace's device (read-only, filled by the worker).
  string path = 5;
}

// A comment added when a resolved annotation was reopened.
message AnnotationFollowUp {
  string comment = 1;
  // The agent's note the comment answers.
  string previous_note = 2;
  double created_at = 3;
}

// Which side of a diff a code comment's lines are on (plan 20261001-changes-review-comments).
enum AnnotationCodeSide {
  ANNOTATION_CODE_SIDE_UNSPECIFIED = 0;
  // The comparison base: the commit the changes view compared against (`base_commit`).
  ANNOTATION_CODE_SIDE_BASE = 1;
  // The workspace's working tree.
  ANNOTATION_CODE_SIDE_WORKING_TREE = 2;
}

// Where a code comment sits: lines of one file of the workspace, as the changes view showed them
// (plan 20261001-changes-review-comments). An annotation carries either this or page targets.
message AnnotationCodeAnchor {
  // Worktree-relative path on that side (a rename's old path for a base-side anchor).
  string path = 1;
  AnnotationCodeSide side = 2;
  // First and last commented line, 1-based and inclusive, on that side. A hint: the desktop
  // re-finds the lines by `excerpt` when the file has changed since.
  uint32 start_line = 3;
  uint32 end_line = 4;
  // The commented lines' text when the comment was written, one line per line (capped by the
  // worker).
  string excerpt = 5;
  // For a base-side anchor, the commit the lines were read from; empty for the working tree.
  string base_commit = 6;
}

message Annotation {
  // Assigned by the worker on creation.
  string annotation_id = 1;
  // Stable display number within the workspace (#1, #2…), assigned by the worker.
  uint32 number = 2;
  AnnotationStatus status = 3;
  string page_url = 4;
  string page_title = 5;
  string comment = 6;
  // Replaced by `targets` and `region` (plan 20260929-annotation-polish); never reuse them.
  reserved 7, 8;
  reserved "element", "source";
  repeated AnnotationImage images = 9;
  // The agent's note from `coflux annotations resolve`.
  string resolution_note = 10;
  repeated AnnotationFollowUp follow_ups = 11;
  double created_at = 12;
  double updated_at = 13;
  double resolved_at = 14;
  // The elements the annotation points at, at least one unless `code` is set. Target 0 is the anchor: the clicked
  // element, the first of a shift-click selection, or the element containing `region`. For a
  // region annotation the other targets are the top-level elements inside the region.
  repeated AnnotationTarget targets = 15;
  // Set when the user dragged a region instead of picking elements.
  AnnotationRegion region = 16;
  // A code comment written in the changes view (plan 20261001-changes-review-comments): set
  // instead of `targets` (an annotation has one or the other). An edit that sends none keeps it.
  AnnotationCodeAnchor code = 17;
}

// An image uploaded with a put. `data` is the encoded image (PNG, JPEG, WebP or GIF).
message AnnotationImageUpload {
  AnnotationImageKind kind = 1;
  string mime_type = 2;
  bytes data = 3;
}

// Create (empty annotation_id) or edit an annotation. On edit only the comment, the targets, the
// region, the code anchor and the images change; status and numbering are the worker's.
message AnnotationPut {
  Annotation annotation = 1;
  repeated AnnotationImageUpload add_images = 2;
  repeated string remove_image_ids = 3;
}

// Confirm (or delete) annotations. They disappear at once; the worker keeps them (images
// included) restorable for a short grace window, then purges them.
message AnnotationDelete {
  repeated string annotation_ids = 1;
}

// Undo a delete, confirm or clear-resolved within the grace window: the annotations come back
// exactly as they were (id, number, status, images, follow-ups). Ids already purged are skipped.
message AnnotationRestore {
  repeated string annotation_ids = 1;
}

// A resolved annotation goes back to pending with an added comment.
message AnnotationReopen {
  string annotation_id = 1;
  string comment = 2;
}

// Delete every resolved annotation of the workspace.
message AnnotationClearResolved {}

// client→worker (SESSION_CONTROL): the workspace's annotations, every status.
message DeviceAnnotationsList {
  string request_id = 1;
  string workspace_id = 2;
}

// worker→client (SESSION_CONTROL).
message DeviceAnnotationsListed {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  uint32 revision = 4;
  repeated Annotation annotations = 5;
  // Set by every worker that stores code anchors (plan 20261001-changes-review-comments), on every
  // response including `ok: false`: it means "this worker decodes Annotation.code", not that the
  // store is healthy. Without it the changes view offers no code comments.
  bool code_comments = 6;
}

// client→worker (SESSION_CONTROL): one change to the workspace's annotations.
message DeviceAnnotationsMutate {
  string request_id = 1;
  string workspace_id = 2;
  oneof action {
    AnnotationPut put = 3;
    AnnotationDelete delete = 4;
    AnnotationReopen reopen = 5;
    AnnotationClearResolved clear_resolved = 6;
    AnnotationRestore restore = 7;
  }
}

// worker→client (SESSION_CONTROL): the outcome; `annotation` is the stored result of a put or reopen.
message DeviceAnnotationsMutated {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  uint32 revision = 4;
  Annotation annotation = 5;
  // For a delete or clear-resolved: exactly the ids it removed, which one restore brings back.
  repeated string removed_ids = 6;
}

// client→worker (SESSION_CONTROL): one image file of an annotation.
message DeviceAnnotationImageRead {
  string request_id = 1;
  string workspace_id = 2;
  string annotation_id = 3;
  string image_id = 4;
}

// worker→client (SESSION_CONTROL).
message DeviceAnnotationImageData {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  string mime_type = 4;
  bytes data = 5;
}

// client→worker (SESSION_CONTROL): type `text` into an agent's terminal of the workspace, then
// Enter, as the worker's agent input does (refused while another person holds the terminal).
// Used only when this desktop does not itself hold the terminal.
message DeviceAnnotationHandOff {
  string request_id = 1;
  string workspace_id = 2;
  string session_id = 3;
  string text = 4;
}

// worker→client (SESSION_CONTROL). `held` is set when the refusal is a person holding the terminal.
message DeviceAnnotationHandOffResult {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
  bool held = 4;
}

// ===== Remote screen (plan 20260929-remote-desktop) =====
//
// A desktop views and drives another of the account's Macs from a 「屏幕」 tab. The controlled
// side is `coflux-screen`, a helper shipped inside Coflux Desktop and started on demand by the
// worker as a detached process; the worker only gates scope and bridges frames between device
// channels and the helper over a Unix socket (ScreenHelperFrame below). The helper owns the
// session, its virtual display, the holder epoch and the 10-minute orphan grace, so a worker
// restart or hot upgrade neither ends the session nor removes the display.
//
// Authority: every client-initiated payload below requires DEVICE_SCOPE_RPC and every
// worker-initiated one is delivered only under it. A device advertises `screen_v1`
// (DaemonInfo.capabilities) only when its worker found the helper and the helper answered its
// hello; clients offer the tab only for such devices.
//
// Lanes: one session uses two device channels of the same client, both RPC scope. The CONTROL lane
// carries open/close/resize/pause/resume, input, cursor, clipboard and state. The VIDEO lane is
// bound to the session with ScreenVideoAttach and then carries only ScreenVideoFrame downstream and
// ScreenVideoCredit / ScreenKeyframeRequest upstream, so input never queues behind video.
//
// Video flow control is credit-based, counted in BYTES of ScreenVideoFrame.data, drop-at-source:
//   - the client grants credit in ScreenVideoAttach.credit_bytes and ScreenVideoCredit.bytes;
//   - the helper never has more frame bytes in flight than it has credit; a captured frame that
//     does not fit is dropped (never queued) and the next frame delivered is a keyframe;
//   - the client returns the bytes of every chunk it received once handed to its decoder, whether
//     or not it decoded it;
//   - one message carries at most 256 KiB of data (SCREEN_VIDEO_CHUNK_BYTES); a larger frame is
//     split into messages sharing frame_seq, numbered by chunk_index / chunk_count, `last` set on
//     the final one; a receiver that sees a gap discards the frame and asks for a keyframe;
//   - a client starts with 2 MiB of credit on a relayed path and 8 MiB on a direct one.
// Nothing between the helper and the client drops a video chunk: the worker clamps a lane's credit
// to 64 chunks (a quarter of the transport helper's shared 256-record queue, the loopback tunnel's
// budget), so the credit itself bounds the records queued in the channel's sink, and a chunk the
// sink still cannot take closes the lane like any other payload (the client reopens and resyncs).
// Only cursor updates are dropped under backpressure: the next one supersedes a lost one.
//
// Holder: the helper keeps at most one session per device, with a holder_epoch starting at 1. A
// ScreenSessionOpen while another client holds the session is refused with code "held" unless
// `force` is set (「重新接管」), in which case the previous holder receives ScreenSessionDetached.
// Reopening with the same client_instance_id reattaches without changing the holder.
//
// Video is H.264 (High profile, no B-frames) in Annex B byte-stream form with SPS/PPS in band on
// every keyframe, so a decoder configures from the stream alone. The codec is negotiated so HEVC
// can be added later.
//
// A worker that predates these payloads decodes them as an empty oneof and answers
// DeviceError{code:"empty_payload", request_id: unset}; clients attribute exactly that, arriving on
// a screen lane, to their in-flight open and report that the daemon needs updating.

enum ScreenVideoCodec {
  SCREEN_VIDEO_CODEC_UNSPECIFIED = 0;
  SCREEN_VIDEO_CODEC_H264 = 1;
  SCREEN_VIDEO_CODEC_HEVC = 2;
}

enum ScreenSessionPhase {
  SCREEN_SESSION_PHASE_UNSPECIFIED = 0;
  // Waking displays, creating the virtual display, configuring mirroring.
  SCREEN_SESSION_PHASE_STARTING = 1;
  // Capture is running; frames flow as credit allows.
  SCREEN_SESSION_PHASE_STREAMING = 2;
  // The holder paused the stream (background tab); the virtual display stays.
  SCREEN_SESSION_PHASE_PAUSED = 3;
  // Screen Recording is not granted on the remote: no picture until it is.
  SCREEN_SESSION_PHASE_NO_PERMISSION = 4;
  // The remote login session is locked: no picture, remote unlock is unsupported.
  SCREEN_SESSION_PHASE_LOCKED = 5;
}

// TCC state of the helper's process tree on the remote Mac. Without accessibility the picture is
// read-only (input is ignored); without screen_recording there is no picture.
message ScreenPermissions {
  bool screen_recording = 1;
  bool accessibility = 2;
}

// The virtual display as applied on the remote: points × scale = pixels. Pointer coordinates in
// ScreenInput are in these points; video frames are in these pixels.
message ScreenDisplayGeometry {
  uint32 width_points = 1;
  uint32 height_points = 2;
  // 1 or 2 (HiDPI).
  uint32 scale = 3;
  uint32 width_pixels = 4;
  uint32 height_pixels = 5;
}

// The full state of a session: carried in ScreenSessionOpened and, on every change, in
// ScreenSessionState. `error` is diagnostic text for the last failure, if any.
message ScreenSessionStatus {
  ScreenSessionPhase phase = 1;
  ScreenPermissions permissions = 2;
  bool locked = 3;
  ScreenDisplayGeometry display = 4;
  optional string error = 5;
}

// client→worker (RPC), CONTROL lane: open or reattach a session.
message ScreenSessionOpen {
  string request_id = 1;
  // Client-chosen, stable for the life of the tab across reconnects and app restarts, so that a
  // reconnect reattaches to the same remote session and virtual display.
  string session_id = 2;
  string client_instance_id = 3;
  uint64 transport_generation = 4;
  // Preempt the current holder.
  bool force = 5;
  // The size of the tab in points and the local scale; the remote virtual display follows them.
  uint32 width_points = 6;
  uint32 height_points = 7;
  uint32 scale = 8;
  // The client's decoders, most preferred first.
  repeated ScreenVideoCodec codecs = 9;
}

// worker→client (RPC), CONTROL lane. On ok the session is held by this channel with holder_epoch
// and every later control request must carry that epoch. Codes on failure: "held" (another client
// holds it and force was not set), "unsupported_codec", "no_helper" (the helper could not be
// started or reached), "no_display" (the virtual display could not be created), "invalid".
message ScreenSessionOpened {
  string request_id = 1;
  string session_id = 2;
  bool ok = 3;
  optional string error = 4;
  string code = 5;
  uint64 holder_epoch = 6;
  ScreenVideoCodec codec = 7;
  ScreenSessionStatus status = 8;
}

// worker→client (RPC), CONTROL lane: the session's state changed (permissions, lock, display
// geometry, phase).
message ScreenSessionState {
  string session_id = 1;
  ScreenSessionStatus status = 2;
}

// client→worker (RPC), CONTROL lane: end the session (the tab was closed). The virtual display is
// removed and the remote's previous display arrangement restored.
message ScreenSessionClose {
  string request_id = 1;
  string session_id = 2;
  uint64 holder_epoch = 3;
}

// worker→client (RPC), CONTROL lane.
message ScreenSessionClosed {
  string request_id = 1;
  string session_id = 2;
  bool ok = 3;
  optional string error = 4;
}

// client→worker (RPC), CONTROL lane: the tab changed size; the virtual display follows. resize_seq
// starts at 1 and is monotonic per holder; a smaller seq is stale and ignored. The new geometry is
// reported back in ScreenSessionState and the next frame is a keyframe at the new size.
message ScreenSessionResize {
  string session_id = 1;
  uint64 holder_epoch = 2;
  uint64 resize_seq = 3;
  uint32 width_points = 4;
  uint32 height_points = 5;
  uint32 scale = 6;
}

// client→worker (RPC), CONTROL lane: stop capturing (background tab). The virtual display, the
// mirror and the power assertions stay so remote windows are not reshuffled.
message ScreenSessionPause {
  string session_id = 1;
  uint64 holder_epoch = 2;
}

// client→worker (RPC), CONTROL lane: capture again; the next frame is a keyframe.
message ScreenSessionResume {
  string session_id = 1;
  uint64 holder_epoch = 2;
}

// worker→client (RPC), CONTROL lane: another client took the session over (「已被其它客户端接管」).
// The virtual display now belongs to the new holder; this channel's epoch is dead.
message ScreenSessionDetached {
  string session_id = 1;
  uint64 holder_epoch = 2;
  optional string reason = 3;
}

// worker→client (RPC), CONTROL lane: the helper ended the session on its own: the orphan grace
// expired, the helper is stopping, or the session was closed from another channel. Terminal.
message ScreenSessionEnded {
  string session_id = 1;
  string reason = 2;
}

// client→worker (RPC), VIDEO lane: bind this channel as the session's video sink and grant the
// initial credit. Replaces any previous video lane of the session; the next frame is a keyframe.
message ScreenVideoAttach {
  string session_id = 1;
  uint64 holder_epoch = 2;
  uint64 credit_bytes = 3;
}

// worker→client (RPC), VIDEO lane.
message ScreenVideoAttached {
  string session_id = 1;
  bool ok = 2;
  optional string error = 3;
}

// client→worker (RPC), VIDEO lane: return credit for frame bytes handed to the decoder.
message ScreenVideoCredit {
  string session_id = 1;
  uint64 bytes = 2;
}

// client→worker (RPC), VIDEO lane: the decoder needs a keyframe (after a decode error, a reconnect
// or a discarded frame).
message ScreenKeyframeRequest {
  string session_id = 1;
}

// worker→client (RPC), VIDEO lane: one encoded frame, or one chunk of it. width/height are the
// coded size and are set on every chunk. pts_us is the capture time in microseconds on the
// remote's monotonic clock, for pacing only.
message ScreenVideoFrame {
  string session_id = 1;
  uint64 frame_seq = 2;
  bool keyframe = 3;
  uint64 pts_us = 4;
  uint32 width_pixels = 5;
  uint32 height_pixels = 6;
  ScreenVideoCodec codec = 7;
  bytes data = 8;
  bool last = 9;
  // Position of this chunk within the frame (0-based) and the frame's chunk count, so a receiver
  // detects a missing chunk instead of assembling a frame with a hole: any gap discards the frame
  // and asks for a keyframe. `last` == (chunk_index + 1 == chunk_count).
  uint32 chunk_index = 10;
  uint32 chunk_count = 11;
}

enum ScreenPointerAction {
  SCREEN_POINTER_ACTION_UNSPECIFIED = 0;
  SCREEN_POINTER_ACTION_MOVE = 1;
  SCREEN_POINTER_ACTION_DOWN = 2;
  SCREEN_POINTER_ACTION_UP = 3;
}

// Modifier bits of ScreenKeyEvent / ScreenPointerEvent / ScreenScrollEvent.modifiers.
enum ScreenModifier {
  SCREEN_MODIFIER_UNSPECIFIED = 0;
  SCREEN_MODIFIER_SHIFT = 1;
  SCREEN_MODIFIER_CONTROL = 2;
  SCREEN_MODIFIER_OPTION = 4;
  SCREEN_MODIFIER_COMMAND = 8;
  SCREEN_MODIFIER_CAPS_LOCK = 16;
  SCREEN_MODIFIER_FUNCTION = 32;
}

// A key by physical position: `code` is the DOM KeyboardEvent.code ("KeyA", "MetaLeft", "Digit1",
// "ArrowUp"…), mapped to a macOS virtual key code on the remote, so neither side's layout or input
// method interferes.
message ScreenKeyEvent {
  string code = 1;
  bool down = 2;
  uint32 modifiers = 3;
  // An auto-repeat of a held key (DOM KeyboardEvent.repeat); the remote posts it as an autorepeat
  // key-down (kCGKeyboardEventAutorepeat) so held arrows and Delete repeat as they would locally.
  bool repeat = 4;
}

// Pointer in display points, origin top-left of the virtual display. button: 0 left, 1 right,
// 2 middle, 3+ other. click_count is macOS's click count (1 single, 2 double…).
message ScreenPointerEvent {
  ScreenPointerAction action = 1;
  double x = 2;
  double y = 3;
  uint32 button = 4;
  uint32 modifiers = 5;
  uint32 click_count = 6;
}

// Scroll at a position, deltas in points (precise = trackpad pixel deltas) or lines.
message ScreenScrollEvent {
  double x = 1;
  double y = 2;
  double delta_x = 3;
  double delta_y = 4;
  uint32 modifiers = 5;
  bool precise = 6;
}

// client→worker (RPC), CONTROL lane. Ignored without accessibility on the remote.
message ScreenInput {
  string session_id = 1;
  uint64 holder_epoch = 2;
  oneof event {
    ScreenKeyEvent key = 3;
    ScreenPointerEvent pointer = 4;
    ScreenScrollEvent scroll = 5;
  }
}

// The remote cursor image (PNG, sized in points at the remote scale) and its hotspot.
message ScreenCursorShape {
  bytes png = 1;
  uint32 width_points = 2;
  uint32 height_points = 3;
  double hotspot_x = 4;
  double hotspot_y = 5;
}

// worker→client (RPC), CONTROL lane: the remote cursor moved or changed; `shape` is present only
// when it changed. x/y are display points. The client draws it locally so pointer feel does not
// wait for video.
message ScreenCursor {
  string session_id = 1;
  double x = 2;
  double y = 3;
  bool visible = 4;
  ScreenCursorShape shape = 5;
}

message ScreenClipboardContent {
  oneof content {
    string text = 1;
    bytes png = 2;
  }
}

// client→worker (RPC), CONTROL lane: the local clipboard changed; put it on the remote pasteboard.
message ScreenClipboardSet {
  string session_id = 1;
  uint64 holder_epoch = 2;
  ScreenClipboardContent content = 3;
}

// worker→client (RPC), CONTROL lane: the remote pasteboard changed.
message ScreenClipboardChanged {
  string session_id = 1;
  ScreenClipboardContent content = 2;
}

// ----- worker ⟷ coflux-screen (Unix socket under $COFLUX_HOME, mode 0600) -----
//
// Each record is `length:u32 BE || ScreenHelperFrame`. The worker opens the socket, sends hello
// first and expects hello_ack; both sides upgrade independently (the helper with the desktop
// app, the worker hot), so a version mismatch is reported in the ack and the worker then does not
// advertise `screen_v1`. After the hello the worker forwards every screen payload it receives on a
// device channel as `envelope` (channel_id set to the lane it came from), and the helper answers
// with `envelope`s whose channel_id names the lane to deliver to. `channel_closed` tells the
// helper a lane went away without ending the session: the helper releases that lane's hold and
// starts the orphan grace when no lane holds the session.

message ScreenHelperHello {
  uint32 protocol_version = 1;
  string worker_version = 2;
}

message ScreenHelperHelloAck {
  uint32 protocol_version = 1;
  string helper_version = 2;
  bool ok = 3;
  optional string error = 4;
  ScreenPermissions permissions = 5;
  // A session survives from before this worker connection (a worker restart).
  bool session_active = 6;
}

message ScreenHelperChannelClosed {
  string channel_id = 1;
}

// worker→helper: this helper is not the one the runtime ships (typically after a desktop update).
// The helper stops listening at once — closes and unlinks its socket so the current binary can take
// the path — while the connection this arrived on stays up. Without `tear_down` (a compatible
// helper of another version) it keeps serving the session it holds over that connection and exits
// once that session ends (close or orphan grace) or at once when it holds none; the worker's normal
// reconnect then starts the shipped binary. With `tear_down` (a protocol the worker cannot serve
// through) it ends its session immediately — virtual display removed, arrangement restored, no
// grace — and exits. Either way two helpers never hold virtual displays at the same time.
message ScreenHelperRetire {
  bool tear_down = 1;
}

message ScreenHelperFrame {
  oneof payload {
    ScreenHelperHello hello = 1;
    ScreenHelperHelloAck hello_ack = 2;
    ScreenHelperChannelClosed channel_closed = 3;
    DeviceEnvelope envelope = 4;
    ScreenHelperRetire retire = 5;
  }
}

message DeviceEnvelope {
  uint32 protocol_version = 1;
  // 已认证后的 inner channel_id 必须与 loopback/relay/UDS 外层 channel 相同；LocalGatewayHello
  // 与中心 prepared template 尚未绑定 channel 时必须为空。
  string channel_id = 2;
  oneof payload {
    LocalGatewayHello local_gateway_hello = 10;
    LocalClientHello local_client_hello = 11;
    LocalAuthResult local_auth_result = 12;
    DeviceSessionCatalogRequest session_catalog_request = 20;
    DeviceSessionCatalog session_catalog = 21;
    DeviceExitAck exit_ack = 22;
    DeviceSessionAttach session_attach = 23;
    DeviceSessionAttached session_attached = 24;
    DevicePtyOutput pty_output = 25;
    DevicePtyGap pty_gap = 26;
    DevicePtyInput pty_input = 27;
    DevicePtyResize pty_resize = 28;
    DeviceSessionStop session_stop = 29;
    DeviceSessionDetached session_detached = 30;
    DeviceSessionExited session_exited = 31;
    DeviceSessionCreate session_create = 32;
    DeviceOperationAck operation_ack = 33;
    DeviceSessionSnapshotRequest session_snapshot_request = 34;
    DeviceSessionSnapshot session_snapshot = 35;
    DevicePtyInputAck pty_input_ack = 36;
    DeviceProjectValidate project_validate = 40;
    DeviceProjectValidated project_validated = 41;
    DeviceWorktreeAdd worktree_add = 42;
