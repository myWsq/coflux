// Daemon ⟷ Server 链路（/daemon WebSocket）。
// wire：每个 WS binary message = 一个 protobuf 编码的信封（DaemonToServer / ServerToDaemon）。
// 旧 JSON 控制面 + 自定义二进制帧已收敛为单一 protobuf binary，protojson 仅用于日志调试。
syntax = "proto3";

package coflux.v1;

import "coflux/v1/common.proto";
import "coflux/v1/device.proto";

// ===== Daemon → Server 载荷 =====

message DaemonAuth {
  uint32 control_protocol_version = 6;
  string device_token = 1;
  string worker_version = 2;
  string supervisor_version = 3;
  string arch = 4;
  // worker 宣告的控制面能力名（plan 091）。中心按能力名而非版本号做门禁：dev/测试的 worker
  // 上报 `builtin`，自动升级也刻意不做 semver 比较。旧 worker 不发此字段 → 自然被挡。
  // 现有能力名：`prepared_execute`（认识 PreparedDeviceOperationExecute）、
  // `terminal_io`（认识 ServerAgentRequest 的读/写）。新增控制消息时同步加能力名。
  repeated string capabilities = 5;
}

// 本地无凭证（未登记）时：申请一次性授权链接（Tailscale 式，见 docs/auth-design.md）
message DaemonEnrollRequest {
  uint32 control_protocol_version = 8;
  string name = 1;
  string host = 2;
  string platform = 3;
  string worker_version = 4;
  string supervisor_version = 5;
  string arch = 6;
  // 同 DaemonAuth.capabilities：首次登记的连接不会再走 DaemonAuth，能力必须随登记一起上报。
  repeated string capabilities = 7;
}

// 独立于认证消息的 gateway capability announce；保持旧认证构造面完全兼容，worker 可在
// authed 后及 gateway identity 变化时重复上报，server 以 daemon 连接身份绑定该 descriptor。
message LocalGatewayAnnounce {
  LocalGatewayDescriptor gateway = 1;
}

message DaemonResync {
  repeated SessionRef sessions = 1;
  // snapshot owner 是 supervisor 启动实例生成的随机身份；epoch 只由持有 PTY/catalog
  // 真相的 supervisor 递增。server 用两者拒绝旧 outbox 重放，不能由 worker 自行猜代际。
  string snapshot_owner_id = 2;
  uint64 snapshot_epoch = 3;
}

// 校验路径是否为（非裸）git 仓库的结果
message ProjectValidated {
  string request_id = 1;
  bool ok = 2;
  string repo_path = 3;
  string branch = 4;
  optional string error = 5;
  // worker 从 remote URL 推导出的 namespace/project；不传原始 URL，缺失时 server 回退仓库根目录名
  optional string suggested_name = 6;
}

// git worktree add 结果
message WorktreeAdded {
  string request_id = 1;
  bool ok = 2;
  string path = 3;
  string branch = 4;
  optional string error = 5;
}

message SessionStarted {
  string session_id = 1;
  string task_id = 2;
  int32 pid = 3;
}

message SessionExit {
  string session_id = 1;
  int32 exit_code = 2;
}

// 全量幂等上报每个（存活）会话监听的端口；仅含有监听端口的 session，daemon 重连/漏报自愈
message PortsUpdate {
  repeated SessionPorts sessions = 1;
}

// 全量幂等上报存活会话进程树内检测到的 agent（plan 073）；仅含检测到 agent 的 session，
// 变化才发、认证后无条件补发一次（与 PortsUpdate 同形态）。
message SessionAgents {
  repeated SessionAgentRef sessions = 1;
}

// ===== agent 协同控制（plan 074）=====
//
// 跑在 PTY 里的 agent 经 loopback 发起的中心操作。worker 已用调用方 pid 反查进程树确认它
// 属于 session_id 这个存活会话（树外 pid 在 worker 侧就被拒，永不到达这里）；server 据
// session_id 反查 task→workspace 得到发起方的归属工作区。
//
// 目标工作区是 daemon **提议**、server **核验**（plan 102）：agent 可以经 `/cd`、EnterWorktree
// 把活着的会话挪进同设备的另一个 coflux 工作区，worker 把调用方申报的 cwd 在本地工作区表里做
// 最长前缀匹配，命中就填进 workspace_id。server 只在它同账号、同设备（仓库工作区还要求所属项目
// 未在删除中）时接受，否则可读拒绝——信任模型与 MCP create_terminal 一致，只是那里终端可以落在
// 账号的任意设备上，这里必须同设备（终端就在这台机器上跑）。
//
// request_id 由 worker 生成，只做响应关联，不承担幂等：terminal_new 有副作用但不做
// exactly-once 去重——CLI 不自动重试，在飞请求遇断连即把错误交给 agent 自己决定
// （见 plans/074 Decisions）。这条与 browser 的 prepared operation 不同：daemon 控制 WS
// 是已认证的可信面，无需 operation_id 模板。
message AgentTerminalNew {
  string title = 1;
  // worker 已写好的临时包装脚本绝对路径，server 原样填进 SessionCreate.shell。
  // server 不解释也不校验它——脚本由 daemon 自己生成、只回到同一个 daemon 执行。
  string shell = 2;
}

message AgentTerminalList {}

// 读某个终端当前内容。取的是中心缓存的 checkpoint 而非 daemon 本地 snapshot：本地 snapshot
// 在 session 退出后就没了，而「命令跑完了看输出」恰恰是 agent 最常用的场景（见 plans/074
// 执行期偏离记录）。中心 checkpoint 滞后 ≤2s（CHECKPOINT_INTERVAL），且经 server 天然完成
// 「该 task 与发起方同 workspace」的归属校验。
message AgentTerminalRead {
  string task_id = 1;
}

// 本会话进程树监听端口的预览 URL。必须经中心：URL 由 server 用 proxyHost 配置 + shortId
// 路由表生成（apps/server/src/proxy.ts），daemon 侧无从得知。
message AgentPortsList {}

// ===== 跟随 agent 进入 worktree（plan 104）=====
//
// Claude Code 的 EnterWorktree / ExitWorktree 会把**活着的会话**切进（切出）一个 git worktree，
// `--resume` 一个曾进入 worktree 的会话则在启动时直接把它放回去。coflux 跟着走：终端的**归属**
// 工作区搬到 cwd 对应的那个工作区，未注册的（Claude 自建在 `<主工作区>/.claude/worktrees/<name>`）
// 先登记再搬。PTY、会话、turn 状态一概不动，只改 task 的归属。
//
// 与上面 `AgentControlRequest.workspace_id`（plan 102 的「本次请求的**目标**」）是两层，不能混：
// 那个字段只改一次请求打到哪个工作区，归属不变；这里改的是归属本身。纯 `cd` 只走 102，显式的
// 进入/离开 worktree、resume、worktree 被删才走这里。
//
// 信任模型与 102 一致：**daemon 解析身份、中心核验落库、归属的唯一真相在中心**。路径是不是一个
// worktree 根、它和发起方是不是同一个 git 仓库、当前分支是什么，都只有 daemon 能答（中心手里的
// 路径是用户原始写法，且中心没有 git）；中心只核验同账号、同设备、同项目，并决定复用还是登记。
// daemon 的会话账本随响应更新归属，仍然不按 cwd 猜。

// 把发起方会话的终端归属定位到某个路径所属的工作区。Enter / Exit / SessionStart 共用一条消息：
// ExitWorktree 的目标就是「原目录所在的那个工作区」，同样是定位。
message AgentWorkspaceLocate {
  // daemon 规范化后的 worktree 根绝对路径（`git rev-parse --show-toplevel`）。
  string path = 1;
  // 该 worktree 的当前分支（detached 时是短 sha）；登记新工作区时同时用作分支与默认名称。
  string branch = 2;
  // daemon 在本设备工作区表里按规范化路径**相等**比出来的既有工作区 id；空 = 未注册。
  // 相等而非最长前缀：Claude 自建的 worktree 嵌在主工作区目录下，前缀匹配会把它算进主工作区。
  string workspace_id = 3;
  // daemon 已核验该路径与发起方归属工作区同属一个 git 仓库（`git rev-parse --git-common-dir` 相同）。
  // 只有为真时中心才允许登记新工作区；跨仓库 / 非 git / 目录工作区起步都恒为假。
  bool same_repo = 4;
}

// Claude Code 已清理掉某个 worktree（WorktreeRemove）：把该工作区下**所有**终端搬回项目主工作区，
// 并删掉工作区记录。中心不再让 daemon 去 `git worktree remove` 一个已经不存在的目录。
message AgentWorkspaceForget {
  // daemon 规范化后的 worktree 路径（目录已不在时按字面 + 父目录规范化）。
  string path = 1;
  // daemon 按路径相等比出来的既有工作区 id；空 = 本地表里没有对应记录。
  string workspace_id = 2;
}

message AgentWorkspaceLocateResult {
  // 定位后的**归属**工作区 id：daemon 据此更新会话账本，agent 据此拿到新坐标。
  string workspace_id = 1;
  string path = 2;
  string branch = 3;
  // 本次是否新登记了工作区（侧栏会新出现一张卡片）。
  bool created = 4;
  // 归属是否真的变了；false = 本来就在那儿（幂等无操作，正常启动的常态）。
  bool moved = 5;
}

message AgentWorkspaceForgetResult {
  string workspace_id = 1;
  // 终端们搬回的项目主工作区（`is_main`）。
  string fallback_workspace_id = 2;
  int32 moved_terminals = 3;
  bool removed = 4;
}

message AgentControlRequest {
  string request_id = 1;
  // 发起方所属的存活 session，由 worker 认定而非 agent 自报。
  string session_id = 2;
  // 调用方 cwd 所在的工作区（plan 102）：空 = 发起 task 所在工作区（旧 worker 恒空）。
  // 只作用于 terminal_new（终端建在这里、也跑在这里）与 terminal_list（列这里的终端）；
  // ports_list 忽略它（端口挂在本会话进程树上，与工作区无关），terminal_read 早已本地闭环。
  string workspace_id = 3;
  oneof payload {
    AgentTerminalNew terminal_new = 10;
    AgentTerminalList terminal_list = 11;
    AgentTerminalRead terminal_read = 12;
    AgentPortsList ports_list = 13;
    // plan 104：这两条改的是**归属**而不是本次请求的目标，忽略上面的 workspace_id（worker 恒填空）。
    AgentWorkspaceLocate workspace_locate = 14;
    AgentWorkspaceForget workspace_forget = 15;
  }
}

message AgentTerminalNewResult {
  string task_id = 1;
  string session_id = 2;
}

// 同 workspace 下一个终端的对外视图；status/exit_code 取自中心的 Task 真相。
message AgentTerminalRef {
  string task_id = 1;
  string title = 2;
  TaskStatus status = 3;
  optional int32 exit_code = 4;
  optional string session_id = 5;
  double created_at = 6;
}

message AgentTerminalListResult {
  repeated AgentTerminalRef terminals = 1;
}

message AgentTerminalReadResult {
  // 中心缓存的最后一个 checkpoint 的规范化 ANSI；去转义成纯文本由 CLI 侧负责
  // （snapshot 同时是 checkpoint 的数据来源，不为 agent 可读性改它的语义）。
  // 无 checkpoint（如刚建还没输出）时为空，不是错误。
  bytes ansi_snapshot = 1;
  double captured_at = 2;
  TaskStatus status = 3;
  optional int32 exit_code = 4;
}

message AgentPortsListResult {
  repeated PortPreview ports = 1;
}

message AgentControlResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
  oneof payload {
    AgentTerminalNewResult terminal_new = 10;
    AgentTerminalListResult terminal_list = 11;
    AgentTerminalReadResult terminal_read = 12;
    AgentPortsListResult ports_list = 13;
    AgentWorkspaceLocateResult workspace_locate = 14;
    AgentWorkspaceForgetResult workspace_forget = 15;
  }
}

// server→daemon ProxyOpen 的回应：隧道连接建立结果
message ProxyOpened {
  string conn_id = 1;
  bool ok = 2;
  optional string error = 3;
}

// 隧道连接（daemon 侧到本地端口的 TCP 连接）关闭，控制面消息
message ProxyClosed {
  string conn_id = 1;
}

message DaemonToServer {
  // Removed custom relay/WebRTC transport fields are never reused.
  reserved 29, 33;
  reserved "relay_home", "device_p2p_answer_report";
  // 旧 raw PTY mirror 与 server-routed exec/fs 已由 DeviceEnvelope 取代。
  // 22-23 是控制面复用 relay 路径（plan 043 改为独立 relay + rendezvous 后删除）。
  reserved 1, 12, 13, 14, 15, 16, 19, 22, 23;
  reserved "daemon_enroll", "exec_result", "fs_listed", "fs_read_result", "pty_output", "pty_replay",
    "fs_write_result", "device_relay_frame", "device_relay_close";
  oneof payload {
    DaemonAuth daemon_auth = 2;
    DaemonEnrollRequest daemon_enroll_request = 3;
    DaemonResync daemon_resync = 4;
    ProjectValidated project_validated = 5;
    WorktreeAdded worktree_added = 6;
    SessionStarted session_started = 7;
    SessionExit session_exit = 8;
    PortsUpdate ports_update = 9;
    ProxyOpened proxy_opened = 10;
    ProxyClosed proxy_closed = 11;
    ProxyData proxy_data = 17;
    WorkspaceBranch workspace_branch = 18;
    WorkspaceDiff workspace_diff = 20;
    LocalGrantAck local_grant_ack = 21;
    SessionCheckpoint session_checkpoint = 24;
    DeviceOperationReport device_operation_report = 25;
    LocalGatewayAnnounce local_gateway_announce = 26;
    // sessiond truth 的完整 reconciliation snapshot；server 不得据此关闭 unknown live session。
    DeviceSessionCatalog session_catalog = 27;
    PreparedDeviceOperationInstalled prepared_device_operation_installed = 28;
    WorkspaceDefaultBranch workspace_default_branch = 30;
    SessionAgents session_agents = 31;
    AgentControlRequest agent_control_request = 32;
    ServerAgentResult server_agent_result = 34;
    DeviceTailcatIdentity device_tailcat_identity = 35;
    DeviceTailcatEndpoint device_tailcat_endpoint = 36;
    DeviceTailcatInstalled device_tailcat_installed = 37;
    DeviceTailcatOpened device_tailcat_opened = 38;
  }
}

// ===== 中心发起的终端读/写（plan 091）=====
//
// 与 AgentControlRequest 方向相反：这是中心（MCP 写 tools）问 daemon。一个 request + 一个
// result，各带 oneof payload，新增动作只加分支不占顶层字段号。两者都是无落库副作用的直发
// 消息（读日志/快照、经 sessiond 正门写一段输入），有落库副作用的动作走 prepared + Execute。

// 读某终端的原始输出：优先命令日志尾部（agent/中心建的命令终端才有），否则 sessiond 当前
// 快照；两者都拿不到时 source=none，由中心退回 checkpoint。data 是原始字节（含 ANSI），
// 去转义/尾 N 行在中心做；worker 按 max_bytes 钳制。
message ServerTerminalRead {
  string task_id = 1;
  // 中心已知的当前 session（task 仍在跑时非空）；worker 只据它取快照，不按裸 task 猜。
  string session_id = 2;
  uint32 max_bytes = 3;
}

// 往终端写一段输入：走 worker 的 agent_send_input 正门（attach/holder/input_seq 语义零改动），
// 人类 holder 在场时被拒，错误文案原样回中心。
message ServerTerminalInput {
  string session_id = 1;
  bytes data = 2;
}

message ServerAgentRequest {
  string request_id = 1;
  oneof payload {
    ServerTerminalRead terminal_read = 10;
    ServerTerminalInput terminal_input = 11;
  }
}

message ServerTerminalReadResult {
  bytes data = 1;
  // log | snapshot | none
  string source = 2;
}

message ServerTerminalInputResult {}

message ServerAgentResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
  oneof payload {
    ServerTerminalReadResult terminal_read = 10;
    ServerTerminalInputResult terminal_input = 11;
  }
}

// worker 观测到某 worktree 的 HEAD 分支变化（真相源：设备上的 worktree，DB 只是镜像）
message WorkspaceBranch {
  string workspace_id = 1;
  string branch = 2;
}

// worker 周期计算的某 worktree 累积 git diff 行数统计（真相源：设备上的 worktree，DB 只是镜像）
message WorkspaceDiff {
  string workspace_id = 1;
  int32 additions = 2;
  int32 deletions = 3;
}

// worker 收到工作区清单后核对本地 origin/HEAD，与 server 记录不符时上报纠正（plan 072）。
// 探测不到 origin/HEAD（无 remote / 非 clone 仓库）时不发此消息，server 保持现值。
// 按 workspace 粒度上报，project 归属由 server 反查——WorkspaceRef 里没有 project_id。
message WorkspaceDefaultBranch {
  string workspace_id = 1;
  string default_branch = 2;
}

// ===== Server → Daemon 载荷 =====

message DaemonEnrolled {
  uint32 control_protocol_version = 3;
  string daemon_id = 1;
  string device_token = 2;
}

message DaemonAuthed {
  uint32 control_protocol_version = 2;
  string daemon_id = 1;
}

// loopback gateway 只接受这些精确 Origin；worker 持久化最后一次成功认证下发值，供中心
// 离线时使用。独立消息允许中心在不重做 daemon auth 的前提下轮换 allowlist。
message LocalGatewayConfigure {
  repeated string origins = 1;
}

message DaemonAuthError {
  string message = 1;
  bool need_enroll = 2;
}

// enrollRequest 的回应：一次性授权链接 + 过期时间（ms epoch）。daemon 落盘展示，连接断开即作废
message DaemonAuthorizePending {
  string url = 1;
  double expires_at = 2;
}

message ProjectValidate {
  string request_id = 1;
  string path = 2;
}

message WorktreeAdd {
  string request_id = 1;
  string repo_path = 2;
  string workspace_id = 3;
  string name = 4;
  string branch = 5;
  bool create_new = 6;
}

// fire-and-forget：移除一个 worktree 目录
message WorktreeRemove {
  string repo_path = 1;
  string worktree_path = 2;
}

// 热升级：切到某个 worker 版本。带 url 走"下载+验签"；不带则按版本标签在 supervisor 自有注册表里切换。
// signature 保留为对原始二进制的 legacy 签名，供已部署的旧 supervisor 滚动兼容；
// 新 supervisor 还必须验证 release_signature，其 domain-separated statement 绑定
// version / target / sha256 / artifact_size。
message WorkerUpgrade {
  string version = 1;
  optional string url = 2;
  optional string sha256 = 3;
  optional string signature = 4;
  optional string target = 5;
  optional uint64 artifact_size = 6;
  optional string release_signature = 7;
  TransportArtifact transport = 8;
}

// 设备重命名：server 通知 daemon 更新本地设备名称
message DaemonSetName {
  string name = 1;
}

// 直发建会话（cofluxd terminal new 走这条）。7 起是会话归属 id（plan 092）：中心只下发 id，
// supervisor 在 create_session 里组装成 COFLUX_* 环境变量注入 PTY；变量名与组装只在 supervisor 一处。
// 全部可缺省：旧中心不下发、旧 worker 不映射都只是「会话里没有这些变量」，绝不影响建会话。
message SessionCreate {
  string session_id = 1;
  string task_id = 2;
  string cwd = 3;
  optional string shell = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  string workspace_id = 7;
  // 无仓库的目录工作区为空串
  string project_id = 8;
  string daemon_id = 9;
  // 中心 MCP 地址（<COFLUX_PUBLIC_URL>/mcp），供会话里的 agent 告诉用户怎么接入
  string mcp_url = 10;
}

message SessionClose {
  string session_id = 1;
}

// 打开一条隧道连接：daemon 向本地 port 发起 TCP 连接，字节经 ProxyData 双向透传
message ProxyOpen {
  string conn_id = 1;
  uint32 port = 2;
}

// 关闭一条隧道连接（server 侧发起，例如浏览器断开）
message ProxyClose {
  string conn_id = 1;
}

// 中心触发已安装的 prepared operation 执行（plan 091）。中心作为发起方时没有 browser 去投递
// 帧：worker 取本地已安装的同 operation_id 模板，以合成 channel `__coflux-server-<operation_id>`
// 与 Principal::Server 走与 browser 完全相同的分派；结果沿既有 DeviceOperationReport 回中心。
// 重复 Execute（中心 restore 重发）必须幂等：已执行的只重发上次 report，不得二次执行。
message PreparedDeviceOperationExecute {
  string operation_id = 1;
}

message ServerToDaemon {
  // Removed custom relay/WebRTC transport fields are never reused.
  reserved 33, 34, 36, 37;
  reserved "device_relay_dial", "relay_node_list", "device_p2p_dial", "device_p2p_channel_grant";
  // 旧 replay/input/resize/RPC adapter 已删除；生命周期编排与 proxy control 继续保留。
  // 26-28 是控制面复用 relay 路径（plan 043 改为独立 relay + rendezvous 后删除）。
  reserved 11, 12, 15, 16, 17, 18, 21, 26, 27, 28;
  reserved "session_replay", "pty_resize", "exec_run", "fs_list", "fs_read", "pty_input", "fs_write",
    "device_relay_open", "device_relay_frame", "device_relay_close";
  oneof payload {
    DaemonEnrolled daemon_enrolled = 1;
    DaemonAuthed daemon_authed = 2;
    DaemonAuthError daemon_auth_error = 3;
