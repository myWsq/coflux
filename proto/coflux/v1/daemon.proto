// Daemon ⟷ Server 链路（/daemon WebSocket）。
// wire：每个 WS binary message = 一个 protobuf 编码的信封（DaemonToServer / ServerToDaemon）。
// 旧 JSON 控制面 + 自定义二进制帧已收敛为单一 protobuf binary，protojson 仅用于日志调试。
syntax = "proto3";

package coflux.v1;

import "coflux/v1/common.proto";
import "coflux/v1/device.proto";

// ===== Daemon → Server 载荷 =====

message DaemonAuth {
  string device_token = 1;
  string worker_version = 2;
  string supervisor_version = 3;
  string arch = 4;
}

// 本地无凭证（未登记）时：申请一次性授权链接（Tailscale 式，见 docs/auth-design.md）
message DaemonEnrollRequest {
  string name = 1;
  string host = 2;
  string platform = 3;
  string worker_version = 4;
  string supervisor_version = 5;
  string arch = 6;
}

// 独立于认证消息的 gateway capability announce；保持旧认证构造面完全兼容，worker 可在
// authed 后及 gateway identity 变化时重复上报，server 以 daemon 连接身份绑定该 descriptor。
message LocalGatewayAnnounce {
  LocalGatewayDescriptor gateway = 1;
}

message DaemonResync {
  repeated SessionRef sessions = 1;
}

// 校验路径是否为（非裸）git 仓库的结果
message ProjectValidated {
  string request_id = 1;
  bool ok = 2;
  string repo_path = 3;
  string branch = 4;
  optional string error = 5;
  // worker 从 remote URL 推导出的 namespace/project；不传原始 URL，缺失时 server 回退仓库根目录名
  optional string suggested_name = 6;
}

// git worktree add 结果
message WorktreeAdded {
  string request_id = 1;
  bool ok = 2;
  string path = 3;
  string branch = 4;
  optional string error = 5;
}

message SessionStarted {
  string session_id = 1;
  string task_id = 2;
  int32 pid = 3;
}

message SessionExit {
  string session_id = 1;
  int32 exit_code = 2;
}

// 全量幂等上报每个（存活）会话监听的端口；仅含有监听端口的 session，daemon 重连/漏报自愈
message PortsUpdate {
  repeated SessionPorts sessions = 1;
}

// server→daemon ProxyOpen 的回应：隧道连接建立结果
message ProxyOpened {
  string conn_id = 1;
  bool ok = 2;
  optional string error = 3;
}

// 隧道连接（daemon 侧到本地端口的 TCP 连接）关闭，控制面消息
message ProxyClosed {
  string conn_id = 1;
}

// daemon 探测中心下发的 relay 节点后，上报当前 home；仅存于本次在线连接的 presence，
// 重连后必须重报。relay_id 必须来自最近一次 RelayNodeList。
message RelayHome {
  string relay_id = 1;
}

message DaemonToServer {
  // 旧 raw PTY mirror 与 server-routed exec/fs 已由 DeviceEnvelope 取代。
  // 22-23 是控制面复用 relay 路径（plan 043 改为独立 relay + rendezvous 后删除）。
  reserved 1, 12, 13, 14, 15, 16, 19, 22, 23;
  reserved "daemon_enroll", "exec_result", "fs_listed", "fs_read_result", "pty_output", "pty_replay",
    "fs_write_result", "device_relay_frame", "device_relay_close";
  oneof payload {
    DaemonAuth daemon_auth = 2;
    DaemonEnrollRequest daemon_enroll_request = 3;
    DaemonResync daemon_resync = 4;
    ProjectValidated project_validated = 5;
    WorktreeAdded worktree_added = 6;
    SessionStarted session_started = 7;
    SessionExit session_exit = 8;
    PortsUpdate ports_update = 9;
    ProxyOpened proxy_opened = 10;
    ProxyClosed proxy_closed = 11;
    ProxyData proxy_data = 17;
    WorkspaceBranch workspace_branch = 18;
    WorkspaceDiff workspace_diff = 20;
    LocalGrantAck local_grant_ack = 21;
    SessionCheckpoint session_checkpoint = 24;
    DeviceOperationReport device_operation_report = 25;
    LocalGatewayAnnounce local_gateway_announce = 26;
    // sessiond truth 的完整 reconciliation snapshot；server 不得据此关闭 unknown live session。
    DeviceSessionCatalog session_catalog = 27;
    PreparedDeviceOperationInstalled prepared_device_operation_installed = 28;
    RelayHome relay_home = 29;
    WorkspaceDefaultBranch workspace_default_branch = 30;
  }
}

// worker 观测到某 worktree 的 HEAD 分支变化（真相源：设备上的 worktree，DB 只是镜像）
message WorkspaceBranch {
  string workspace_id = 1;
  string branch = 2;
}

// worker 周期计算的某 worktree 累积 git diff 行数统计（真相源：设备上的 worktree，DB 只是镜像）
message WorkspaceDiff {
  string workspace_id = 1;
  int32 additions = 2;
  int32 deletions = 3;
}

// worker 收到工作区清单后核对本地 origin/HEAD，与 server 记录不符时上报纠正（plan 072）。
// 探测不到 origin/HEAD（无 remote / 非 clone 仓库）时不发此消息，server 保持现值。
// 按 workspace 粒度上报，project 归属由 server 反查——WorkspaceRef 里没有 project_id。
message WorkspaceDefaultBranch {
  string workspace_id = 1;
  string default_branch = 2;
}

// ===== Server → Daemon 载荷 =====

message DaemonEnrolled {
  string daemon_id = 1;
  string device_token = 2;
}

message DaemonAuthed {
  string daemon_id = 1;
}

// loopback gateway 只接受这些精确 Origin；worker 持久化最后一次成功认证下发值，供中心
// 离线时使用。独立消息允许中心在不重做 daemon auth 的前提下轮换 allowlist。
message LocalGatewayConfigure {
  repeated string origins = 1;
}

message DaemonAuthError {
  string message = 1;
  bool need_enroll = 2;
}

// enrollRequest 的回应：一次性授权链接 + 过期时间（ms epoch）。daemon 落盘展示，连接断开即作废
message DaemonAuthorizePending {
  string url = 1;
  double expires_at = 2;
}

message ProjectValidate {
  string request_id = 1;
  string path = 2;
}

message WorktreeAdd {
  string request_id = 1;
  string repo_path = 2;
  string workspace_id = 3;
  string name = 4;
  string branch = 5;
  bool create_new = 6;
}

// fire-and-forget：移除一个 worktree 目录
message WorktreeRemove {
  string repo_path = 1;
  string worktree_path = 2;
}

// 热升级：切到某个 worker 版本。带 url 走"下载+验签"；不带则按版本标签在 supervisor 自有注册表里切换
message WorkerUpgrade {
  string version = 1;
  optional string url = 2;
  optional string sha256 = 3;
  optional string signature = 4;
}

// 设备重命名：server 通知 daemon 更新本地设备名称
message DaemonSetName {
  string name = 1;
}

message SessionCreate {
  string session_id = 1;
  string task_id = 2;
  string cwd = 3;
  optional string shell = 4;
  uint32 cols = 5;
  uint32 rows = 6;
}

message SessionClose {
  string session_id = 1;
}

// 打开一条隧道连接：daemon 向本地 port 发起 TCP 连接，字节经 ProxyData 双向透传
message ProxyOpen {
  string conn_id = 1;
  uint32 port = 2;
}

// 关闭一条隧道连接（server 侧发起，例如浏览器断开）
message ProxyClose {
  string conn_id = 1;
}

// 中心静态配置的 relay 节点清单；认证完成后下发一次，首项兼作 daemon 尚未上报 home
// 时的 rendezvous 回退节点。url 是 ws/wss 对外基址，不含 /v1/pipe。
message RelayNodeList {
  message RelayNode {
    string id = 1;
    string url = 2;
  }
  repeated RelayNode nodes = 1;
}

message ServerToDaemon {
  // 旧 replay/input/resize/RPC adapter 已删除；生命周期编排与 proxy control 继续保留。
  // 26-28 是控制面复用 relay 路径（plan 043 改为独立 relay + rendezvous 后删除）。
  reserved 11, 12, 15, 16, 17, 18, 21, 26, 27, 28;
  reserved "session_replay", "pty_resize", "exec_run", "fs_list", "fs_read", "pty_input", "fs_write",
    "device_relay_open", "device_relay_frame", "device_relay_close";
  oneof payload {
    DaemonEnrolled daemon_enrolled = 1;
    DaemonAuthed daemon_authed = 2;
    DaemonAuthError daemon_auth_error = 3;
    DaemonAuthorizePending daemon_authorize_pending = 4;
    ProjectValidate project_validate = 5;
    WorktreeAdd worktree_add = 6;
    WorktreeRemove worktree_remove = 7;
    WorkerUpgrade worker_upgrade = 8;
    SessionCreate session_create = 9;
    SessionClose session_close = 10;
    ProxyOpen proxy_open = 13;
    ProxyClose proxy_close = 14;
    DaemonSetName daemon_set_name = 22;
    LocalGrantInstall local_grant_install = 23;
    LocalGrantRevoke local_grant_revoke = 24;
    LocalLeaseInstall local_lease_install = 25;
    LocalGatewayConfigure local_gateway_configure = 29;
    DeviceSessionCatalogRequest session_catalog_request = 30;
    DeviceExitAck exit_ack = 31;
    PreparedDeviceOperation prepared_device_operation = 32;
    DeviceRelayDial device_relay_dial = 33;
    RelayNodeList relay_node_list = 34;
    ProxyData proxy_data = 19;
    WorkspaceList workspace_list = 20;
  }
}

// 本设备的工作区清单（连接时 + 工作区增删时全量下发），worker 据此监视各 worktree 的 HEAD
// 分支与 diff 统计；default_branch 是所属 project 的默认分支，diff 统计基准
// merge-base(default_branch, HEAD) 依赖它。这里下发的是 server 侧**缓存**——真相是 daemon
// 本地的 origin/HEAD，worker 收到后核对，不符则经 WorkspaceDefaultBranch 上报纠正（plan 072）。
message WorkspaceRef {
  string workspace_id = 1;
  string path = 2;
  string default_branch = 3;
}

message WorkspaceList {
  repeated WorkspaceRef workspaces = 1;
}
