// Client ⟷ Server 链路（/client WebSocket）。
// wire：每个 WS binary message = 一个 protobuf 编码的信封（ClientToServer / ServerToClient）。
syntax = "proto3";

package coflux.v1;

import "coflux/v1/common.proto";
import "coflux/v1/device.proto";

// ===== Client → Server 载荷 =====

// 登录：用户名+密码（local/password 模式首次）/ 会话 client_token（重连，两模式通用）。
// supabase_token 仅为旧 wire 兼容保留，当前 server 不再接受；认证成功会在 AuthOk 回带由
// coflux 自持的会话 token，之后重连只使用该 token。
message ClientAuth {
  optional string username = 1;
  optional string password = 2;
  optional string client_token = 3;
  optional string supabase_token = 4;
  // 构建版本（git short SHA；vite dev 固定 "dev"）：server 配了 COFLUX_BUILD_ID 时用于
  // 认证阶段的版本准入（plan 033）。缺失本字段是"旧 bundle"的检测信号本身，不可伪造更早语义。
  optional string client_version = 5;
  // 客户端类型（plan 105）："web" / "mobile" / "desktop"。缺失按 web 处理（旧客户端与 iOS）。只有 "desktop"
  // 走协议版本准入：打包分发的客户端有发布时差，不能像浏览器那样靠 reload 立刻拿到新 bundle。
  optional string client_kind = 6;
  // 控制面协议版本（plan 105，常量 CONTROL_PROTOCOL_VERSION）：desktop 低于 server 支持的最低版本才被拒；
  // 平时部署 server 不再踢旧桌面版，它们由 electron-updater 在后台升级。
  optional uint32 control_protocol_version = 7;
}

// 登出：撤销本连接使用的会话 token（服务器侧失效，非仅清本地）
message ClientLogout {}

message ClientSubscribe {}

message ClientRemoveDevice {
  string daemon_id = 1;
}

// 查看某授权链接对应的待授权设备信息（不消费 token，供确认页展示 name/host/platform）
message DeviceAuthorizeInfoRequest {
  string token = 1;
}

// 确认授权：把该 token 对应的设备绑到当前登录账号（一次性，成功后 token 失效）
message DeviceAuthorize {
  string token = 1;
}

// 为端口转发签发一次性代理认证（浏览器经 <shortId>.<proxyHost> 访问前换票）。
// redirect 是换票成功后要跳回的地址；url 白名单校验在 hub（不属于协议层）
message ProxyIssueAuth {
  string redirect = 1;
}

// 触发某设备的 worker 热升级到指定版本（管理操作；账号内校验归属）。带 url 走下载+验签。
// signature 保留为对原始二进制的 legacy 签名，供已部署的旧 supervisor 滚动兼容；
// 新 supervisor 还必须验证 release_signature，其 domain-separated statement 绑定
// version / target / sha256 / artifact_size。
message ClientUpgradeDaemon {
  string daemon_id = 1;
  string version = 2;
  optional string url = 3;
  optional string sha256 = 4;
  optional string signature = 5;
  optional string target = 6;
  optional uint64 artifact_size = 7;
  optional string release_signature = 8;
  TransportArtifact transport = 9;
}

// 导入一个 git 仓库为 project（自动创建主工作区）
message ProjectImport {
  string daemon_id = 1;
  string path = 2;
  optional string name = 3;
}

message ProjectRemove {
  string project_id = 1;
}

// 重命名项目（展示别名；空则服务端拒绝，同 DeviceSetName 语义）
message ProjectSetName {
  string project_id = 1;
  string name = 2;
}

// 在 project 下用 git worktree 新建工作区
message WorkspaceCreate {
  string project_id = 1;
  string name = 2;
  string branch = 3;
  bool create_new = 4;
}

message WorkspaceRemove {
  string workspace_id = 1;
}

// 重命名工作区（name 是自由文本；空则服务端回落为分支名）
message WorkspaceSetName {
  string workspace_id = 1;
  string name = 2;
}

// 重命名设备（别名；空则服务端拒绝）
message DeviceSetName {
  string daemon_id = 1;
  string name = 2;
}

message TaskCreate {
  string workspace_id = 1;
  string title = 2;
}

// 在设备上新建无 repo 的目录工作区（projectId 为空即目录工作区）+ 一个任务。
// path 是 web 经 DeviceFsList{browse_home:true} 从 daemon 拿到的 HOME 绝对路径。
message TerminalCreate {
  string daemon_id = 1;
  string path = 2;
}

message TaskStart {
  string task_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TaskRemove {
  string task_id = 1;
}

// 读取一个任务（终端）的最后输出（plan 097）：web 激活已退出的 Tab 时回放用。server 复用
// agent read 的两层来源（daemon 当前快照 → 中心 checkpoint），结果只回给发起连接。
// max_bytes 为 0 取服务端默认；超过上限被钳制。
message TaskRead {
  string task_id = 1;
  uint32 max_bytes = 2;
}

// 查询待确认的 OAuth 授权请求（plan 090：MCP 宿主经 /oauth/authorize 发起、302 落到 web 确认页）。
// 不消费请求，供确认页展示客户端名与回调 host；request_id 由 302 的 query 带来。
message OAuthAuthorizeInfoRequest {
  string request_id = 1;
}

// 确认或拒绝 OAuth 授权请求（一次性：无论确认还是拒绝，请求随即从内存摘除）。
// approve=true 时 server 以当前登录账号签发授权码；false 时回调带 error=access_denied。
message OAuthAuthorizeDecide {
  string request_id = 1;
  bool approve = 2;
}

message ClientToServer {
  // Removed custom relay/WebRTC transport fields are never reused.
  reserved 33, 35, 36;
  reserved "device_relay_connect", "device_p2p_offer", "device_p2p_channel_open";
  // 旧 terminal/RPC adapter 已由端到端 DeviceEnvelope 取代；编号与字段名永久保留，
  // 防止旧 bundle 的 raw PTY/RPC 被未来字段误解。29-31 是控制面复用 relay 路径（plan 043
  // 改为独立 relay + rendezvous 后删除）。
  reserved 4, 16, 17, 19, 20, 21, 22, 23, 25, 29, 30, 31;
  reserved "client_create_enrollment_key", "task_attach", "task_stop", "pty_resize", "client_exec",
    "client_fs_list", "client_fs_read", "pty_input", "client_fs_write", "device_relay_open",
    "device_relay_frame", "device_relay_close";
  oneof payload {
    ClientAuth client_auth = 1;
    ClientLogout client_logout = 2;
    ClientSubscribe client_subscribe = 3;
    ClientRemoveDevice client_remove_device = 5;
    DeviceAuthorizeInfoRequest device_authorize_info = 6;
    DeviceAuthorize device_authorize = 7;
    ProxyIssueAuth proxy_issue_auth = 8;
    ClientUpgradeDaemon client_upgrade_daemon = 9;
    ProjectImport project_import = 10;
    ProjectRemove project_remove = 11;
    WorkspaceCreate workspace_create = 12;
    WorkspaceRemove workspace_remove = 13;
    TaskCreate task_create = 14;
    TaskStart task_start = 15;
    TaskRemove task_remove = 18;
    DeviceSetName device_set_name = 26;
    LocalPairRequest local_pair_request = 27;
    LocalLeaseRequest local_lease_request = 28;
    LocalUnpairRequest local_unpair_request = 32;
    TerminalCreate terminal_create = 34;
    WorkspaceSetName workspace_set_name = 24;
    ProjectSetName project_set_name = 37;
    OAuthAuthorizeInfoRequest oauth_authorize_info = 38;
    OAuthAuthorizeDecide oauth_authorize_decide = 39;
    TaskRead task_read = 40;
    NotificationList notification_list = 41;
    NotificationRead notification_read = 42;
    DeviceTailcatConnect device_tailcat_connect = 43;
    DeviceTailcatClose device_tailcat_close = 44;
    DeviceTailcatControl device_tailcat_control = 45;
    DeviceTailcatFailed device_tailcat_failed = 46;
  }
}

// ===== Server → Client 载荷 =====

message AuthOk {
  reserved 3;
  reserved "ice_servers";
  uint32 control_protocol_version = 6;
  string account_id = 1;
  optional string client_token = 2;
  // 本连接的「登录身份显示串」（plan 110）：password 模式 = 该会话 token 绑定用户的 email，
  // local 模式 = COFLUX_USERNAME。客户端拿它显示「我是谁」（桌面版侧栏脚部），不得当主键用。
  // optional 是为了把「旧 server 不回」与「回了空串」分开：查不到用户（user_id 为 NULL 的旧
  // token、用户已删）就不设本字段，认证照常成功——身份查询永远不是拒绝理由。
  optional string login_name = 4;
  bool notification_inbox = 5;
}

message AuthError {
  string message = 1;
}

// DeviceAuthorizeInfoRequest 的回应：ok 时带设备信息，否则 error 说明原因（无效/已用/已过期）
message DeviceAuthorizeInfoResult {
  bool ok = 1;
  optional string name = 2;
  optional string host = 3;
  optional string platform = 4;
  optional string error = 5;
}

// 设备授权成功（该连接的 daemon 已收到 DaemonEnrolled 并上线）
message DeviceAuthorized {}

// ProxyIssueAuth 的回应：ok 时带跳转 url（换票成功，浏览器可直接访问 <shortId>.<proxyHost>）
message ProxyAuth {
  bool ok = 1;
  optional string url = 2;
  optional string error = 3;
}

// 某任务当前可访问的端口列表变化（daemon PortsUpdate 上报后重新计算得出）
message PortsUpdated {
  string task_id = 1;
  repeated PortPreview ports = 2;
}

// 某设备当前的 agent presence 全量（plan 073）：daemon SessionAgents 上报或断开清空后广播，
// 订阅时按设备补发。sessions 为该设备当前全量，空 = 全部清空。内存派生事实，不落库。
message SessionAgentsUpdated {
  string daemon_id = 1;
  repeated SessionAgentRef sessions = 2;
}

message StateSnapshot {
  repeated DaemonInfo daemons = 1;
  repeated Project projects = 2;
  repeated Workspace workspaces = 3;
  repeated Task tasks = 4;
  repeated TaskPorts ports = 5;
}

message DaemonUpdated {
  DaemonInfo daemon = 1;
}

message DaemonRemoved {
  string daemon_id = 1;
}

message ProjectCreated {
  Project project = 1;
}

message ProjectRemoved {
  string project_id = 1;
}

message WorkspaceCreated {
  Workspace workspace = 1;
}

message WorkspaceRemoved {
  string workspace_id = 1;
}

message TaskUpdated {
  Task task = 1;
}

message TaskRemoved {
  string task_id = 1;
}

message ServerError {
  string message = 1;
}

// build 版本失配（新客户端跑旧代码判定的对称面，plan 033）：认证阶段 server 比对
// web/mobile：client_version 与 COFLUX_BUILD_ID 不一致时下发本消息后关闭连接；desktop（plan 105）：
// control_protocol_version 低于 server 支持的最低版本时下发。旧 bundle（缺失 client_version）走 AuthError
// 而非本消息——本消息对它是无法理解的未知 case（见 apps/server/src/hub.ts handleClientAuth）。
message ClientOutdated {}

// OAuthAuthorizeInfoRequest 的回应：ok 时带客户端名与回调 host（供确认页展示），否则 error 说明原因
// （无效/已用/已过期，不区分——同 DeviceAuthorizeInfoResult 的不泄漏原则）。
message OAuthAuthorizeInfoResult {
  bool ok = 1;
  optional string client_name = 2;
  optional string redirect_host = 3;
  optional string scope = 4;
  optional string error = 5;
}

// OAuthAuthorizeDecide 的回应：ok 时带完整的回调 URL（含 code 与原 state，或 error=access_denied），
// 确认页直接 location.assign 跳回宿主；请求无效/过期时 ok=false 带 error。
message OAuthAuthorizeResult {
  bool ok = 1;
  optional string redirect_url = 2;
  optional string error = 3;
}

// TaskRead 的回应：data 按 source 解释——snapshot / checkpoint 是规范化 ANSI 屏幕（分别来自 daemon
// 当前画面与中心缓存）；none 表示没有任何可回放内容（data 为空）。
// status / exit_code 取自回应时刻的 Task 真相；error 非空时其余字段无意义（任务不存在或不属于本账号）。
message TaskReadResult {
  string task_id = 1;
  bytes data = 2;
  string source = 3;
  double captured_at = 4;
  TaskStatus status = 5;
  optional int32 exit_code = 6;
  optional string error = 7;
}

message ServerToClient {
  // Removed custom relay/WebRTC transport fields are never reused.
  reserved 33, 35, 36;
  reserved "device_relay_grant", "device_p2p_answer", "device_p2p_channel_result";
  // holder/output/RPC 结果全部封装在 opaque Device relay 内；server 不再理解这些数据。
  // 27-29 是控制面复用 relay 路径（plan 043 改为独立 relay + rendezvous 后删除）。
  reserved 3, 17, 18, 19, 20, 22, 23, 27, 28, 29;
  reserved "enrollment_key_created", "task_detached", "exec_result", "fs_listed", "fs_read_result",
    "pty_output", "fs_write_result", "device_relay_status", "device_relay_frame", "device_relay_close";
  oneof payload {
    AuthOk auth_ok = 1;
    AuthError auth_error = 2;
    DeviceAuthorizeInfoResult device_authorize_info = 4;
    DeviceAuthorized device_authorized = 5;
    ProxyAuth proxy_auth = 6;
    PortsUpdated ports_updated = 7;
    StateSnapshot state_snapshot = 8;
    DaemonUpdated daemon_updated = 9;
    DaemonRemoved daemon_removed = 10;
    ProjectCreated project_created = 11;
    ProjectRemoved project_removed = 12;
    WorkspaceCreated workspace_created = 13;
    WorkspaceRemoved workspace_removed = 14;
    TaskUpdated task_updated = 15;
    TaskRemoved task_removed = 16;
    ServerError error = 21;
    ClientOutdated client_outdated = 24;
    LocalPairResult local_pair_result = 25;
    LocalLeaseResult local_lease_result = 26;
    PreparedDeviceOperation prepared_device_operation = 30;
    SessionCheckpoint session_checkpoint = 31;
    LocalUnpairResult local_unpair_result = 32;
    SessionAgentsUpdated session_agents_updated = 34;
    OAuthAuthorizeInfoResult oauth_authorize_info = 37;
    OAuthAuthorizeResult oauth_authorize_result = 38;
    TaskReadResult task_read_result = 39;
    NotificationPage notification_page = 40;
    NotificationChanged notification_changed = 41;
    DeviceTailcatResult device_tailcat_result = 42;
    DeviceTailcatClosed device_tailcat_closed = 43;
  }
}

// Bounded newest-first history. Zero before_sequence requests the first page.
message NotificationList { string request_id = 1; double before_sequence = 2; }
// Empty id marks all entries through the supplied sequence read, including unloaded pages.
message NotificationRead { string request_id = 1; string id = 2; double through_sequence = 3; }
message NotificationPage {
  string request_id = 1;
  repeated AccountNotification notifications = 2;
  double next_before_sequence = 3;
  uint32 unread_count = 4;
  double revision = 5;
  double latest_sequence = 6;
  string error = 7;
}
message NotificationChanged {
  optional AccountNotification notification = 1;
  double read_through_sequence = 2;
  double read_at = 3;
  uint32 unread_count = 4;
  double revision = 5;
  double latest_sequence = 6;
  bool created = 7;
  string request_id = 8;
  string error = 9;
}
