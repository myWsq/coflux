name: Coflux

options:
  bundleIdPrefix: dev.coflux
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 151.0.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES

targets:
  Coflux:
    type: application
    platform: macOS
    sources:
      - path: Coflux
    dependencies:
      - package: SwiftTerm
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coflux.macos
        PRODUCT_NAME: Coflux
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coflux
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Coflux 需要连接你授权的本地设备与局域网设备。
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

  CofluxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CofluxTests
      - path: ../../proto/gen/swift
        group: Generated/Protocol
    dependencies:
      - target: Coflux
      - package: SwiftProtobuf
      - package: SwiftTerm
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coflux.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Coflux.app/Contents/MacOS/Coflux"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CofluxLocalNetworkAllowProbe:
    type: application
    platform: macOS
    sources:
      - path: CofluxLocalNetworkProbe
        excludes:
          - Info.plist
    dependencies:
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coflux.macos.tcc.allow.template
        PRODUCT_NAME: CofluxTCCAllowProbe
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CofluxLocalNetworkProbe/Info.plist
        COFLUX_TCC_DISPLAY_NAME: Coflux Local Network Allow Probe
        COFLUX_TCC_EXPECTED_DECISION: allow
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COFLUX_TCC_ALLOW_PROBE"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO

  CofluxLocalNetworkDenyProbe:
    type: application
    platform: macOS
    sources:
      - path: CofluxLocalNetworkProbe
        excludes:
          - Info.plist
    dependencies:
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coflux.macos.tcc.deny.template
        PRODUCT_NAME: CofluxTCCDenyProbe
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CofluxLocalNetworkProbe/Info.plist
        COFLUX_TCC_DISPLAY_NAME: Coflux Local Network Deny Probe
        COFLUX_TCC_EXPECTED_DECISION: deny
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COFLUX_TCC_DENY_PROBE"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO

schemes:
  Coflux:
    build:
      targets:
        Coflux: all
        CofluxTests: [test]
    test:
      gatherCoverageData: false
      environmentVariables:
        COFLUX_WEBRTC_CONFIG_BASE64: "$(COFLUX_WEBRTC_CONFIG_BASE64)"
        COFLUX_LOOPBACK_CONFIG_BASE64: "$(COFLUX_LOOPBACK_CONFIG_BASE64)"
      targets:
        - CofluxTests
  CofluxLocalNetworkAllowProbe:
    build:
      targets:
        CofluxLocalNetworkAllowProbe: all
    run:
      config: Debug
  CofluxLocalNetworkDenyProbe:
    build:
      targets:
        CofluxLocalNetworkDenyProbe: all
    run:
      config: Debug
