name: Coflux

options:
  bundleIdPrefix: dev.coflux
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 151.0.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES

targets:
  Coflux:
    type: application
    platform: macOS
    sources:
      - path: Coflux
    dependencies:
      - package: SwiftTerm
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coflux.macos
        PRODUCT_NAME: Coflux
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coflux
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

  CofluxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CofluxTests
      - path: ../../proto/gen/swift
        group: Generated/Protocol
    dependencies:
      - package: SwiftProtobuf
      - package: SwiftTerm
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.coflux.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Coflux:
    build:
      targets:
        Coflux: all
        CofluxTests: [test]
    test:
      gatherCoverageData: false
      environmentVariables:
        COFLUX_WEBRTC_CONFIG_PATH: "$(COFLUX_WEBRTC_CONFIG_PATH)"
      targets:
        - CofluxTests
