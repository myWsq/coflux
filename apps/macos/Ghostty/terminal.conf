# 工作台终端配置：不读取用户 Ghostty 配置，不启动本地 shell。
font-family = Menlo
font-size = 12
background = 0a0a0a
foreground = e4e4e4
cursor-color = e4e4e4
cursor-style = bar
cursor-style-blink = true
selection-background = 242424
selection-foreground = cell-foreground
adjust-cell-height = 25%
window-padding-x = 0
window-padding-y = 0
window-padding-balance = false
macos-option-as-alt = false
clipboard-read = deny
clipboard-write = allow
keybind = clear
palette = 0=#1a1a1a
palette = 1=#e05c6a
palette = 2=#4fae6e
palette = 3=#c9a227
palette = 4=#6b9bd1
palette = 5=#b07cc6
palette = 6=#56b6c2
palette = 7=#d4d4d4
palette = 8=#6a6a6a
palette = 9=#ef2929
palette = 10=#8ae234
palette = 11=#fce94f
palette = 12=#729fcf
palette = 13=#ad7fa8
palette = 14=#34e2e2
palette = 15=#eeeeec
scrollback-limit-lines = 10000
