# electron-builder 26.x（锁 26：27 会改 mac.universal / mac.sign 的配置结构，升级时迁配置）。
# 正式发版由 .github/workflows/desktop-release.yml 驱动：签名身份来自 CSC_LINK/CSC_KEY_PASSWORD，
# 公证凭据来自 APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER/APPLE_TEAM_ID，updater 源 URL 经
# --config.publish.url 在打包时写入 app-update.yml。本机 `pnpm pack`/`pnpm dist` 用同一份配置。
appId: dev.coflux.desktop
# 与 package.json 的 productName 保持一致：运行时 app.name / userData 目录（~/Library/Application Support/Coflux）
# 取的是 package.json 那份（缺失会退到 name "@coflux/desktop"），这里只决定 .app 文件名。
productName: Coflux
copyright: Copyright © 2026 Shuaiqi Wang
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true

# Fuses（plan 103 安全基线）：在签名前翻转，Gatekeeper 保证之后翻不回去。
# 关 RunAsNode 后 child_process.fork 失效（后台任务用 utilityProcess）；开 asar 完整性校验后
# 任何打包后改 asar 的步骤都会启动即崩——签名/公证顺序见 workflow。
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # 未签名本机构建（pnpm pack）翻 fuse 后重置 ad-hoc 签名，否则 arm64 上启动即被杀；签名构建无影响
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.developer-tools
  # 图标 = build/AppIcon.icon（Icon Composer 文档）经 scripts/export-icon.mjs 用 actool 编出的 Assets.car：
  # 分层、Liquid Glass 实时渲染（Clear/Tinted 外观也对），靠 extraResources 进 Resources、extendInfo 写
  # CFBundleIconName 指向它。AppIcon.icns 是 actool 顺带产出的扁平版，只因为 electron-builder 必须有一个
  # mac.icon 文件才保留，macOS 26 不会用它。不用带透明边距的 PNG：系统会把非满幅旧式图标放到白色底板上。
  icon: build/AppIcon.icns
  extendInfo:
    CFBundleIconName: AppIcon
  extraResources:
    - from: build/Assets.car
      to: Assets.car
    # 内置 daemon 三件 + VERSION（plan 113）：由 scripts/stage-daemon.mjs 从显式输入目录落到 build/daemon/，
    # 进 Contents/Resources/daemon/（不进 asar——asar 完整性校验开着，二进制只能走 extraResources）。
    # 目录名与 src/main/daemon-paths.ts 的 DAEMON_RESOURCE_DIR 同值。
    # 同一条 extraResources 还顺带带上 build/daemon/claude-plugin/（plan 115：stage 脚本从仓库
    # integrations/claude-plugin 整目录拷来），落成 Contents/Resources/daemon/claude-plugin——
    # coflux 终端里的 claude 经主应用注入的 COFLUX_CLAUDE_PLUGIN_DIR 自动加载的就是它，不需要新的 from/to。
    - from: build/daemon
      to: daemon
  # 内置三件是 Resources 下的裸可执行文件，@electron/osx-sign 默认不会扫到：显式列出让它们也拿到
  # Developer ID + hardened runtime 签名并进公证。相对路径按 .app 根解析（electron-builder 26 的
  # MacTargetHelper.buildSignOptions）。主进程复制到稳定运行目录后保留原签名，见 daemon-manager.ts。
  binaries:
    - Contents/Resources/daemon/coflux-supervisor
    - Contents/Resources/daemon/coflux-transport
    - Contents/Resources/daemon/coflux-worker
    - Contents/Resources/daemon/coflux
  # arm64 首发；universal 只作为开关保留：需要时把 arch 改成 [universal]（见 Maintenance notes）
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 走 @electron/notarize（notarytool），凭据只从环境变量读，见 workflow；本机没有凭据时自动跳过
  notarize: true
  darkModeSupport: true
  # 只支持 macOS 26+（用户 2026-09-11 定：不做任何向下兼容，按最干净的状态来）；Electron 44 自身要求 13+，这里主动抬高。
  minimumSystemVersion: "26.0"
  artifactName: coflux-${version}-${arch}.${ext}

dmg:
  # dmg 不签名（公证对象是 app，dmg 只是容器）；latest-mac.yml 只登记 zip（macOS 更新走 zip）
  sign: false
  writeUpdateInfo: false

# updater 源：仓库 desktop-updates 分支上的 latest-mac.yml（generic provider 读 <url>/latest-mac.yml），由
# desktop-release.yml 在 GitHub Release 上传安装包后把清单改写成绝对下载地址推上去；安装包本身在 GitHub Release。
# 不用 electron-updater 的 github provider：它看仓库 releases/latest，而 daemon 的 v* 与桌面的 desktop-v* 混在一个仓库里。
publish:
  provider: generic
  url: https://raw.githubusercontent.com/myWsq/coflux/desktop-updates
  channel: latest
