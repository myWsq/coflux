<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111214" />
    <meta name="color-scheme" content="dark" />
    <title>coflux · workspace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="coflux" />
  </head>
  <body style="margin: 0; background: #111214">
    <!-- 冷启动遮罩（plan 078）：HTML 到达即见，盖住 bundle 下载 → React 挂载 → 首快照之间的
         所有中间态。裸 HTML + 内联 CSS 是对 Astryx 约定的有意例外——此刻 React 与 CSS bundle
         都尚未就位，设计系统尚不存在。底色必须与上面 theme-color 的 #111214 一致，否则冷启动
         先白闪一下再变深色。撤除判据与兜底出口见 src/boot-overlay.ts 的调用点。 -->
    <div
      id="coflux-boot-overlay"
      style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #111214; transition: opacity 200ms ease"
    >
      <img src="/favicon.svg" alt="" width="72" height="72" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
