<style>
/* Each option: notes, then the Duo outer display (466 × 678 pt) and the inner display open tall (669 × 951 pt) at true scale, zoomed to fit. Single dark look, matching the app. */
:root {
  --canvas: #0c0c0b; --ink: #e6e6e3; --muted: #8a8a82; --line: #262624; --warn: #c9a227;
  --term: #0a0a0a; --phone: #0f0f0f; --card: #1b1b1a; --raise: #262624; --input: #2a2a28;
  --fg: #e6e6e3; --fg2: #75756d; --ok: #4fae6e; --bad: #e05c6a; --info: #6b9bd1;
  --ui: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--canvas); color: var(--ink); font-family: var(--ui); }
.page { max-width: 1260px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 56px; }
header { display: grid; gap: 10px; max-width: 74ch; }
header h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.spec { font-family: var(--mono); font-size: 12px; color: var(--warn); letter-spacing: .04em; }
.opt { display: grid; gap: 18px; }
.count-pick { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.count-pick button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; cursor: pointer; }
.count-pick button.on { background: var(--ink); color: var(--term); border-color: var(--ink); font-weight: 600; }
.notes { display: grid; gap: 10px; max-width: 80ch; }
.notes h2 { margin: 0; font-size: 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.notes h2 .rec { font-size: 12px; font-weight: 600; color: var(--term); background: var(--warn); padding: 2px 8px; border-radius: 99px; }
.notes p { margin: 0; font-size: 14.5px; line-height: 1.65; color: #c8c8c2; }
.pair { display: grid; grid-template-columns: minmax(0, 484fr) minmax(0, 687fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.fit { min-width: 0; display: grid; gap: 8px; justify-items: start; }
.cap { font-size: 12.5px; color: var(--muted); font-family: var(--mono); letter-spacing: .03em; }

.dev { position: relative; overflow: hidden; background: var(--term); color: var(--fg); font-family: var(--ui); font-size: 15px; margin: 9px;
  box-shadow: 0 0 0 7px #050505, 0 0 0 8.5px #33332f, 0 30px 60px -24px rgba(0,0,0,.8); }
svg.i { width: 20px; height: 20px; stroke: #e6e6e3; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- outer display, closed: content column + system rail ---------- */
.outer { width: 466px; height: 678px; border-radius: 20px 56px 56px 20px; background: var(--phone); }
.outer .col { position: absolute; left: 0; top: 0; bottom: 0; width: 394px; background: var(--term); display: flex; flex-direction: column; overflow: hidden; }
.outer .slot { flex: none; height: 40px; display: flex; align-items: center; padding: 0 10px; position: relative; z-index: 3; }
.rail { position: absolute; right: 0; top: 0; bottom: 0; width: 72px; }
.rail .time { position: absolute; top: 76px; width: 72px; text-align: center; font-weight: 700; font-size: 17px; }
.rail .ring { position: absolute; top: 104px; left: 17px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
.rail .btn, .rail .grp { position: absolute; left: 13px; width: 46px; background: #222220; border: 1px solid #2e2e2b; display: grid; justify-items: center; align-content: space-evenly; }
.rail .btn { top: 168px; height: 46px; border-radius: 50%; }
.rail .grp.a { top: 226px; height: 98px; border-radius: 23px; }
.rail .grp.b { bottom: 24px; height: 98px; border-radius: 23px; }

/* ---------- inner display, open tall: system top bar ---------- */
.inner { width: 669px; height: 951px; border-radius: 34px; display: flex; flex-direction: column; }
.nav { flex: none; height: 48px; margin-top: 24px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px; position: relative; z-index: 3; }
.glass { background: rgba(48,48,45,.72); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.35); }
.circ { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.caps { height: 48px; border-radius: 24px; display: flex; align-items: center; padding: 0 8px; flex: none; }
.caps span { width: 50px; display: grid; place-items: center; }
.status { flex: none; width: 104px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-weight: 600; }
.status .ring { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
.inner .slot { flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; position: relative; }

.termwrap { position: relative; flex: 1; min-height: 0; }
.term { position: absolute; inset: 0; padding: 6px 12px 0 14px; font-family: var(--mono); font-size: 12.5px; line-height: 15.7px; white-space: pre; color: #e4e4e4; overflow: hidden; }
.term .d { color: #6b6b66; } .term .g { color: #4fae6e; } .term .c { color: #e8916c; } .term .b { color: #6f9be0; } .term .y { color: #c9a227; } .term .p { color: #c678dd; } .term .box { color: #4a4a46; }
.dock { flex: none; padding: 8px 4px 25px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 40px 40px; gap: 7px; }
.inner .dock { padding-bottom: 43px; }
.k { border-radius: 13px; background: var(--input); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 14px; font-weight: 600; }
.k.wide { grid-column: span 2; } .k.ent { grid-row: span 2; background: #ececea; color: #0f0f0f; } .k.red { color: var(--bad); }

/* ---------- glyphs ---------- */
.clawd { display: inline-flex; width: 18px; height: 18px; flex: none; overflow: visible; }
.clawd svg { width: 100%; height: 100%; display: block; overflow: visible; }
.gl { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
.gl .dot { width: 7px; height: 7px; border-radius: 50%; }
.gl.codex { font-family: var(--mono); font-weight: 700; font-size: 11px; }
.big .clawd, .big .gl { width: 24px; height: 24px; } .big .gl.codex { font-size: 14px; }
.s-work { background: var(--ok); } .s-wait { background: var(--warn); } .s-done { background: var(--info); } .s-idle { background: var(--fg2); }

/* tiles shared by A and C */
.tile { height: 30px; min-width: 30px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); cursor: pointer; position: relative; flex: none; font-size: 13px; }
.big .tile { height: 48px; min-width: 48px; border-radius: 16px; font-size: 16px; }
.badge { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--term); }
.nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* ---------- A · elastic name tile ---------- */
.A .tray { display: flex; gap: 6px; align-items: center; width: 100%; min-width: 0; }
.A .tile .nm { display: none; }
.A .tile.on { flex: 0 1 auto; min-width: 0; padding: 0 12px 0 8px; background: var(--raise); border-color: #34342f; font-weight: 600; justify-content: flex-start; }
.big.A .tile.on { padding: 0 16px 0 12px; }
.A .tile.on .nm { display: block; }
.A .tile.on .badge { display: none; }

/* ---------- C · name on the left, avatars that never move on the right ---------- */
.C .tray { display: flex; gap: 10px; align-items: center; width: 100%; min-width: 0; }
.C .cur { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; padding-left: 4px; }
.big.C .cur { font-size: 16px; }
.C .cur .ctx { font-weight: 400; color: var(--fg2); font-size: 12px; display: block; }
.C .cur .txt { min-width: 0; display: grid; line-height: 1.25; }
.C .group { flex: none; display: flex; gap: 5px; }
.C .tile { width: 30px; }
.big.C .tile { width: 40px; height: 40px; min-width: 40px; border-radius: 13px; }
.C .tile.on { background: var(--raise); border-color: var(--fg); }
.C .tile.on .badge { display: none; }

/* ---------- B · current name + the system menu ---------- */
/* B: the label reads as a title with a menu (SwiftUI .toolbarTitleMenu / Menu): text, then a chevron. */
.B .cur { max-width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-weight: 600; font-size: 15px; cursor: pointer; min-width: 0; border-radius: 10px; }
.big.B .cur { font-size: 17px; gap: 9px; }
.B .chev { flex: none; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; position: relative; }
.big.B .chev { width: 22px; height: 22px; }
.B .chev svg.i { width: 12px; height: 12px; stroke-width: 3; }
/* B2: a pop-up button (SwiftUI Picker in .menu style): a capsule with the up-down chevrons. */
.B2 .cur { max-width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 9px; border-radius: 16px; background: rgba(255,255,255,.1); font-weight: 600; font-size: 14px; cursor: pointer; min-width: 0; }
.big.B2 .cur { height: 48px; border-radius: 24px; padding: 0 16px 0 14px; font-size: 17px; }
.B2 .chev { flex: none; display: grid; place-items: center; position: relative; }
.B2 .chev svg.i { width: 15px; height: 15px; stroke: var(--fg2); stroke-width: 2.4; }
.wdot { position: absolute; top: -3px; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); border: 2px solid var(--term); }

/* the system menu (iOS 26, dark): checkmark column, title + subtitle, image on the trailing side */
.menu { position: absolute; left: 4px; top: calc(100% + 6px); width: 300px; max-width: calc(100% - 8px); background: #262624; border-radius: 22px; padding: 6px 0; z-index: 20;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.65); display: none; }
.big .menu { width: 330px; }
.open .menu { display: grid; }
.mrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 26px; align-items: center; gap: 4px; padding: 8px 16px 8px 8px; cursor: pointer; min-width: 0; }
.mrow:hover { background: rgba(255,255,255,.06); }
.mrow .ck { justify-self: center; font-size: 15px; font-weight: 700; }
.mrow .txt { min-width: 0; display: grid; gap: 1px; }
.mrow .t { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .s { font-size: 12.5px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .s.wait { color: var(--warn); }
.mrow .ic { justify-self: end; }
.msep { height: 8px; background: #1a1a19; margin: 4px 0; }
.mrow.new .t { font-size: 16px; }
.mrow.new svg.i { width: 18px; height: 18px; }
</style>

    <h1>终端名字放不下：只写当前名字，其余进菜单</h1>

    <p>每个方案左边是外屏，右边是内屏竖开。点头像或名字可以切换。内屏的顶栏把「附件」收进了「更多」，给名字多让出约 50 pt。</p>

const ICON = {
  back: '<path d="M14 6l-6 6 6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  more: '<circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/>',
  clip: '<path d="M20 11.5l-8.4 8.4a5 5 0 01-7.1-7.1l8.4-8.4a3.3 3.3 0 014.7 4.7l-8.4 8.4a1.7 1.7 0 01-2.4-2.4l7.8-7.8"/>',
  paste: '<rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  updown: '<path d="M7 9l5-5 5 5M7 15l5 5 5-5"/>',
};
const svg = (k) => `<svg class="i" viewBox="0 0 24 24">${ICON[k]}</svg>`;

const TERM = `<span class="d">  Thought for 4s (ctrl+o to expand)</span>

<span class="g">●</span> Update(<b>Views/WorkspaceDetailView.swift</b>)
  <span class="d">⎿</span>  Updated with <b>12</b> additions and <b>4</b> removals

<span class="g">●</span> Bash(xcodebuild build -project
      Coflux.xcodeproj -scheme Coflux …)
  <span class="d">⎿</span>  ** BUILD SUCCEEDED **

<span class="c">✶ Germinating… (2m 14s · ↓ 6.1k tokens)</span>

<span class="box">────────────────────────────────────────────</span>
<span class="d">❯</span> ▍
<span class="box">────────────────────────────────────────────</span>`;

const glyph = (t) => t.pose ? `<span class="clawd" data-pose="${t.pose}"></span>`
  : t.agent === "codex" ? `<span class="gl codex">&gt;_</span>` : `<span class="gl"><span class="dot s-${t.state}"></span></span>`;
const badge = (t) => t.state === "wait" ? '<span class="badge s-wait"></span>' : "";

function slot(key, active) {
  const cur = TERMINALS[active];
  if (key === "A") return `<div class="tray">${TERMINALS.map((t, i) =>
    `<span class="tile ${i === active ? "on" : ""}" data-i="${i}">${glyph(t)}<span class="nm">${t.title}</span>${badge(t)}</span>`).join("")}</div>`;
  if (key === "C") return `<div class="tray">
    <span class="cur">${glyph(cur)}<span class="txt"><span class="nm">${cur.title}</span><span class="ctx nm">${cur.agent || "zsh"} · ${cur.label.split(" · ")[0]}</span></span></span>
    <span class="group">${TERMINALS.map((t, i) => `<span class="tile ${i === active ? "on" : ""}" data-i="${i}">${glyph(t)}${badge(t)}</span>`).join("")}</span></div>`;
  const others = TERMINALS.some((t, i) => i !== active && t.state === "wait");
  // Menu images are still pictures in a system menu: Clawd stands still there.
  const still = (t) => glyph({ ...t, pose: t.pose ? "rest" : undefined });
  return `<span class="cur" data-toggle>${glyph(cur)}<span class="nm">${cur.title}</span><span class="chev">${svg(key === "B2" ? "updown" : "down")}${others ? '<i class="wdot"></i>' : ""}</span></span>
    <div class="menu">${TERMINALS.map((t, i) => `<div class="mrow" data-i="${i}"><span class="ck">${i === active ? "✓" : ""}</span><span class="txt"><span class="t">${t.title}</span><span class="s ${t.state}">${t.agent ? t.agent + " · " : ""}${t.label}</span></span><span class="ic">${still(t)}</span></div>`).join("")}
    <div class="msep"></div><div class="mrow new"><span></span><span class="t">新建终端</span><span class="ic">${svg("plus")}</span></div></div>`;
}

const dock = `<div class="dock"><span class="k">esc</span><span class="k">tab</span><span class="k wide">🎤</span><span class="k">↑</span><span class="k">⌫</span><span class="k ent">⏎</span>
  <span class="k red">^C</span><span class="k">^D</span><span class="k">/</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span></div>`;

function device(key, form) {
  if (form === "outer") return `<div class="dev outer ${key}" data-key="${key}">
    <div class="col"><div class="slot" data-slot></div><div class="termwrap"><div class="term">${TERM}</div></div>${dock}</div>
    <div class="rail"><div class="time">20:39</div><div class="ring"></div><div class="btn">${svg("back")}</div>
      <div class="grp a">${svg("plus")}${svg("more")}</div><div class="grp b">${svg("clip")}${svg("paste")}</div></div></div>`;
  return `<div class="dev inner big ${key}" data-key="${key}">
    <div class="nav"><span class="circ glass">${svg("back")}</span><div class="slot" data-slot></div>
      <span class="caps glass"><span>${svg("plus")}</span><span>${svg("paste")}</span><span>${svg("more")}</span></span>
      <span class="status"><span>20:39</span><span class="ring"></span></span></div>
    <div class="termwrap"><div class="term">${TERM}</div></div>${dock}</div>`;
}

document.querySelector(".page").insertAdjacentHTML("beforeend", OPTIONS.map((o) => `
  <section class="opt">
    <div class="notes">
      <h2>${o.key} · ${o.title}${o.rec ? '<span class="rec">推荐</span>' : ""}</h2>
      <p>${o.body}</p><p>${o.fit}</p>
    </div>
    <div class="pair">
      <div class="fit" data-w="484"><span class="cap">外屏 · 合上</span><div class="zoom">${device(o.key, "outer")}</div></div>
      <div class="fit" data-w="687"><span class="cap">内屏 · 竖着打开</span><div class="zoom">${device(o.key, "inner")}</div></div>
    </div>
  </section>`).join(""));

function render(dev, active, open) {
  const s = dev.querySelector("[data-slot]");
  s.innerHTML = slot(dev.dataset.key, active);
  s.classList.toggle("open", !!open);
  dev.dataset.active = active;
  animateClawds(s);
}
// Deferred: the Clawd player below is declared further down the script.
queueMicrotask(() => document.querySelectorAll(".dev").forEach((dev) => {
  render(dev, 0, dev.dataset.key.startsWith("B") && dev.classList.contains("inner"));
  dev.addEventListener("click", (e) => {
    const hit = e.target.closest("[data-i]");
    if (hit) return render(dev, +hit.dataset.i, false);
    if (e.target.closest("[data-toggle]")) {
      const s = dev.querySelector("[data-slot]");
      render(dev, +dev.dataset.active, !s.classList.contains("open"));
    }
  });
}));

document.querySelector(".count-pick").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-n]");
  if (!b) return;
  document.querySelectorAll(".count-pick button").forEach((x) => x.classList.toggle("on", x === b));
  TERMINALS = ALL.slice(0, +b.dataset.n);
  document.querySelectorAll(".dev").forEach((dev) => render(dev, Math.min(+dev.dataset.active, TERMINALS.length - 1), false));
});

function fit() {
  document.querySelectorAll(".fit").forEach((box) => {
    box.querySelector(".zoom").style.zoom = Math.min(1, box.clientWidth / +box.dataset.w);
  });
}
addEventListener("resize", fit); fit();

/* ---- Clawd: ported from apps/desktop/src/renderer/components/workbench/clawd-glyph.tsx ---- */
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
const GYM_SEQUENCE = [...range(0, 13), ...range(13, 25), ...range(13, 25), ...range(25, 36)];
const CONFETTI_Y = [-65, -72, -76, -70, -58, -42, -22, 0];
const FLAG_HAND_X = [0, -6, -12, -14, -8, -2, 0, 0, -4, -10, -16, -18];
const FLAG_SWAY_X = [0, 0, -5, -5, 0, 4, 4, 4, 0, 0, -5, -5];
const FLAG_LEFT_HAND_Y = [0, 0, 4, 4, 0, 0, 0, 0, 0, 0, 4, 4];
const prepare = (raw) => raw.replace(/#DD775B/gi, "#D97757").replace(/\sclass="[^"]*"/g, "").replace(/\sid="[^"]*"/g, "").replace(/\sdata-svg-origin="[^"]*"/g, "");
const kids = (p, tag) => [...p.children].filter((el) => el.tagName === tag);
const showOnly = (els, n) => els.forEach((el, i) => { el.style.display = i === n ? "inline" : "none"; });
const gymDelay = (s, f) => s === GYM_SEQUENCE.length - 1 ? 1500 : (f === 6 || f === 7) ? 270 : (f === 15 || f === 21) ? 400 : 85;
function playGym(s) { const fr = kids(s, "g"); let i = 0; const t = () => { const f = GYM_SEQUENCE[i]; showOnly(fr, f); const d = gymDelay(i, f); i = (i + 1) % GYM_SEQUENCE.length; if (s.isConnected) setTimeout(t, d); }; t(); }
function playFlag(s) {
  const body = kids(s, "g")[0], left = body.children[5], hand = body.children[8], flags = kids(hand, "g");
  body.removeAttribute("transform"); body.style.transform = ""; hand.removeAttribute("transform"); hand.style.transform = "";
  let n = 0, intro = true;
  const t = () => {
    body.setAttribute("transform", `translate(${FLAG_SWAY_X[n]}, 0)`); hand.setAttribute("transform", `translate(${FLAG_HAND_X[n]}, 0)`);
    left.setAttribute("transform", `translate(0, ${FLAG_LEFT_HAND_Y[n]})`); showOnly(flags, n);
    if (intro) { if (n < 11) n++; else { intro = false; n = 3; } } else n = n === 11 ? 3 : n + 1;
    if (s.isConnected) setTimeout(t, 100);
  };
  t();
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateClawds(root) {
  root.querySelectorAll(".clawd").forEach((host) => {
    const pose = host.dataset.pose;
    host.innerHTML = prepare(SVGS[pose === "raise" ? "flag" : "gym"]);
    const s = host.querySelector("svg");
    s.setAttribute("shape-rendering", "crispEdges"); s.removeAttribute("style");
    if (pose === "raise") { if (still) showOnly(kids(kids(s, "g")[0].children[8], "g"), 5); else playFlag(s); }
    else if (pose === "rest" || still) showOnly(kids(s, "g"), pose === "rest" ? 0 : 32);
    else playGym(s);
  });
}
