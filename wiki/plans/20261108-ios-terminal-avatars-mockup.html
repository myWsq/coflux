<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>终端头像切换</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Each option: notes, then the Duo outer display (466 × 678 pt) collapsed and expanded, and the inner display open tall (669 × 951 pt), true scale zoomed to fit. Single dark look, matching the app. */
:root {
  --canvas: #0c0c0b; --ink: #e6e6e3; --muted: #8a8a82; --line: #262624; --warn: #c9a227;
  --term: #0a0a0a; --phone: #0f0f0f; --card: #1b1b1a; --raise: #262624; --input: #2a2a28;
  --fg: #e6e6e3; --fg2: #75756d; --ok: #4fae6e; --bad: #e05c6a; --info: #6b9bd1;
  --ui: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--canvas); color: var(--ink); font-family: var(--ui); }
.page { max-width: 1500px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 56px; }
header { display: grid; gap: 10px; max-width: 76ch; }
header h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.spec { font-family: var(--mono); font-size: 12px; color: var(--warn); letter-spacing: .04em; }
.opt { display: grid; gap: 18px; }
.notes { display: grid; gap: 10px; max-width: 84ch; }
.notes h2 { margin: 0; font-size: 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.notes h2 .rec { font-size: 12px; font-weight: 600; color: var(--term); background: var(--warn); padding: 2px 8px; border-radius: 99px; }
.notes p { margin: 0; font-size: 14.5px; line-height: 1.65; color: #c8c8c2; }
.trio { display: grid; grid-template-columns: minmax(0, 484fr) minmax(0, 484fr) minmax(0, 687fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .trio { grid-template-columns: minmax(0, 1fr); } }
.fit { min-width: 0; display: grid; gap: 8px; justify-items: start; }
.cap { font-size: 12.5px; color: var(--muted); font-family: var(--mono); letter-spacing: .03em; }

.dev { position: relative; overflow: hidden; background: var(--term); color: var(--fg); font-family: var(--ui); font-size: 15px; margin: 9px;
  box-shadow: 0 0 0 7px #050505, 0 0 0 8.5px #33332f, 0 30px 60px -24px rgba(0,0,0,.8); }
svg.i { width: 20px; height: 20px; stroke: #e6e6e3; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* outer display, closed */
.outer { width: 466px; height: 678px; border-radius: 20px 56px 56px 20px; background: var(--phone); }
.outer .col { position: absolute; left: 0; top: 0; bottom: 0; width: 394px; background: var(--term); display: flex; flex-direction: column; overflow: hidden; }
.rail { position: absolute; right: 0; top: 0; bottom: 0; width: 72px; }
.rail .time { position: absolute; top: 76px; width: 72px; text-align: center; font-weight: 700; font-size: 17px; }
.rail .ring { position: absolute; top: 104px; left: 17px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
.rail .btn, .rail .grp { position: absolute; left: 13px; width: 46px; background: #222220; border: 1px solid #2e2e2b; display: grid; justify-items: center; align-content: space-evenly; }
.rail .btn { top: 168px; height: 46px; border-radius: 50%; }
.rail .grp.a { top: 226px; height: 98px; border-radius: 23px; }
.rail .grp.b { bottom: 24px; height: 98px; border-radius: 23px; }

/* inner display, open tall */
.inner { width: 669px; height: 951px; border-radius: 34px; display: flex; flex-direction: column; }
.nav { flex: none; height: 48px; margin-top: 24px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px; position: relative; }
.glass { background: rgba(48,48,45,.72); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.35); }
.circ { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.caps { height: 48px; border-radius: 24px; display: flex; align-items: center; padding: 0 8px; flex: none; }
.caps span { width: 50px; display: grid; place-items: center; }
.status { flex: none; width: 104px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-weight: 600; }
.status .ring { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
.nav .ttl { flex: 1; min-width: 0; text-align: center; line-height: 1.25; }
.nav .ttl b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .ttl small { color: var(--fg2); font-size: 12px; }

.termwrap { position: relative; flex: 1; min-height: 0; }
.term { position: absolute; inset: 0; padding: 8px 12px 0 14px; font-family: var(--mono); font-size: 12.5px; line-height: 15.7px; white-space: pre; color: #e4e4e4; overflow: hidden; }
.term .d { color: #6b6b66; } .term .g { color: #4fae6e; } .term .c { color: #e8916c; } .term .b { color: #6f9be0; } .term .y { color: #c9a227; } .term .p { color: #c678dd; } .term .box { color: #4a4a46; } .term .r { color: #e05c6a; }
.dock { flex: none; padding: 8px 4px 25px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 40px 40px; gap: 7px; }
.inner .dock { padding-bottom: 43px; }
.k { border-radius: 13px; background: var(--input); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 14px; font-weight: 600; }
.k.wide { grid-column: span 2; } .k.ent { grid-row: span 2; background: #ececea; color: #0f0f0f; } .k.red { color: var(--bad); }

/* glyphs */
.clawd { display: inline-flex; width: 18px; height: 18px; flex: none; overflow: visible; }
.clawd svg { width: 100%; height: 100%; display: block; overflow: visible; }
.gl { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; }
.gl .dot { width: 8px; height: 8px; border-radius: 50%; }
.gl.codex { font-family: var(--mono); font-weight: 700; font-size: 11px; }
.s-work { background: var(--ok); } .s-wait { background: var(--warn); } .s-done { background: var(--info); } .s-idle { background: var(--fg2); }
.t-work { color: var(--ok); } .t-wait { color: var(--warn); } .t-done { color: var(--info); } .t-idle { color: var(--fg2); }

/* the avatar: a round face, state dot at the bottom right, amber ring when it waits */
.av { --sz: 32px; width: var(--sz); height: var(--sz); border-radius: 50%; background: #1f1f1d; border: 1.5px solid #3a3a36; display: grid; place-items: center; position: relative; flex: none; cursor: pointer; }
.inner .av { --sz: 36px; }
.av .st { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--term); }
.av.on { border-color: var(--fg); border-width: 2px; }
.av.wait:not(.on) { border-color: var(--warn); }
.inner .av .clawd, .inner .av .gl { width: 20px; height: 20px; }

/* a frosted pad behind the cluster so terminal text under it stays out of the way */
.pad { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; align-items: center; gap: 0; padding: 4px; border-radius: 99px; background: rgba(20,20,19,.82); box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 6px 18px rgba(0,0,0,.5); backdrop-filter: blur(10px); }
.cover { position: absolute; z-index: 4; border: 1.5px dashed rgba(201,162,39,.55); border-radius: 10px; pointer-events: none; }
.cover span { position: absolute; left: -2px; bottom: -20px; font-family: var(--mono); font-size: 10.5px; color: var(--warn); white-space: nowrap; }

/* A · facepile */
.A .pad .av + .av { margin-left: -9px; }
.A .pad .av { box-shadow: 0 0 0 2px rgba(20,20,19,1); }
.A .pad .av.on { z-index: 2; }

/* B · column down the right edge */
.B .pad { flex-direction: column; gap: 6px; border-radius: 22px; padding: 5px; }
.B .lab { position: absolute; right: calc(100% + 8px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: rgba(20,20,19,.94); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 5px 10px; display: none; max-width: 230px; }
.B .open .lab { display: grid; }
.B .lab b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; } .B .lab small { font-size: 11.5px; }

/* C · current face + count */
.C .pad { gap: 6px; padding: 4px 10px 4px 4px; }
.C .more { font-size: 13px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.C .more i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

/* the expanded list (A and C): name + state, home tones */
.list { position: absolute; top: calc(100% + 8px); right: 0; width: 300px; background: rgba(28,28,26,.98); border-radius: 18px; padding: 6px; box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 20px 50px rgba(0,0,0,.65); display: none; }
.open .list { display: grid; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; cursor: pointer; min-width: 0; }
.lrow.on { background: var(--raise); }
.lrow .txt { min-width: 0; display: grid; gap: 1px; flex: 1; }
.lrow b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow small { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lnew { display: flex; align-items: center; gap: 10px; padding: 10px; font-size: 14px; color: var(--fg2); border-top: 1px solid var(--line); margin-top: 4px; }
.lnew svg.i { width: 16px; height: 16px; stroke: var(--fg2); }
/* the current terminal's name as a one-time toast when switching (all options) */
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; background: rgba(28,28,26,.96); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 7px 12px; display: grid; gap: 1px; text-align: center; max-width: 80%; }
.toast b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .toast small { font-size: 12px; }
</style>

<div class="page">
  <header>
    <span class="spec">外屏 466 × 678 pt（终端列 394）· 内屏竖开 669 × 951 pt · 5 个终端</span>
    <h1>终端切换挪到终端右上角：一组头像</h1>
    <p>顶部不再放切换条：外屏的终端一直顶到屏幕最上面，内屏的顶栏只放系统的返回、按钮和工作区标题。切换器变成终端区右上角的一组圆形头像，浮在终端上面，垫一层深色磨砂底。</p>
    <p>头像的规矩三种方案一样：里面是 agent 的标志（claude 是会动的 Clawd），右下角一个小圆点是状态（颜色和首页一致：黄在等你、绿在干活、蓝本轮完成、灰空闲），当前终端描白边，在等你的描黄边。黄色虚线框是它会盖住的终端区域。每个方案三张图：外屏收起、外屏展开、内屏。都能点。</p>
  </header>
</div>

  paste: '<rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>',
};
const svg = (k) => `<svg class="i" viewBox="0 0 24 24">${ICON[k]}</svg>`;

const TERM = `<span class="d">  Thought for 4s (ctrl+o to expand)</span>

<span class="g">●</span> Update(<b>Views/WorkspaceDetailView.swift</b>)
  <span class="d">⎿</span>  Updated with <b>12</b> additions and <b>4</b> removals
     <span class="d">466</span>         .frame(height: <span class="p">Self</span>.tabHeight)
     <span class="d">467</span> <span class="g">+       .padding(.top, 3)</span>
     <span class="d">469</span> <span class="r">-       .padding(.top, 4)</span>

<span class="g">●</span> Bash(xcodebuild build -project Coflux.xcodeproj -scheme
      Coflux -configuration Debug -destination 'id=0000…')
  <span class="d">⎿</span>  ** BUILD SUCCEEDED **

<span class="g">●</span> The switcher now floats over the terminal's top-right
  corner; the strip above the terminal is gone.

<span class="c">✶ Germinating… (2m 14s · ↓ 6.1k tokens)</span>

<span class="box">────────────────────────────────────────────</span>
<span class="d">❯</span> ▍
<span class="box">────────────────────────────────────────────</span>
  <span class="d">Opus 5.5 │ 5h</span> <span class="r">100%</span> <span class="d">│ 7d 总</span> <span class="y">77%</span>`;

const glyph = (t) => t.pose ? `<span class="clawd" data-pose="${t.pose}"></span>`
  : t.agent === "codex" ? `<span class="gl codex">&gt;_</span>` : `<span class="gl"><span class="dot s-${t.state}"></span></span>`;
const av = (t, i, active, extra = "") => `<span class="av ${i === active ? "on" : ""} ${t.state === "wait" ? "wait" : ""}" data-i="${i}" ${i === active ? "data-toggle" : ""}>${glyph(t)}<span class="st s-${t.state}"></span>${extra}</span>`;
const list = (active) => `<div class="list">${T.map((t, i) => `<div class="lrow ${i === active ? "on" : ""}" data-i="${i}"><span class="av ${t.state === "wait" ? "wait" : ""}">${glyph(t)}<span class="st s-${t.state}"></span></span><span class="txt"><b>${t.title}</b><small class="t-${t.state}">${t.label}</small></span></div>`).join("")}
  <div class="lnew">${svg("plus")}新建终端</div></div>`;

function cluster(key, active) {
  if (key === "A") return `${T.map((t, i) => av(t, i, active)).join("")}${list(active)}`;
  if (key === "B") return T.map((t, i) => av(t, i, active, `<span class="lab"><b>${t.title}</b><small class="t-${t.state}">${t.label}</small></span>`)).join("");
  const others = T.some((t, i) => i !== active && t.state === "wait");
  return `${av(T[active], active, active)}<span class="more" data-toggle>${others ? "<i></i>" : ""}+${T.length - 1}</span>${list(active)}`;
}

const dock = `<div class="dock"><span class="k">esc</span><span class="k">tab</span><span class="k wide">🎤</span><span class="k">↑</span><span class="k">⌫</span><span class="k ent">⏎</span>
  <span class="k red">^C</span><span class="k">^D</span><span class="k">/</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span></div>`;

function device(key, form, open) {
  const body = `<div class="termwrap"><div class="term">${TERM}</div><div class="pad ${open ? "open" : ""}" data-pad></div><div class="cover" data-cover></div></div>`;
  if (form === "outer") return `<div class="dev outer ${key}" data-key="${key}" data-open="${open ? 1 : 0}">
    <div class="col">${body}${dock}</div>
    <div class="rail"><div class="time">20:39</div><div class="ring"></div><div class="btn">${svg("back")}</div>
      <div class="grp a">${svg("plus")}${svg("more")}</div><div class="grp b">${svg("clip")}${svg("paste")}</div></div></div>`;
  return `<div class="dev inner ${key}" data-key="${key}" data-open="${open ? 1 : 0}">
    <div class="nav"><span class="circ glass">${svg("back")}</span><span class="ttl"><b>dev/20261107-ios-duo-redesign</b><small>coflux · MacBook Pro</small></span>
      <span class="caps glass"><span>${svg("plus")}</span><span>${svg("clip")}</span><span>${svg("paste")}</span><span>${svg("more")}</span></span>
      <span class="status"><span>20:39</span><span class="ring"></span></span></div>
    ${body}${dock}</div>`;
}

document.querySelector(".page").insertAdjacentHTML("beforeend", OPTIONS.map((o) => `
  <section class="opt">
    <div class="notes"><h2>${o.key} · ${o.title}${o.rec ? '<span class="rec">推荐</span>' : ""}</h2><p>${o.body}</p><p>${o.fit}</p></div>
    <div class="trio">
      <div class="fit" data-w="484"><span class="cap">外屏 · 收起</span><div class="zoom">${device(o.key, "outer", false)}</div></div>
      <div class="fit" data-w="484"><span class="cap">外屏 · 点开当前头像</span><div class="zoom">${device(o.key, "outer", true)}</div></div>
      <div class="fit" data-w="687"><span class="cap">内屏 · 竖着打开</span><div class="zoom">${device(o.key, "inner", false)}</div></div>
    </div>
  </section>`).join(""));

function render(dev, active, open) {
  const pad = dev.querySelector("[data-pad]");
  pad.innerHTML = cluster(dev.dataset.key, active);
  pad.classList.toggle("open", open);
  dev.dataset.active = active; dev.dataset.open = open ? 1 : 0;
  animateClawds(pad);
  // Outline what the cluster covers (collapsed size), measured at true scale.
  requestAnimationFrame(() => {
    const z = parseFloat(dev.closest(".zoom").style.zoom || 1);
    const wrap = dev.querySelector(".termwrap").getBoundingClientRect();
    const r = pad.getBoundingClientRect();
    const cover = dev.querySelector("[data-cover]");
    const w = Math.round(r.width / z), h = Math.round(r.height / z);
    Object.assign(cover.style, { left: `${(r.left - wrap.left) / z - 3}px`, top: `${(r.top - wrap.top) / z - 3}px`, width: `${w + 6}px`, height: `${h + 6}px` });
    cover.innerHTML = open ? "" : `<span>盖住 ${w} × ${h} pt</span>`;
    cover.style.display = open ? "none" : "block";
  });
}

queueMicrotask(() => document.querySelectorAll(".dev").forEach((dev) => {
  render(dev, 0, dev.dataset.open === "1");
  dev.addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-toggle]");
    const hit = e.target.closest("[data-i]");
    if (toggle) return render(dev, +dev.dataset.active, dev.dataset.open !== "1");
    if (hit) return render(dev, +hit.dataset.i, false);
  });
}));

function fit() {
  document.querySelectorAll(".fit").forEach((box) => {
    box.querySelector(".zoom").style.zoom = Math.min(1, box.clientWidth / +box.dataset.w);
  });
  document.querySelectorAll(".dev").forEach((dev) => dev.dataset.active && render(dev, +dev.dataset.active, dev.dataset.open === "1"));
}
addEventListener("resize", fit); fit();

/* ---- Clawd: ported from apps/desktop/src/renderer/components/workbench/clawd-glyph.tsx ---- */
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
const GYM_SEQUENCE = [...range(0, 13), ...range(13, 25), ...range(13, 25), ...range(25, 36)];
const CONFETTI_Y = [-65, -72, -76, -70, -58, -42, -22, 0];
const FLAG_HAND_X = [0, -6, -12, -14, -8, -2, 0, 0, -4, -10, -16, -18];
const FLAG_SWAY_X = [0, 0, -5, -5, 0, 4, 4, 4, 0, 0, -5, -5];
const FLAG_LEFT_HAND_Y = [0, 0, 4, 4, 0, 0, 0, 0, 0, 0, 4, 4];
const prepare = (raw) => raw.replace(/#DD775B/gi, "#D97757").replace(/\sclass="[^"]*"/g, "").replace(/\sid="[^"]*"/g, "").replace(/\sdata-svg-origin="[^"]*"/g, "");
const kids = (p, tag) => [...p.children].filter((el) => el.tagName === tag);
const showOnly = (els, n) => els.forEach((el, i) => { el.style.display = i === n ? "inline" : "none"; });
const gymDelay = (s, f) => s === GYM_SEQUENCE.length - 1 ? 1500 : (f === 6 || f === 7) ? 270 : (f === 15 || f === 21) ? 400 : 85;
function playGym(s) { const fr = kids(s, "g"); let i = 0; const t = () => { const f = GYM_SEQUENCE[i]; showOnly(fr, f); const d = gymDelay(i, f); i = (i + 1) % GYM_SEQUENCE.length; if (s.isConnected) setTimeout(t, d); }; t(); }
function playFlag(s) {
  const body = kids(s, "g")[0], left = body.children[5], hand = body.children[8], flags = kids(hand, "g");
  body.removeAttribute("transform"); body.style.transform = ""; hand.removeAttribute("transform"); hand.style.transform = "";
  let n = 0, intro = true;
  const t = () => {
    body.setAttribute("transform", `translate(${FLAG_SWAY_X[n]}, 0)`); hand.setAttribute("transform", `translate(${FLAG_HAND_X[n]}, 0)`);
    left.setAttribute("transform", `translate(0, ${FLAG_LEFT_HAND_Y[n]})`); showOnly(flags, n);
    if (intro) { if (n < 11) n++; else { intro = false; n = 3; } } else n = n === 11 ? 3 : n + 1;
    if (s.isConnected) setTimeout(t, 100);
  };
  t();
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateClawds(root) {
  root.querySelectorAll(".clawd").forEach((host) => {
    const pose = host.dataset.pose;
    host.innerHTML = prepare(SVGS[pose === "raise" ? "flag" : "gym"]);
    const s = host.querySelector("svg");
    s.setAttribute("shape-rendering", "crispEdges"); s.removeAttribute("style");
    if (pose === "raise") { if (still) showOnly(kids(kids(s, "g")[0].children[8], "g"), 5); else playFlag(s); }
    else if (pose === "rest" || still) showOnly(kids(s, "g"), pose === "rest" ? 0 : 32);
    else playGym(s);
  });
}
