<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外屏首页行样式</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Outer display, closed (466 × 678 pt), drawn at true scale and zoomed to fit; the system rail on the
   trailing 72 pt. The home's rows take the sidebar's row (diff on the state line). Single dark look,
   colours from apps/ios/Coflux/Views/Theme.swift. */
:root {
  --canvas: #0c0c0b; --ink: #e6e6e3; --muted: #8a8a82; --line: #242422; --warn: #c9a227;
  --bg: #0f0f0f; --surface: #151514; --card: #1b1b1a; --raise: #262624;
  --fg: #e6e6e3; --fg2: #75756d; --fg3: rgba(117,117,109,.55); --ok: #4fae6e; --bad: #e05c6a; --info: #6b9bd1;
  --ui: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--canvas); color: var(--ink); font-family: var(--ui); }
.page { max-width: 1500px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
header { display: grid; gap: 10px; max-width: 80ch; }
header h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
header p { margin: 0; color: #c8c8c2; font-size: 15px; line-height: 1.65; }
.spec { font-family: var(--mono); font-size: 12px; color: var(--warn); letter-spacing: .04em; }
.row { display: grid; gap: 22px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
@media (max-width: 1100px) { .row { grid-template-columns: minmax(0, 1fr); } }
.cell { min-width: 0; display: grid; gap: 10px; align-content: start; }
.cell h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cell h3 .rec { font-size: 11.5px; font-weight: 600; color: #0a0a0a; background: var(--warn); padding: 2px 8px; border-radius: 99px; }
.cell p { margin: 0; font-size: 13.5px; line-height: 1.6; color: #b9b9b2; }
.fit { min-width: 0; }

.dev { position: relative; overflow: hidden; width: 466px; height: 678px; margin: 9px; border-radius: 20px 56px 56px 20px; background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px;
  box-shadow: 0 0 0 7px #050505, 0 0 0 8.5px #33332f, 0 30px 60px -24px rgba(0,0,0,.8); }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.rail { position: absolute; right: 0; top: 0; bottom: 0; width: 72px; display: flex; flex-direction: column; align-items: center; padding: 64px 0 24px; gap: 10px; }
.rail .tm { font-weight: 700; font-size: 17px; }
.rail .ring { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; margin-bottom: 8px; }
.rail .grp { width: 46px; border-radius: 23px; background: #222220; border: 1px solid #2e2e2b; display: grid; justify-items: center; padding: 12px 0; gap: 26px; }
.rail .sp { flex: 1; }
.rail .on { color: #2f7cf6; }
.col { position: absolute; left: 0; top: 0; bottom: 0; right: 72px; overflow: hidden; }
.scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 0 0 24px; }

.lt { padding: 40px 20px 6px; }
.lt b { display: block; font-size: 30px; font-weight: 760; letter-spacing: -.02em; }
.lt span { font-size: 14px; color: var(--fg2); }
.st { padding: 14px 20px 8px; font-size: 22px; font-weight: 700; }
/* section header as in the sidebar */
.lh { padding: 16px 20px 4px; font-size: 13px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.lh b { font-weight: 600; } .lh span { color: var(--fg3); }
.lh i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.lh i.off { background: transparent; box-shadow: inset 0 0 0 1.2px var(--fg2); }
.first { padding-top: 34px; }

/* rows */
.sr { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 14px 9px 16px; }
.sr .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.sr .txt b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr .txt b em { font-style: normal; font-weight: 400; font-size: 12px; color: var(--fg3); margin-left: 6px; }
.sr .l2 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.sr .l2 small { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff { flex: none; font-family: var(--mono); font-size: 12px; display: flex; gap: 5px; }
.diff .a { color: var(--ok); } .diff .x { color: var(--bad); }
.t-work { color: var(--ok); } .t-wait { color: var(--warn); } .t-done { color: var(--info); } .t-idle { color: var(--fg2); }
.ra { width: 26px; height: 26px; border-radius: 8.3px; background: var(--raise); display: grid; place-items: center; position: relative; flex: none; }
.ra .clawd { width: 70%; height: 70%; }
.ra .dot { position: absolute; top: -2.6px; right: -2.6px; width: 8.8px; height: 8.8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bg); }
.in-card .ra .dot { box-shadow: 0 0 0 2px var(--card); }
.dot.work { background: var(--ok); } .dot.wait { background: var(--warn); } .dot.done { background: var(--info); } .dot.idle { background: var(--fg2); }
.ra.br { background: transparent; }
.ra.br svg.i { width: 17px; height: 17px; color: var(--fg2); }
.ra.br.main svg.i { color: var(--warn); }
.gl.codex { font-family: var(--mono); font-weight: 700; font-size: 11px; }

/* card variant */
.pcard { margin: 0 16px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.pcard .ph { display: flex; align-items: center; gap: 8px; padding: 12px 16px 6px; font-size: 15px; font-weight: 600; }
.pcard .ph svg.i { width: 15px; height: 15px; color: var(--fg2); }
.pcard .ph .dv { margin-left: auto; display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 13px; color: var(--fg2); }
.pcard .ph .dv i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.pcard .sr + .sr { border-top: 1px solid var(--line); }

/* waiting card (unchanged) */
.wc { margin: 0 16px 4px; background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 14px 16px; display: grid; gap: 10px; }
.wc .top { display: flex; align-items: center; gap: 10px; }
.wc .top .txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.wc .top b { font-size: 15px; } .wc .top small { font-size: 13px; color: var(--fg2); }
.wc .pill { font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 99px; color: var(--warn); background: rgba(201,162,39,.14); }
.wc p { margin: 0; font-size: 15px; line-height: 1.4; }
.wc .av { width: 34px; height: 34px; border-radius: 11px; background: var(--raise); display: grid; place-items: center; }
.wc .av .clawd { width: 70%; height: 70%; }
.clawd { display: inline-flex; width: 18px; height: 18px; flex: none; overflow: visible; }
.clawd svg { width: 100%; height: 100%; display: block; overflow: visible; }
</style>

<div class="page">
  <header>
    <span class="spec">外屏 466 × 678 pt · 首页的工作区行换成侧栏的行：改动行数放第二行右边</span>
    <h1>外屏首页：行样式</h1>
    <p>现在的问题（截图里看得出来）：改动行数单独占右边一列，分支名被挤得很短，<code>dev/20261103-support…</code> 只剩一半；每行上下空白多，一屏只放得下 7 行。三个方案的行都和内屏侧栏一样：图标 26 pt、两行字、改动行数在第二行右边、上下 9 pt。区别在外面怎么包。</p>
  </header>
</div>

/* ---- Clawd: ported from apps/desktop/src/renderer/components/workbench/clawd-glyph.tsx ---- */
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
const GYM_SEQUENCE = [...range(0, 13), ...range(13, 25), ...range(13, 25), ...range(25, 36)];
const FLAG_HAND_X = [0, -6, -12, -14, -8, -2, 0, 0, -4, -10, -16, -18];
const FLAG_SWAY_X = [0, 0, -5, -5, 0, 4, 4, 4, 0, 0, -5, -5];
const FLAG_LEFT_HAND_Y = [0, 0, 4, 4, 0, 0, 0, 0, 0, 0, 4, 4];
const prepare = (raw) => raw.replace(/#DD775B/gi, "#D97757").replace(/\sclass="[^"]*"/g, "").replace(/\sid="[^"]*"/g, "").replace(/\sdata-svg-origin="[^"]*"/g, "");
const kids = (p, tag) => [...p.children].filter((el) => el.tagName === tag);
const showOnly = (els, n) => els.forEach((el, i) => { el.style.display = i === n ? "inline" : "none"; });
const gymDelay = (s, f) => s === GYM_SEQUENCE.length - 1 ? 1500 : (f === 6 || f === 7) ? 270 : (f === 15 || f === 21) ? 400 : 85;
function playGym(s) { const fr = kids(s, "g"); let i = 0; const t = () => { const f = GYM_SEQUENCE[i]; showOnly(fr, f); const d = gymDelay(i, f); i = (i + 1) % GYM_SEQUENCE.length; if (s.isConnected) setTimeout(t, d); }; t(); }
function playFlag(s) {
  const body = kids(s, "g")[0], left = body.children[5], hand = body.children[8], flags = kids(hand, "g");
  body.removeAttribute("transform"); body.style.transform = ""; hand.removeAttribute("transform"); hand.style.transform = "";
  let n = 0, intro = true;
  const t = () => {
    body.setAttribute("transform", `translate(${FLAG_SWAY_X[n]}, 0)`); hand.setAttribute("transform", `translate(${FLAG_HAND_X[n]}, 0)`);
    left.setAttribute("transform", `translate(0, ${FLAG_LEFT_HAND_Y[n]})`); showOnly(flags, n);
    if (intro) { if (n < 11) n++; else { intro = false; n = 3; } } else n = n === 11 ? 3 : n + 1;
    if (s.isConnected) setTimeout(t, 100);
  };
  t();
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
queueMicrotask(() => document.querySelectorAll(".clawd").forEach((host) => {
  const pose = host.dataset.pose;
  host.innerHTML = prepare(SVGS[pose === "raise" ? "flag" : "gym"]);
  const s = host.querySelector("svg");
  s.setAttribute("shape-rendering", "crispEdges"); s.removeAttribute("style");
  if (pose === "raise") { if (still) showOnly(kids(kids(s, "g")[0].children[8], "g"), 5); else playFlag(s); }
  else if (pose === "rest" || still) showOnly(kids(s, "g"), pose === "rest" ? 0 : 32);
  else playGym(s);
}));
