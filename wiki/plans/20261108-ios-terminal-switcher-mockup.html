<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>终端切换栏方案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a column of numbered-free option cards, each a true-scale Duo outer display (1 CSS px = 1 pt, zoomed down to fit) beside its notes. Single dark look, matching the app. */
:root {
  --canvas: #0c0c0b; --ink: #e6e6e3; --muted: #8a8a82; --line: #262624; --warn: #c9a227;
  --term: #0a0a0a; --phone: #0f0f0f; --surface: #151514; --card: #1b1b1a; --raise: #262624; --input: #2a2a28;
  --fg: #e6e6e3; --fg2: #75756d; --ok: #4fae6e; --bad: #e05c6a; --info: #6b9bd1;
  --ui: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--canvas); color: var(--ink); font-family: var(--ui); }
.page { max-width: 1100px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
header { display: grid; gap: 10px; max-width: 68ch; }
header h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.spec { font-family: var(--mono); font-size: 12px; color: var(--warn); letter-spacing: .04em; }
.opt { display: grid; grid-template-columns: minmax(0, 466px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 760px) { .opt { grid-template-columns: minmax(0, 1fr); } }
.notes { display: grid; gap: 12px; align-content: start; max-width: 60ch; }
.notes h2 { margin: 0; font-size: 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.notes h2 .rec { font-size: 12px; font-weight: 600; color: var(--term); background: var(--warn); padding: 2px 8px; border-radius: 99px; }
.notes p { margin: 0; font-size: 14.5px; line-height: 1.65; color: #c8c8c2; }
.notes dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.notes dt { color: var(--muted); }
.notes dd { margin: 0; font-variant-numeric: tabular-nums; }
.notes .plus { color: var(--ok); } .notes .minus { color: var(--bad); }
.fit { width: 100%; }

/* ---------- the device: Duo outer display, closed ---------- */
.dev { width: 466px; height: 678px; position: relative; overflow: hidden; background: var(--phone); color: var(--fg); font-family: var(--ui); font-size: 15px;
  border-radius: 20px 56px 56px 20px; box-shadow: 0 0 0 7px #050505, 0 0 0 8.5px #33332f, 0 30px 60px -24px rgba(0,0,0,.8); margin: 9px; }
.col { position: absolute; left: 0; top: 0; bottom: 0; width: 394px; background: var(--term); display: flex; flex-direction: column; overflow: hidden; }
.termwrap { position: relative; flex: 1; min-height: 0; }
.term { position: absolute; inset: 0; padding: 6px 10px 0 12px; font-family: var(--mono); font-size: 12.5px; line-height: 15.7px; white-space: pre; color: #e4e4e4; overflow: hidden; display: none; }
.term.on { display: block; }
.term .d { color: #6b6b66; } .term .g { color: #4fae6e; } .term .r { color: #e05c6a; } .term .c { color: #e8916c; } .term .b { color: #6f9be0; } .term .y { color: #c9a227; } .term .p { color: #c678dd; }
.term .box { color: #4a4a46; }
/* the dock: two quick rows on seven columns, ⏎ spans both */
.dock { flex: none; padding: 8px 4px 25px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 40px 40px; gap: 7px; }
.k { border-radius: 13px; background: var(--input); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--fg); }
.k.wide { grid-column: span 2; gap: 10px; display: flex; justify-content: center; align-items: center; }
.k.wide i { width: 1px; height: 16px; background: var(--line); }
.k.ent { grid-row: span 2; background: #ececea; color: #0f0f0f; border-color: transparent; }
.k.red { color: var(--bad); }
.k.hot { color: var(--warn); background: rgba(201,162,39,.16); border-color: rgba(201,162,39,.35); }
.k svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* the system rail on the trailing edge */
.rail { position: absolute; right: 0; top: 0; bottom: 0; width: 72px; }
.rail .time { position: absolute; top: 76px; width: 72px; text-align: center; font-weight: 700; font-size: 17px; }
.rail .ring { position: absolute; top: 104px; left: 17px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
.rail .btn, .rail .grp { position: absolute; left: 13px; width: 46px; background: #222220; border: 1px solid #2e2e2b; display: grid; justify-items: center; align-content: space-evenly; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.rail .btn { top: 168px; height: 46px; border-radius: 50%; }
.rail .grp.a { top: 226px; height: 98px; border-radius: 23px; }
.rail .grp.b { bottom: 24px; height: 98px; border-radius: 23px; }
.rail svg { width: 20px; height: 20px; stroke: #e6e6e3; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Clawd ---------- */
.clawd { display: inline-flex; width: 18px; height: 18px; flex: none; overflow: visible; }
.clawd svg { width: 18px; height: 18px; display: block; overflow: visible; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.s-work { background: var(--ok); } .s-wait { background: var(--warn); } .s-idle { background: var(--fg2); }

/* ---------- B · underline tabs ---------- */
.B .strip { flex: none; height: 32px; display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.B .tab { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg2); position: relative; cursor: pointer; }
.B .tab.on { color: var(--fg); font-weight: 600; }
.B .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--fg); }

/* ---------- C · current name + page dots ---------- */
.C .strip { flex: none; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 12px; }
.C .cur { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; min-width: 0; }
.C .cur .ctx { font-weight: 400; color: var(--fg2); font-size: 12.5px; }
.C .cur [data-name] { display: none; } .C .cur [data-name].on { display: flex; align-items: center; gap: 7px; }
.C .dots { margin-left: auto; display: flex; gap: 6px; align-items: center; padding: 6px 2px; }
.C .dot { width: 7px; height: 7px; border-radius: 99px; cursor: pointer; transition: width .25s, background .25s; }
.C .dot.on { width: 20px; background: var(--fg); }

/* ---------- D · editor tabs ---------- */
.D .strip { flex: none; height: 36px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: var(--surface); }
.D .tab { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 13px; color: var(--fg2); border-radius: 10px 10px 0 0; cursor: pointer; position: relative; }
.D .tab.on { background: var(--term); color: var(--fg); font-weight: 600; }
.D .tab:not(.on) + .tab:not(.on)::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 1px; background: var(--raise); }

/* ---------- E · avatar tray ---------- */
.E .strip { flex: none; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
.E .tab { height: 30px; min-width: 30px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-size: 13px; cursor: pointer; position: relative; }
.E .tab .nm { display: none; }
.E .tab.on { padding: 0 12px 0 8px; background: var(--raise); border-color: #34342f; font-weight: 600; }
.E .tab.on .nm { display: inline; }
.E .tab .badge { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--term); }
.E .tab.on .badge { display: none; }

/* ---------- F · floating over the terminal ---------- */
.F .strip { position: absolute; z-index: 5; left: 0; right: 0; top: 0; height: 40px; display: flex; gap: 16px; padding: 0 14px; align-items: center;
  background: linear-gradient(var(--term) 0, rgba(10,10,10,.92) 55%, rgba(10,10,10,0) 100%); }
.F .tab { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg2); cursor: pointer; padding: 4px 0; }
.F .tab.on { color: var(--fg); font-weight: 600; }
.F .term { padding-top: 4px; }

@media (prefers-reduced-motion: reduce) { .C .dot { transition: none; } }
</style>

<div class="page">
  <header>
    <span class="spec">外屏 · 合上 · 466 × 678 pt · 系统竖栏 72 pt · 终端列 394 pt</span>
    <h1>终端切换栏：五种方案</h1>
    <p>每张图都是外屏的真实尺寸，放了三个终端：一个 claude 在干活（健身），另一个 claude 在等你批准（挥旗），还有一个 zsh。点标签或圆点可以切换，看选中态的样子。Clawd 用的是桌面端同一套动画。</p>
    <p>现在线上的毛玻璃胶囊占 36 pt，下面每个方案都标了它比现在多给或少给终端多少空间（终端一行约 15.7 pt）。</p>
  </header>

  
</div>

function glyph(t) {
  return t.pose ? `<span class="clawd" data-pose="${t.pose}"></span>` : `<span class="sdot s-${t.state}"></span>`;
}

function strip(key) {
  const tabs = (extra = "") => TERMINALS.map((t, i) =>
    `<span class="tab" data-i="${i}">${glyph(t)}<span class="nm">${t.name}</span>${extra && t.state === "wait" ? '<span class="badge s-wait"></span>' : ""}</span>`).join("");
  if (key === "C") {
    return `<div class="strip"><span class="cur">${TERMINALS.map((t, i) =>
      `<span data-name data-i="${i}">${glyph(t)}${t.name}<span class="ctx">· coflux</span></span>`).join("")}</span>
      <span class="dots">${TERMINALS.map((t, i) => `<span class="dot s-${t.state}" data-i="${i}"></span>`).join("")}</span></div>`;
  }
  return `<div class="strip">${tabs(key === "E" ? "badge" : "")}</div>`;
}

function device(key) {
  return `<div class="dev ${key}" data-active="0">
    <div class="col">
      ${key === "F" ? "" : strip(key)}
      <div class="termwrap">${key === "F" ? strip(key) : ""}${TERM_TEXT.map((x, i) => `<div class="term" data-i="${i}">${x}</div>`).join("")}</div>
      <div class="dock">
        <span class="k" data-q="esc">esc</span><span class="k" data-q="tab">tab</span>
        <span class="k wide">${svg("kbd")}<i></i>${svg("mic")}</span>
        <span class="k">↑</span><span class="k">${svg("del")}</span><span class="k ent">${svg("ret")}</span>
        <span class="k red" data-q="c">^C</span><span class="k">^D</span><span class="k">/</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span>
      </div>
    </div>
    <div class="rail">
      <div class="time">16:56</div><div class="ring"></div>
      <div class="btn">${svg("back")}</div>
      <div class="grp a">${svg("plus")}${svg("more")}</div>
      <div class="grp b">${svg("clip")}${svg("paste")}</div>
    </div>
  </div>`;
}

function select(dev, i) {
  dev.dataset.active = i;
  dev.querySelectorAll("[data-i]").forEach((el) => el.classList.toggle("on", +el.dataset.i === i));
  // While the active agent waits, esc / tab / ^C become the option keys 1 2 3.
  const waiting = TERMINALS[i].state === "wait";
  const q = (k, on, off) => { const el = dev.querySelector(`[data-q="${k}"]`); el.textContent = waiting ? on : off; el.classList.toggle("hot", waiting); el.classList.toggle("red", !waiting && k === "c"); };
  q("esc", "1", "esc"); q("tab", "2", "tab"); q("c", "3", "^C");
}

document.querySelector(".page").insertAdjacentHTML("beforeend", OPTIONS.map((o) => `
  <section class="opt">
    <div class="fit"><div class="zoom">${device(o.key)}</div></div>
    <div class="notes">
      <h2>${o.key} · ${o.title}${o.rec ? '<span class="rec">推荐</span>' : ""}</h2>
      <dl><dt>占用高度</dt><dd>${o.height}</dd><dt>比现在</dt><dd class="${o.delta[0]}">${o.delta[1]}</dd></dl>
      <p>${o.body}</p>
      <p>${o.fit}</p>
    </div>
  </section>`).join(""));

document.querySelectorAll(".dev").forEach((dev) => {
  select(dev, 0);
  dev.addEventListener("click", (e) => {
    const hit = e.target.closest("[data-i]");
    if (hit && !hit.classList.contains("term")) select(dev, +hit.dataset.i);
  });
});

// Fit each 466 × 678 pt device into its column, never above true size.
function fit() {
  document.querySelectorAll(".fit").forEach((box) => {
    const z = Math.min(1, box.clientWidth / 484);
    box.querySelector(".zoom").style.zoom = z;
  });
}
addEventListener("resize", fit); fit();

/* ---- Clawd: ported from apps/desktop/src/renderer/components/workbench/clawd-glyph.tsx ---- */
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
const GYM_SEQUENCE = [...range(0, 13), ...range(13, 25), ...range(13, 25), ...range(25, 36)];
const CONFETTI_Y = [-65, -72, -76, -70, -58, -42, -22, 0];
const FLAG_HAND_X = [0, -6, -12, -14, -8, -2, 0, 0, -4, -10, -16, -18];
const FLAG_SWAY_X = [0, 0, -5, -5, 0, 4, 4, 4, 0, 0, -5, -5];
const FLAG_LEFT_HAND_Y = [0, 0, 4, 4, 0, 0, 0, 0, 0, 0, 4, 4];
const prepare = (raw) => raw.replace(/#DD775B/gi, "#D97757").replace(/\sclass="[^"]*"/g, "").replace(/\sid="[^"]*"/g, "").replace(/\sdata-svg-origin="[^"]*"/g, "");
const kids = (p, tag) => [...p.children].filter((el) => el.tagName === tag);
const showOnly = (els, n) => els.forEach((el, i) => { el.style.display = i === n ? "inline" : "none"; });
const gymDelay = (s, f) => s === GYM_SEQUENCE.length - 1 ? 1500 : (f === 6 || f === 7) ? 270 : (f === 15 || f === 21) ? 400 : 85;
function playGym(s) { const fr = kids(s, "g"); let i = 0; const t = () => { const f = GYM_SEQUENCE[i]; showOnly(fr, f); const d = gymDelay(i, f); i = (i + 1) % GYM_SEQUENCE.length; setTimeout(t, d); }; t(); }
function playFlag(s) {
  const body = kids(s, "g")[0], left = body.children[5], hand = body.children[8], flags = kids(hand, "g");
  body.removeAttribute("transform"); body.style.transform = ""; hand.removeAttribute("transform"); hand.style.transform = "";
  let n = 0, intro = true;
  const t = () => {
    body.setAttribute("transform", `translate(${FLAG_SWAY_X[n]}, 0)`); hand.setAttribute("transform", `translate(${FLAG_HAND_X[n]}, 0)`);
    left.setAttribute("transform", `translate(0, ${FLAG_LEFT_HAND_Y[n]})`); showOnly(flags, n);
    if (intro) { if (n < 11) n++; else { intro = false; n = 3; } } else n = n === 11 ? 3 : n + 1;
    setTimeout(t, 100);
  };
  t();
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.querySelectorAll(".clawd").forEach((host) => {
  const pose = host.dataset.pose;
  host.innerHTML = prepare(SVGS[pose === "raise" ? "flag" : "gym"]);
  const s = host.querySelector("svg");
  s.setAttribute("shape-rendering", "crispEdges"); s.removeAttribute("style");
  if (pose === "raise") { if (still) showOnly(kids(kids(s, "g")[0].children[8], "g"), 5); else playFlag(s); }
  else { if (still) showOnly(kids(s, "g"), 32); else playGym(s); }
});
