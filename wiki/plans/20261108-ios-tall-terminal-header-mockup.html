<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>内屏竖开终端页顶部</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Each option: notes, then the Duo inner display open tall (669 × 951 pt, measured from a device screenshot, 1 CSS px = 1 pt, zoomed to fit) fully open and in the laptop pose. Single dark look, matching the app. */
:root {
  --canvas: #0c0c0b; --ink: #e6e6e3; --muted: #8a8a82; --line: #262624; --warn: #c9a227;
  --term: #0a0a0a; --phone: #0f0f0f; --surface: #151514; --card: #1b1b1a; --raise: #262624; --input: #2a2a28;
  --fg: #e6e6e3; --fg2: #75756d; --ok: #4fae6e; --bad: #e05c6a; --info: #6b9bd1;
  --ui: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--canvas); color: var(--ink); font-family: var(--ui); }
.page { max-width: 1340px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 56px; }
header { display: grid; gap: 10px; max-width: 72ch; }
header h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.spec { font-family: var(--mono); font-size: 12px; color: var(--warn); letter-spacing: .04em; }
.opt { display: grid; gap: 18px; }
.notes { display: grid; gap: 10px; max-width: 78ch; }
.notes h2 { margin: 0; font-size: 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.notes h2 .rec { font-size: 12px; font-weight: 600; color: var(--term); background: var(--warn); padding: 2px 8px; border-radius: 99px; }
.notes p { margin: 0; font-size: 14.5px; line-height: 1.65; color: #c8c8c2; }
.notes dl { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; }
.notes dl div { display: flex; gap: 8px; }
.notes dt { color: var(--muted); } .notes dd { margin: 0; font-variant-numeric: tabular-nums; }
.plus { color: var(--ok); } .minus { color: var(--bad); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.fit { min-width: 0; display: grid; gap: 8px; justify-items: start; }
.cap { font-size: 12.5px; color: var(--muted); font-family: var(--mono); letter-spacing: .03em; }

/* ---------- the device: inner display, open tall ---------- */
.dev { width: 669px; height: 951px; position: relative; overflow: hidden; background: var(--term); color: var(--fg); font-family: var(--ui); font-size: 15px;
  border-radius: 34px; box-shadow: 0 0 0 7px #050505, 0 0 0 8.5px #33332f, 0 30px 60px -24px rgba(0,0,0,.8); margin: 9px; display: flex; flex-direction: column; }
.status { flex: none; width: 112px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-weight: 600; font-size: 15px; }
.status .ring { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
/* system top bar (iOS 26: glass buttons over the content) */
.nav { flex: none; height: 48px; margin-top: 24px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px; position: relative; z-index: 2; }
.glass { background: rgba(48,48,45,.72); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.35); backdrop-filter: blur(14px); }
.circ { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.caps { height: 48px; border-radius: 24px; display: flex; align-items: center; padding: 0 8px; flex: none; margin-left: auto; }
.caps span { width: 50px; display: grid; place-items: center; }
.nav svg, .k svg { width: 20px; height: 20px; stroke: #e6e6e3; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav .ttl { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; line-height: 1.2; }
.nav .ttl b { display: block; font-size: 15px; } .nav .ttl small { color: var(--fg2); font-size: 11.5px; }

.termwrap { position: relative; flex: 1; min-height: 0; }
.term { position: absolute; inset: 0; padding: 6px 12px 0 14px; font-family: var(--mono); font-size: 12.5px; line-height: 15.7px; white-space: pre; color: #e4e4e4; overflow: hidden; display: none; }
.term.on { display: block; }
.term .d { color: #6b6b66; } .term .g { color: #4fae6e; } .term .r { color: #e05c6a; } .term .c { color: #e8916c; } .term .b { color: #6f9be0; } .term .y { color: #c9a227; } .term .p { color: #c678dd; }
.term .box { color: #4a4a46; }
.rows { position: absolute; right: 12px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: var(--warn); background: rgba(201,162,39,.12); border: 1px solid rgba(201,162,39,.3); padding: 2px 7px; border-radius: 6px; }

/* dock: quick rows on seven columns (and the extra keys inline in the laptop pose) */
.dock { flex: none; padding: 8px 4px 43px; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 40px; gap: 7px; }
.k { border-radius: 13px; background: var(--input); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--fg); }
.k.wide { grid-column: span 2; gap: 10px; display: flex; justify-content: center; align-items: center; }
.k.wide i { width: 1px; height: 16px; background: var(--line); }
.k.ent { grid-row: span 2; background: #ececea; color: #0f0f0f; border-color: transparent; }
.k.ent svg { stroke: #0f0f0f; }
.k.red { color: var(--bad); }
.k.hot { color: var(--warn); background: rgba(201,162,39,.16); border-color: rgba(201,162,39,.35); }

/* laptop pose: the fold runs across the middle; terminal above, input below */
.upper { height: 465px; flex: none; display: flex; flex-direction: column; }
.fold { flex: none; height: 20px; position: relative; background: linear-gradient(var(--term), #070707 45%, #070707 55%, var(--term)); }
.fold::after { content: "折痕"; position: absolute; right: 14px; top: 3px; font-size: 10.5px; color: #4a4a46; }
.lower { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lower .dock { padding-top: 10px; }

/* ---------- Clawd ---------- */
.clawd { display: inline-flex; width: 18px; height: 18px; flex: none; overflow: visible; }
.clawd svg { width: 18px; height: 18px; display: block; overflow: visible; }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin: 0 2px; }
.s-work { background: var(--ok); } .s-wait { background: var(--warn); } .s-idle { background: var(--fg2); }

/* ---------- the avatar tray (option E from the outer display) ---------- */
.tray { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tray.row { flex: none; height: 48px; padding: 0 10px; }
.tray.inbar { flex: 1; overflow: hidden; padding: 4px 2px; }
.tab { height: 30px; min-width: 30px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-size: 13px; cursor: pointer; position: relative; flex: none; }
.inbar .tab { height: 48px; min-width: 48px; border-radius: 16px; font-size: 16px; }
.inbar .tab.on { padding: 0 16px 0 12px; }
.inbar .clawd, .inbar .clawd svg { width: 24px; height: 24px; }
.tab .nm { display: none; white-space: nowrap; }
.tab.on { padding: 0 12px 0 9px; background: var(--raise); border-color: #34342f; font-weight: 600; }
.tab.on .nm { display: inline; }
.tab .badge { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--term); }
.tab.on .badge { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header>
    <span class="spec">内屏 · 竖着打开 · 669 × 951 pt（按你的截图量的）· 状态栏在顶栏右侧 · 半折时折痕横穿中间</span>
    <h1>竖开终端页的顶部：三种方案</h1>
    <p>每个方案两张图：左边完全打开，右边半折成笔记本姿态（上半终端、下半输入）。都放了三个终端：claude 在干活、另一个 claude 在等你批准、一个 zsh，点头像可以切换。</p>
    <p>顶栏是系统画的（iOS 26 的玻璃按钮），时间和电量就挤在它右边；返回键必须在顶栏上。四个按钮依次是新建终端、附件、粘贴、更多。终端右下角的黄色小签是这一版终端能显示的行数（一行约 15.7 pt）。</p>
  </header>
</div>

const glyph = (t) => t.pose ? `<span class="clawd" data-pose="${t.pose}"></span>` : `<span class="sdot s-${t.state}"></span>`;
const tray = (cls) => `<div class="tray ${cls}">${TERMINALS.map((t, i) =>
  `<span class="tab" data-i="${i}">${glyph(t)}<span class="nm">${t.name}</span>${t.state === "wait" ? '<span class="badge s-wait"></span>' : ""}</span>`).join("")}</div>`;

const status = `<div class="status"><span>20:39</span><span class="ring"></span></div>`;
const nav = (key) => `<div class="nav">
  <span class="circ glass">${svg("back")}</span>
  ${key === "B" ? tray("inbar") : ""}
  <span class="caps glass"><span>${svg("plus")}</span><span>${svg("clip")}</span><span>${svg("paste")}</span><span>${svg("more")}</span></span>
  ${status}
</div>`;
const terms = `<div class="termwrap">${TERM_TEXT.map((x, i) => `<div class="term" data-i="${i}">${x}</div>`).join("")}<span class="rows"></span></div>`;
const quick = `
  <span class="k" data-q="esc">esc</span><span class="k" data-q="tab">tab</span>
  <span class="k wide">${svg("kbd")}<i></i>${svg("mic")}</span>
  <span class="k">↑</span><span class="k">${svg("del")}</span><span class="k ent">${svg("ret")}</span>
  <span class="k red" data-q="c">^C</span><span class="k">^D</span><span class="k">/</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span>`;
const extra = ["1","2","3","4","q",":","~","⇧⇥","^R","^U","^L","^Z","|","^W"].map((k) => `<span class="k">${k}</span>`).join("");

function device(key, laptop) {
  const rowTray = key === "A" ? tray("row") : "";
  const bottomTray = key === "C" ? tray("row") : "";
  if (!laptop) {
    return `<div class="dev" data-active="0">${nav(key)}${rowTray}${terms}${bottomTray}<div class="dock">${quick}</div></div>`;
  }
  return `<div class="dev" data-active="0">
    <div class="upper">${nav(key)}${rowTray}${terms}</div>
    <div class="fold"></div>
    <div class="lower">${bottomTray}<div class="dock">${quick}${extra}</div></div>
  </div>`;
}

function select(dev, i) {
  dev.querySelectorAll("[data-i]").forEach((el) => el.classList.toggle("on", +el.dataset.i === i));
  // While the active agent waits, esc / tab / ^C become the option keys 1 2 3.
  const waiting = TERMINALS[i].state === "wait";
  const q = (k, on, off) => { const el = dev.querySelector(`[data-q="${k}"]`); el.textContent = waiting ? on : off; el.classList.toggle("hot", waiting); el.classList.toggle("red", !waiting && k === "c"); };
  q("esc", "1", "esc"); q("tab", "2", "tab"); q("c", "3", "^C");
}

document.querySelector(".page").insertAdjacentHTML("beforeend", OPTIONS.map((o) => `
  <section class="opt">
    <div class="notes">
      <h2>${o.key} · ${o.title}${o.rec ? '<span class="rec">推荐</span>' : ""}</h2>
      <dl data-metrics="${o.key}"></dl>
      <p>${o.body}</p>
      <p>${o.fit}</p>
    </div>
    <div class="pair">
      <div class="fit"><span class="cap">完全打开</span><div class="zoom">${device(o.key, false)}</div></div>
      <div class="fit"><span class="cap">半折 · 笔记本姿态</span><div class="zoom">${device(o.key, true)}</div></div>
    </div>
  </section>`).join(""));

document.querySelectorAll(".dev").forEach((dev) => {
  select(dev, 0);
  dev.addEventListener("click", (e) => {
    const hit = e.target.closest(".tab[data-i]");
    if (hit) select(dev, +hit.dataset.i);
  });
});

// Rows each terminal fits, measured from the laid-out mockup at true size.
function measure() {
  const rows = [...document.querySelectorAll(".opt")].map((sec) => [...sec.querySelectorAll(".termwrap")].map((w) => {
    const z = parseFloat(w.closest(".zoom").style.zoom || 1);
    const h = w.getBoundingClientRect().height / z - 6;
    const n = Math.floor(h / 15.7);
    w.querySelector(".rows").textContent = `${n} 行`;
    return n;
  }));
  const base = rows[0];
  document.querySelectorAll("[data-metrics]").forEach((dl, i) => {
    const [open, lap] = rows[i];
    const d = (n, b) => n === b ? "" : ` <span class="${n > b ? "plus" : "minus"}">${n > b ? "+" : ""}${n - b}</span>`;
    dl.innerHTML = `<div><dt>打开时终端</dt><dd>${open} 行${i ? d(open, base[0]) : ""}</dd></div><div><dt>半折时终端</dt><dd>${lap} 行${i ? d(lap, base[1]) : ""}</dd></div>`;
  });
}

// Fit each 669 × 951 pt device into its column, never above true size.
function fit() {
  document.querySelectorAll(".fit").forEach((box) => {
    box.querySelector(".zoom").style.zoom = Math.min(1, box.clientWidth / 687);
  });
  measure();
}
addEventListener("resize", fit); fit();

/* ---- Clawd: ported from apps/desktop/src/renderer/components/workbench/clawd-glyph.tsx ---- */
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
const GYM_SEQUENCE = [...range(0, 13), ...range(13, 25), ...range(13, 25), ...range(25, 36)];
const CONFETTI_Y = [-65, -72, -76, -70, -58, -42, -22, 0];
const FLAG_HAND_X = [0, -6, -12, -14, -8, -2, 0, 0, -4, -10, -16, -18];
const FLAG_SWAY_X = [0, 0, -5, -5, 0, 4, 4, 4, 0, 0, -5, -5];
const FLAG_LEFT_HAND_Y = [0, 0, 4, 4, 0, 0, 0, 0, 0, 0, 4, 4];
const prepare = (raw) => raw.replace(/#DD775B/gi, "#D97757").replace(/\sclass="[^"]*"/g, "").replace(/\sid="[^"]*"/g, "").replace(/\sdata-svg-origin="[^"]*"/g, "");
const kids = (p, tag) => [...p.children].filter((el) => el.tagName === tag);
const showOnly = (els, n) => els.forEach((el, i) => { el.style.display = i === n ? "inline" : "none"; });
const gymDelay = (s, f) => s === GYM_SEQUENCE.length - 1 ? 1500 : (f === 6 || f === 7) ? 270 : (f === 15 || f === 21) ? 400 : 85;
function playGym(s) { const fr = kids(s, "g"); let i = 0; const t = () => { const f = GYM_SEQUENCE[i]; showOnly(fr, f); const d = gymDelay(i, f); i = (i + 1) % GYM_SEQUENCE.length; setTimeout(t, d); }; t(); }
function playFlag(s) {
  const body = kids(s, "g")[0], left = body.children[5], hand = body.children[8], flags = kids(hand, "g");
  body.removeAttribute("transform"); body.style.transform = ""; hand.removeAttribute("transform"); hand.style.transform = "";
  let n = 0, intro = true;
  const t = () => {
    body.setAttribute("transform", `translate(${FLAG_SWAY_X[n]}, 0)`); hand.setAttribute("transform", `translate(${FLAG_HAND_X[n]}, 0)`);
    left.setAttribute("transform", `translate(0, ${FLAG_LEFT_HAND_Y[n]})`); showOnly(flags, n);
    if (intro) { if (n < 11) n++; else { intro = false; n = 3; } } else n = n === 11 ? 3 : n + 1;
    setTimeout(t, 100);
  };
  t();
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.querySelectorAll(".clawd").forEach((host) => {
  const pose = host.dataset.pose;
  host.innerHTML = prepare(SVGS[pose === "raise" ? "flag" : "gym"]);
  const s = host.querySelector("svg");
  s.setAttribute("shape-rendering", "crispEdges"); s.removeAttribute("style");
  if (pose === "raise") { if (still) showOnly(kids(kids(s, "g")[0].children[8], "g"), 5); else playFlag(s); }
  else { if (still) showOnly(kids(s, "g"), 32); else playGym(s); }
});
