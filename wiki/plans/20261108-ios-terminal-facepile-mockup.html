<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>终端头像组定稿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Three decisions, each a row of true-scale Duo screens (outer 466 × 678 pt, inner open tall 669 × 951 pt) zoomed to fit, beside a lettered pick. Single dark look, matching the app. */
:root {
  --canvas: #0c0c0b; --ink: #e6e6e3; --muted: #8a8a82; --line: #262624; --warn: #c9a227;
  --term: #0a0a0a; --phone: #0f0f0f; --card: #1b1b1a; --raise: #262624; --input: #2a2a28;
  --fg: #e6e6e3; --fg2: #75756d; --ok: #4fae6e; --bad: #e05c6a; --info: #6b9bd1;
  --ui: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--canvas); color: var(--ink); font-family: var(--ui); }
.page { max-width: 1500px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 64px; }
header { display: grid; gap: 10px; max-width: 78ch; }
header h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.spec { font-family: var(--mono); font-size: 12px; color: var(--warn); letter-spacing: .04em; }
.pick { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.pick button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; cursor: pointer; }
.pick button.on { background: var(--ink); color: var(--term); border-color: var(--ink); font-weight: 600; }
section.q { display: grid; gap: 22px; }
section.q > h2 { margin: 0; font-size: 22px; display: flex; gap: 12px; align-items: baseline; }
section.q > h2 .n { font-family: var(--mono); font-size: 14px; color: var(--warn); }
section.q > p { margin: 0; max-width: 80ch; color: #c8c8c2; font-size: 14.5px; line-height: 1.65; }
.row { display: grid; gap: 22px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); align-items: start; }
@media (max-width: 900px) { .row { grid-template-columns: minmax(0, 1fr); } }
.cell { min-width: 0; display: grid; gap: 10px; align-content: start; }
.cell h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cell h3 .rec { font-size: 11.5px; font-weight: 600; color: var(--term); background: var(--warn); padding: 2px 8px; border-radius: 99px; }
.cell p { margin: 0; font-size: 13.5px; line-height: 1.6; color: #b9b9b2; }
.fit { min-width: 0; }

.dev { position: relative; overflow: hidden; background: var(--term); color: var(--fg); font-family: var(--ui); font-size: 15px; margin: 9px;
  box-shadow: 0 0 0 7px #050505, 0 0 0 8.5px #33332f, 0 30px 60px -24px rgba(0,0,0,.8); }
svg.i { width: 20px; height: 20px; stroke: #e6e6e3; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.outer { width: 466px; height: 678px; border-radius: 20px 56px 56px 20px; background: var(--phone); }
.outer .col { position: absolute; left: 0; top: 0; bottom: 0; width: 394px; background: var(--term); display: flex; flex-direction: column; overflow: hidden; }
/* Outer display: no system title bar (it took ~80 pt); a 44 pt row of its own instead —
   the terminal's name and project · branch · device on the left, the avatars on the right. */
.otitle { flex: none; height: 44px; margin-top: 6px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 12px; position: relative; z-index: 6; }
.otitle .tt { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
.otitle b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.otitle small { color: var(--fg2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad.inrow { position: relative; top: 0; right: 0; flex: none; }
.rail { position: absolute; right: 0; top: 0; bottom: 0; width: 72px; }
.rail .time { position: absolute; top: 76px; width: 72px; text-align: center; font-weight: 700; font-size: 17px; }
.rail .ring { position: absolute; top: 104px; left: 17px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
.rail .btn, .rail .grp { position: absolute; left: 13px; width: 46px; background: #222220; border: 1px solid #2e2e2b; display: grid; justify-items: center; align-content: space-evenly; }
.rail .btn { top: 168px; height: 46px; border-radius: 50%; }
.rail .grp.a { top: 226px; height: 98px; border-radius: 23px; }
.rail .grp.b { bottom: 24px; height: 98px; border-radius: 23px; }
.inner { width: 669px; height: 951px; border-radius: 34px; display: flex; flex-direction: column; }
.nav { flex: none; height: 48px; margin-top: 24px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px; position: relative; z-index: 8; }
.glass { background: rgba(48,48,45,.72); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.35); }
.circ { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.caps { height: 48px; border-radius: 24px; display: flex; align-items: center; padding: 0 8px; flex: none; position: relative; }
.caps span { width: 50px; display: grid; place-items: center; }
.status { flex: none; width: 104px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-weight: 600; }
.status .ring { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #e6e6e3; border-right-color: #555; }
.nav .ttl { flex: 1; min-width: 0; text-align: left; line-height: 1.25; }
.nav .ttl b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .ttl small { color: var(--fg2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.termwrap { position: relative; flex: 1; min-height: 0; }
.term { position: absolute; inset: 0; padding: 0 12px 0 14px; font-family: var(--mono); font-size: 12.5px; line-height: 15.7px; white-space: pre; color: #e4e4e4; overflow: hidden; }
.inner .term { padding-top: 8px; }
.term .d { color: #6b6b66; } .term .g { color: #4fae6e; } .term .c { color: #e8916c; } .term .p { color: #c678dd; } .term .box { color: #4a4a46; } .term .r { color: #e05c6a; } .term .y { color: #c9a227; }
.dock { flex: none; padding: 8px 4px 25px; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 40px 40px; gap: 7px; }
.inner .dock { padding-bottom: 43px; }
.k { border-radius: 13px; background: var(--input); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 14px; font-weight: 600; }
.k.wide { grid-column: span 2; } .k.ent { grid-row: span 2; background: #ececea; color: #0f0f0f; } .k.red { color: var(--bad); }

/* glyphs */
.clawd { display: inline-flex; width: 18px; height: 18px; flex: none; overflow: visible; }
.clawd svg { width: 100%; height: 100%; display: block; overflow: visible; }
.gl { display: inline-grid; place-items: center; flex: none; }
.gl.codex { font-family: var(--mono); font-weight: 700; font-size: 11px; }
.gl.sh svg.i { width: 15px; height: 15px; stroke: var(--fg2); }
.s-work { background: var(--ok); } .s-wait { background: var(--warn); } .s-done { background: var(--info); } .s-idle { background: var(--fg2); }
.t-work { color: var(--ok); } .t-wait { color: var(--warn); } .t-done { color: var(--info); } .t-idle { color: var(--fg2); }

/* avatars */
/* The ring is the state (home tones); the dot at the bottom right marks the active terminal
   only. Earlier avatars lie on top of later ones; the active one rises above them all. */
.av { --sz: 32px; width: var(--sz); height: var(--sz); border-radius: 50%; background: var(--card); border: 2px solid rgba(230,230,227,.16); display: grid; place-items: center; position: relative; flex: none; cursor: pointer; box-shadow: 0 0 0 2px var(--term), 0 3px 8px rgba(0,0,0,.6); }
.av.r-work { border-color: var(--ok); } .av.r-wait { border-color: var(--warn); } .av.r-done { border-color: var(--info); }
.av .cur { position: absolute; right: -2px; bottom: -2px; width: 30%; height: 30%; border-radius: 50%; background: var(--fg); border: 2px solid var(--term); display: none; }
.av.on .cur { display: block; }
.av.on { z-index: 200 !important; }
.av .clawd { width: 58%; height: 58%; }
/* No pad behind the cluster: each avatar floats on its own shadow. */
.pad { position: absolute; top: 10px; right: 10px; z-index: 5; display: flex; align-items: center; }
/* F4: one size, the active one opens a gap on both sides and leaves the pile */
.F4 .av { --sz: 30px; transition: margin .25s ease; }
.F4 .av + .av { margin-left: -10px; }
.F4 .av.on:not(:first-child), .F4 .av.on + .av { margin-left: 5px; }
@media (prefers-reduced-motion: reduce) { .F4 .av { transition: none; } }

/* the list under the avatars */
.drop { position: absolute; top: calc(100% + 8px); right: 0; width: 300px; display: none; z-index: 9; }
.open .drop { display: block; }
.L1 { background: var(--card); border-radius: 18px; padding: 6px; box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 20px 50px rgba(0,0,0,.65); }
.L1 .lrow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; min-width: 0; cursor: pointer; }
.L1 .lrow.on { background: var(--raise); }
.L1 .txt { min-width: 0; display: grid; gap: 1px; flex: 1; }
.L1 b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.L1 small { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.L1 .ck { font-weight: 700; font-size: 13px; }
.L1 .lnew { display: flex; align-items: center; gap: 10px; padding: 10px; font-size: 14.5px; color: var(--fg2); border-top: 1px solid var(--line); margin-top: 4px; }
.L1 .lnew svg.i { width: 16px; height: 16px; stroke: var(--fg2); }
/* L2: the system menu */
.L2 { background: #262624; border-radius: 22px; padding: 6px 0; box-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.65); }
.L2 .hd { font-size: 12.5px; color: var(--fg2); padding: 6px 16px 6px 38px; }
.L2 .mrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 26px; align-items: center; gap: 4px; padding: 8px 16px 8px 8px; cursor: pointer; }
.L2 .ck { justify-self: center; font-size: 15px; font-weight: 700; }
.L2 .txt { min-width: 0; display: grid; gap: 1px; }
.L2 .t { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.L2 .s { font-size: 12.5px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.L2 .ic { justify-self: end; display: grid; place-items: center; }
.L2 .ic .clawd { width: 20px; height: 20px; }
.L2 .msep { height: 8px; background: #1a1a19; margin: 4px 0; }

/* banner at the bottom, under the scroll-to-bottom button */
.bottomstack { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; justify-items: end; gap: 8px; padding: 0 8px 8px; }
.fab { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; margin-right: 4px; }
.fab svg.i { width: 16px; height: 16px; }
.banner { justify-self: stretch; display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 14px; border-radius: 16px; background: color-mix(in srgb, var(--warn) 12%, var(--card)); border: 1px solid rgba(201,162,39,.3); color: var(--warn); font-size: 13px; font-weight: 500; }
.banner span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner b { background: rgba(201,162,39,.22); border-radius: 99px; padding: 5px 12px; font-size: 13px; }

/* 更多 menu in the inner top bar */
.more { position: absolute; top: calc(100% + 8px); right: 0; width: 260px; background: #262624; border-radius: 22px; padding: 6px 0; box-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.65); z-index: 9; }
.more .mi { display: flex; align-items: center; justify-content: space-between; padding: 11px 18px; font-size: 16px; }
.more .mi svg.i { width: 18px; height: 18px; }
.more .mi.red { color: var(--bad); } .more .mi.red svg.i { stroke: var(--bad); }
.more .msep { height: 8px; background: #1a1a19; margin: 4px 0; }
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 7; }
</style>

<div class="page">
  <header>
    <span class="spec">外屏：自己的 44 pt 标题行（左名字、右头像），不用系统标题 · 内屏竖开：系统顶栏 + 头像浮在终端右上角 · 提示条放底部</span>
    <h1>终端头像组</h1>
    <p>① 头像组（定稿 F4）；② 点开以后的列表：自绘卡片还是系统菜单；③ 整页上提示条和「更多」菜单的位置。</p>
    <div class="pick" data-count>终端数 <button data-n="1">1 个</button><button data-n="3">3 个</button><button data-n="5" class="on">5 个</button><button data-n="8">8 个</button></div>
  </header>
</div>

function cluster(style, active) {

function list(kind, active) {
  if (kind === "L2") return `<div class="drop L2"><div class="hd">coflux · MacBook Pro</div>${T.map((t, i) => `<div class="mrow" data-i="${i}"><span class="ck">${i === active ? "✓" : ""}</span><span class="txt"><span class="t">${t.title}</span><span class="s">${t.label}</span></span><span class="ic">${glyph(t, true)}</span></div>`).join("")}

  const attrs = `data-cfg='${JSON.stringify(cfg)}' data-active="0"`;
  if (cfg.form === "outer") return `<div class="dev outer" ${attrs}><div class="col"><div class="otitle"><div class="tt"><b data-tt></b><small>coflux · dev/20261107-ios-duo-redesign · MacBook Pro</small></div>${pad}</div>${body}${dock}</div>

      <div class="grp a">${svg("plus")}${svg("more")}</div><div class="grp b">${svg("clip")}${svg("paste")}</div></div></div>`;
  const moreMenu = cfg.more ? `<div class="more"><div class="mi">粘贴${svg("paste")}</div><div class="mi">从相册上传${svg("photo")}</div><div class="mi">上传文件${svg("folder")}</div><div class="msep"></div>
    <div class="mi">复制终端 ID${svg("copy")}</div><div class="mi red">停止并删除终端${svg("trash")}</div></div>` : "";
  return `<div class="dev inner" ${attrs}>${cfg.more ? '<div class="dim"></div>' : ""}

}

function render(dev) {
  const cfg = JSON.parse(dev.dataset.cfg);
  const active = Math.min(+dev.dataset.active, T.length - 1);
  dev.dataset.active = active;
  const pad = dev.querySelector("[data-pad]");
  pad.innerHTML = cluster(cfg.style, active) + (cfg.list ? list(cfg.list, active) : "");
  pad.classList.toggle("open", dev.dataset.open === "1");
  dev.querySelector("[data-tt]").textContent = T[active].title;
  animateClawds(pad);
}

queueMicrotask(() => document.querySelectorAll(".dev").forEach((dev) => {
  dev.dataset.open = JSON.parse(dev.dataset.cfg).open ? "1" : "0";
  render(dev);
  dev.addEventListener("click", (e) => {
    const cfg = JSON.parse(dev.dataset.cfg);
    const toggle = e.target.closest("[data-toggle]");
    const hit = e.target.closest("[data-i]");
    if (toggle && cfg.list) { dev.dataset.open = dev.dataset.open === "1" ? "0" : "1"; return render(dev); }
    if (hit && +hit.dataset.i >= 0) { dev.dataset.active = hit.dataset.i; if (!cfg.open) dev.dataset.open = "0"; render(dev); }
  });
}));

document.querySelector("[data-count]").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-n]");
  if (!b) return;
  document.querySelectorAll("[data-count] button").forEach((x) => x.classList.toggle("on", x === b));
  T = ALL.slice(0, +b.dataset.n);
  document.querySelectorAll(".dev").forEach(render);
});

function fit() {
  document.querySelectorAll(".fit").forEach((box) => {
    box.querySelector(".zoom").style.zoom = Math.min(1, box.clientWidth / +box.dataset.w);
  });
}
addEventListener("resize", fit); fit();

/* ---- Clawd: ported from apps/desktop/src/renderer/components/workbench/clawd-glyph.tsx ---- */
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
const GYM_SEQUENCE = [...range(0, 13), ...range(13, 25), ...range(13, 25), ...range(25, 36)];
const CONFETTI_Y = [-65, -72, -76, -70, -58, -42, -22, 0];
const FLAG_HAND_X = [0, -6, -12, -14, -8, -2, 0, 0, -4, -10, -16, -18];
const FLAG_SWAY_X = [0, 0, -5, -5, 0, 4, 4, 4, 0, 0, -5, -5];
const FLAG_LEFT_HAND_Y = [0, 0, 4, 4, 0, 0, 0, 0, 0, 0, 4, 4];
const prepare = (raw) => raw.replace(/#DD775B/gi, "#D97757").replace(/\sclass="[^"]*"/g, "").replace(/\sid="[^"]*"/g, "").replace(/\sdata-svg-origin="[^"]*"/g, "");
const kids = (p, tag) => [...p.children].filter((el) => el.tagName === tag);
const showOnly = (els, n) => els.forEach((el, i) => { el.style.display = i === n ? "inline" : "none"; });
const gymDelay = (s, f) => s === GYM_SEQUENCE.length - 1 ? 1500 : (f === 6 || f === 7) ? 270 : (f === 15 || f === 21) ? 400 : 85;
function playGym(s) { const fr = kids(s, "g"); let i = 0; const t = () => { const f = GYM_SEQUENCE[i]; showOnly(fr, f); const d = gymDelay(i, f); i = (i + 1) % GYM_SEQUENCE.length; if (s.isConnected) setTimeout(t, d); }; t(); }
function playFlag(s) {
  const body = kids(s, "g")[0], left = body.children[5], hand = body.children[8], flags = kids(hand, "g");
  body.removeAttribute("transform"); body.style.transform = ""; hand.removeAttribute("transform"); hand.style.transform = "";
  let n = 0, intro = true;
  const t = () => {
    body.setAttribute("transform", `translate(${FLAG_SWAY_X[n]}, 0)`); hand.setAttribute("transform", `translate(${FLAG_HAND_X[n]}, 0)`);
    left.setAttribute("transform", `translate(0, ${FLAG_LEFT_HAND_Y[n]})`); showOnly(flags, n);
    if (intro) { if (n < 11) n++; else { intro = false; n = 3; } } else n = n === 11 ? 3 : n + 1;
    if (s.isConnected) setTimeout(t, 100);
  };
  t();
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateClawds(root) {
  root.querySelectorAll(".clawd").forEach((host) => {
    const pose = host.dataset.pose;
    host.innerHTML = prepare(SVGS[pose === "raise" ? "flag" : "gym"]);
    const s = host.querySelector("svg");
    s.setAttribute("shape-rendering", "crispEdges"); s.removeAttribute("style");
    if (pose === "raise") { if (still) showOnly(kids(kids(s, "g")[0].children[8], "g"), 5); else playFlag(s); }
    else if (pose === "rest" || still) showOnly(kids(s, "g"), pose === "rest" ? 0 : 32);
    else playGym(s);
  });
}
