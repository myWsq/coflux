# Rust workspace: the daemon is pure Rust, no node runtime.
# Device process set (plan 20261002-runtime-launcher-merge): coflux-ptyd (owns every PTY, near-zero
# change rate), coflux-launcher (version pointer, probation, rollback; rarely changes) and
# coflux-runtime (sessiond + centre connection + git/exec/fs + local gateway; the unit that updates).
[workspace]
resolver = "2"
members = ["crates/protocol", "crates/ptyd", "crates/launcher", "crates/runtime", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# runtime：与 proto/buf.gen.yaml 的 neoeinstein-prost 插件生成的代码（crates/protocol/src/gen）
# 匹配的 prost 版本，wire 信封编解码用。
prost = "0.13"
